body = '''
var mst_ncz(vars Price, int StochPeriod, int HPPeriod, int SSPeriod, var* pRoof, var* pStoc)
{
	vars ncz_Roof = series(RoofingFilter(Price, HPPeriod, SSPeriod), StochPeriod);
	var ncz_HH = ncz_Roof[0];
	var ncz_LL = ncz_Roof[0];
	int ncz_i;
	for(ncz_i = 1; ncz_i < StochPeriod; ncz_i++) {
		if(ncz_Roof[ncz_i] > ncz_HH) ncz_HH = ncz_Roof[ncz_i];
		if(ncz_Roof[ncz_i] < ncz_LL) ncz_LL = ncz_Roof[ncz_i];
	}
	var ncz_Stoc = 1;
	ncz_Stoc = ncz_Stoc / 2;
	if(ncz_HH != ncz_LL)
		ncz_Stoc = (ncz_Roof[0] - ncz_LL) / (ncz_HH - ncz_LL);
	var ncz_k = sqrt(2.0);
	var ncz_a1 = exp(-ncz_k * PI / SSPeriod);
	var ncz_b1 = 2.0 * ncz_a1 * cos(ncz_k * PI / SSPeriod);
	var ncz_c2 = ncz_b1;
	var ncz_c3 = -ncz_a1 * ncz_a1;
	var ncz_c1 = 1.0 - ncz_c2 - ncz_c3;
	vars ncz_S = series(0, 2);
	vars ncz_Y = series(0, 3);
	ncz_S[0] = ncz_Stoc;
	ncz_Y[0] = ncz_c1 * (ncz_S[0] + ncz_S[1]) / 2.0 + ncz_c2 * ncz_Y[1] + ncz_c3 * ncz_Y[2];
	*pRoof = ncz_Roof[0];
	*pStoc = ncz_Stoc;
	return ncz_Y[0];
}'''
