[pass_condition]
text = """MESAStochastic source fidelity and implementation PASS only if ALL of the following hold; any other outcome is FAIL, recorded and kept (CLAUDE.md
section 4.8), and its cause found before anything is changed:
1. All 84 real checks PASS: 4 variants (L14, L20, L30, S20) x 21 checks = Roof: flat, 5 sine gains, alt gain, 5 sine phases, ramp residual (13) +
   out: 5 trace (one per sine), 2 invariance (sc, of) (7) + stoc: 1 bound (1), against the tables / model above at the tolerances above. The alt phase row of
   every variant that exports roof (10 rows: 4 real, 2 info, 4 controls) is SKIP (expected gain < phase_gate), not PASS, and is not one of the 84.
   INFO rows (flat / ramp of out, start-up rows < W) are written with result INFO and are not counted. A SKIP row where the checker should have checked
   (or the reverse) is a failed run.
2. Each of the 5 negative controls (NCW, NCA, NCP, NC1, NCS) FAILS on every kind listed in [detect.required]. A control that passes = harness broken.
3. No input guard fires (x[n] and the copies vs recomputed, tol 1e-12; clock range), no row is ERROR in ANY variant (a gate that removes every row of a sine is an ERROR),
   no NaN / infinite value. The NCL and NCZ rows (role info) are written as INFO, never PASS / FAIL, and are not counted in item 1.
4. No line starting with 'Error' in the Zorro window (gotchas 9d.3). The EXITRUN marker / EXIT line is NOT a check (gotchas 9d.4: it never fires).
5. The results file reports the variant count: 4 real + 5 negative controls + 2 info (NCL, NCZ) = 11 variants.
6. IMP: every [imp].must_pass replay <= 1e-9 (11 variants), and every [imp].must_fail replay > 1e-9 (2 rows; guards seen to fire).
7. Floor guard: for every real variant, max |Zorro - book| <= tolerance / 10 for gain (3e-6), phase (3e-6 rad), resid (1e-10), trace (5e-6) and invariance (1e-10)
   (D2 rule 3 floor side; flat: tolerance / 10 = 1e-10). If exceeded, the window is invalid: the result is NOT accepted until explained, even if items 1-6 hold.
Pre-run (not run-time) conditions, done before the [Test] click and recorded in Amendment 1 (stage 2):
   (i) the corrected MESAStochastic.c contains [corrected_code].lines and wrapper_lines verbatim (whitespace-normalised, comments stripped);
   (ii) the current MESAStochastic.c blob (a8c51bacf951cd1aa7a0d1c2f39347824ca1d6bf at c760160) is recorded and the corrected file differs from it only by M-1, M-2, M-6, M-8, M-9; MESAStochastic_Superseded.c is the current body verbatim, renamed mstc_ -> mstco_;
   (iii) reference.py reproduces this file's expected tables, floors, effects, [findings] and IMP fire-test numbers to <= 1e-9 (relative 1e-9 for values > 1). Every number is stored at full
        precision (HPF Amendment 1, A1.2). Each inline control body is checked at run time, not by reading: IMP must_pass replays every variant with its own model (pass item 6);
   (iv) generator --lint-only passes on this file (D2 windows ok, every margin >= 10x; after stage 2 also the two includes resolve)."""


