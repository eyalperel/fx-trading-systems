O_WINDOW = "(b) M-1 shows only at T > L: the 21-bar window (NCW, article model) vs the L20 article differs by 7.593925488436071e-14 / 1.1546319456101628e-14 / 6.494804694057166e-15 at T = 5 / 10 / 20 (a 20-bar window spans whole cycles) and by 0.06206839941904896 / 0.08053344297750009 at T = 40 / 100 ([findings] window_ncw_article_T*). Recorded as an observation; the control's effect (and its detection) is the T = 100 value, 1611x the trace tolerance. The sine set includes T = 40 and 100 for this reason."
O_STARTUP = "(a)/(b) No start-up rule is printed (M-4 / M-5): rows < W of out are INFO rows (info-startup) for the real variants and NCZ; the replay and the trace start at W = 700. Finding 7: L20, T = 20, rows 0-3: out 0.5, 0.5632987004029524, 0.6999002012721725, 0.8320600073104027; Stoc 0.5, 1.0, 1.0, 1.0 (row 0 is the zero-range fallback); source zero final seed vs library seed: max |diff| 0.4367012995970475, last row with |diff| > 1e-12 = 59 (same for all five sines)."
O_NCZ_IMP = "(b) NCZ (source zero final seed) differs from the library in rows 0-59 only; IMP and trace read rows >= W = 700, so NCZ's replay residual is at the rounding level (listed in [imp.fire_test.discrimination], not required to exceed the tolerance). The seed is measured by the info-startup row (rows < W) of NCZ, INFO only."
O_NO_STATICS = "(b) D6 rule 5 is NOT APPLICABLE: no statics in MESAStochastic.c, RoofingFilter.c, HighPassFilter.c, SuperSmoother2Pole.c (all state per-call series(); review §4). No shared-state control is invented. The layout runs every variant as its own instance every bar; IMP replays each against its own model."
O_RAMP_ILLCONDITIONED = "(b) Flat / alt / ramp rows of the normalised output are INFO only (D6 rule 2): the stochastic divides by HighestC - LowestC, which on these inputs is Roof rounding noise (the ramp Roof is the HP second difference of a ramp ~ 1e-18). On flat the model range is exactly 0 and Stoc = 0.5 (M-6); in Zorro this is to be observed, not relied on."
O_OUTPUT_UNBOUNDED = "(b) The final output is NOT bounded to [0, 1]: the second SuperSmoother overshoots. Article model out range, rows >= 700, L20: [-0.027531499995811497, 1.0275314999958118] at T = 40 and [-0.029452071305996183, 1.02945207130599] at T = 100 ([findings] out_min / out_max_L20_T*; review §4 has the same to ~2e-15). The bound check therefore reads the raw Stoc."
O_NCS_BOUND = "(b) The model of the superseded file has Stoc up to 100.00000000000001 (scale 100, fallback 50: M-2 / M-6): the raw bound [0, 1] would fire on it. The superseded function returns only the final output, so the run has no stoc column for NCS and no bound row; NCS is detected by trace (the 0-100 scale, ~100x)."
O_GATE = "(b) Gate margin (HighestC - LowestC)/amplitude, rows >= W, model: min over the sine set L14 0.0284 (T = 100), L20 0.058, L30 0.127, S20 0.059 (finding 4). The gate g = 0.01 excludes no row of a correct variant; the margin is 2.8x at the tightest point, the thinnest of the oscillator specs so far."
O_NCL = "(b) NCL = the article as printed (.707, 1.414, 3.14159), INFO, never PASS/FAIL (D1 rule 3): Roof gain effect 9.930912469835462e-05 (3.3x tol), phase 0.00024997116087721594 (8.3x tol), trace up to 0.0006125625890712749 (12x tol). CONSTRUCTION (accepted 2026-11-19, user): the printed literals are built from integers at run time, k = 707/1000, f = 1414/1000, g = 314159/100000; the article's degree arguments are converted with the Zorro PI macro (float32 3.14159): HP alpha argument .707*360/HPPeriod deg -> k * 2.0 * PI / HPPeriod rad; SS a1 = exp(-f * g / SSPeriod) (the printed 3.14159, no conversion); SS b1 cosine 1.414*180/SSPeriod deg -> f * PI / SSPeriod rad; the same SS coefficients in the roofing and the final SuperSmoother. The NCL body above (pre-registered here, compiled as is in the run) and reference IMP model mesa_printed(20,48,10) (_mesa_filters, literals = printed) use exactly this construction, so IMP must_pass replays it (test_reference_mst: NCL construction). (b) The planning chat's printed-literal numbers (Roof 9.933e-05 / 2.500e-04; trace 6.170885774015034e-05 ... 0.0006127120163363919) differ from this model by up to 2.4e-4 relative (4th digit): the brief did not fix the degree conversion (stage-1 report)."
