kind = "inline"
function = "mst_ncl"
params = [20, 48, 10]
expected = "L20"
outputs = ["roof", "stoc", "out"]
comment = "INFO variant (not a control, not in [detect]; D1 rule 3): the article as PRINTED, .707, 1.414 and 3.14159 built from integers at run time (707/1000, 1414/1000, 314159/100000, gotchas 9d.1 / 9d.8) in the HP, the roofing SuperSmoother and the final SuperSmoother; the cosines' 360 / 180 degrees are the PI macro (Zorro float32 PI, as the other variants). Everything else as [corrected_code]. (20, 48, 10). Reported, never PASS/FAIL."
body = '''
var mst_ncl(vars Price, int StochPeriod, int HPPeriod, int SSPeriod, var* pRoof, var* pStoc)
{
	var ncl_k = 707;
	ncl_k = ncl_k / 1000;
	var ncl_f = 1414;
	ncl_f = ncl_f / 1000;
	var ncl_g = 314159;
	ncl_g = ncl_g / 100000;
	var ncl_arg = ncl_k * 2.0 * PI / HPPeriod;
	var ncl_alpha = (cos(ncl_arg) + sin(ncl_arg) - 1.0) / cos(ncl_arg);
	vars ncl_HP = series(0, 3);
	ncl_HP[0] = (1.0 - ncl_alpha / 2.0) * (1.0 - ncl_alpha / 2.0) * (Price[0] - 2.0 * Price[1] + Price[2]) + 2.0 * (1.0 - ncl_alpha) * ncl_HP[1] - (1.0 - ncl_alpha) * (1.0 - ncl_alpha) * ncl_HP[2];
	var ncl_a1 = exp(-ncl_f * ncl_g / SSPeriod);
	var ncl_b1 = 2.0 * ncl_a1 * cos(ncl_f * PI / SSPeriod);
	var ncl_c2 = ncl_b1;
	var ncl_c3 = -ncl_a1 * ncl_a1;
	var ncl_c1 = 1.0 - ncl_c2 - ncl_c3;
	vars ncl_R = series(ncl_HP[0], 3);
	vars ncl_F = series(ncl_R[0], 3);
	ncl_F[0] = ncl_c1 * (ncl_R[0] + ncl_R[1]) / 2.0 + ncl_c2 * ncl_F[1] + ncl_c3 * ncl_F[2];
	vars ncl_Roof = series(ncl_F[0], StochPeriod);
	var ncl_HH = ncl_Roof[0];
	var ncl_LL = ncl_Roof[0];
	int ncl_i;
	for(ncl_i = 1; ncl_i < StochPeriod; ncl_i++) {
		if(ncl_Roof[ncl_i] > ncl_HH) ncl_HH = ncl_Roof[ncl_i];
		if(ncl_Roof[ncl_i] < ncl_LL) ncl_LL = ncl_Roof[ncl_i];
	}
	var ncl_Stoc = 1;
	ncl_Stoc = ncl_Stoc / 2;
	if(ncl_HH != ncl_LL)
		ncl_Stoc = (ncl_Roof[0] - ncl_LL) / (ncl_HH - ncl_LL);
	vars ncl_S = series(ncl_Stoc, 3);
	vars ncl_Y = series(ncl_Stoc, 3);
	ncl_Y[0] = ncl_c1 * (ncl_S[0] + ncl_S[1]) / 2.0 + ncl_c2 * ncl_Y[1] + ncl_c3 * ncl_Y[2];
	*pRoof = ncl_Roof[0];
	*pStoc = ncl_Stoc;
	return ncl_Y[0];
}'''
