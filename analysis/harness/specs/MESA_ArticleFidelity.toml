body = '''
var mst_nca(vars Price, int StochPeriod, int HPPeriod, int SSPeriod, var* pRoof, var* pStoc)
{
	vars nca_Roof = series(RoofingFilter(Price, HPPeriod, SSPeriod), StochPeriod);
	var nca_HH = nca_Roof[0];
	var nca_LL = nca_Roof[0];
	int nca_i;
	for(nca_i = 1; nca_i < StochPeriod; nca_i++) {
		if(nca_Roof[nca_i] > nca_HH) nca_HH = nca_Roof[nca_i];
		if(nca_Roof[nca_i] < nca_LL) nca_LL = nca_Roof[nca_i];
	}
	var nca_Stoc = 1;
	nca_Stoc = nca_Stoc / 2;
	if(nca_HH != nca_LL)
		nca_Stoc = (nca_Roof[0] - nca_LL) / (nca_HH - nca_LL);
	var nca_k = sqrt(2.0);
	var nca_a1 = exp(-nca_k * PI / SSPeriod);
	var nca_e = 1;
	nca_e = nca_e / 1000;
	nca_a1 = nca_a1 + nca_e;
	var nca_b1 = 2.0 * nca_a1 * cos(nca_k * PI / SSPeriod);
	var nca_c2 = nca_b1;
	var nca_c3 = -nca_a1 * nca_a1;
	var nca_c1 = 1.0 - nca_c2 - nca_c3;
	vars nca_S = series(nca_Stoc, 3);
	vars nca_Y = series(nca_Stoc, 3);
	nca_Y[0] = nca_c1 * (nca_S[0] + nca_S[1]) / 2.0 + nca_c2 * nca_Y[1] + nca_c3 * nca_Y[2];
	*pRoof = nca_Roof[0];
	*pStoc = nca_Stoc;
	return nca_Y[0];
}'''
