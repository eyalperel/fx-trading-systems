# MESA_ArticleFidelity.toml -- MESAStochastic (Ehlers V.32:1 sidebar), SOURCE FIDELITY + IMPLEMENTATION (HARNESS_DESIGN §1, both questions), the
# SECOND spec of the OSCILLATOR family (HARNESS_DESIGN D6; first: RFX_ArticleFidelity.toml).
# Pre-registration: this file, committed BEFORE the corrected MESAStochastic.c / MESAStochastic_Superseded.c are written and BEFORE the generated
# script is run (CLAUDE.md §4.2). Amendments are dated and appended at the end of the file, never edited in place.
# DRAFT of MST stage 1 (planning chat 2026-11-18; decisions M-1..M-9 of docs/harness/MESASTOCHASTIC_SOURCE_REVIEW.md and D6 accepted by the user;
# brief docs/harness/MESA_STAGE1_PROMPT.md), built on the RFX oscillator tooling plus: models by type (reference.MesaModel / simulate_mesa), a gate on the
# MODEL's range HighestC - LowestC, a two-sided ABSOLUTE bound read from a named output (stoc), `startup_info` variants (generator / checker / reference, this branch).
# Format: as specs/RFX_ArticleFidelity.toml. Labels: (a) source states, (b) measured / computed here, (c) inference.
# Ids must not contain '-' (check ids are <prefix>-<variantid>-<check>).
#
# What differs from RFX:
#   * Three integer parameters per call (StochPeriod, HPPeriod, SSPeriod). Real variants L14 / L20 (source default) / L30 / S20 (SSPeriod 20).
#   * Every real variant is called through MESAStochasticCore(Price, L, HP, SS, &roof, &stoc) and exports three outputs: roof (the Roofing Filter, the linear stage),
#     stoc (the raw 0-1 stochastic) and out (the final smoothed output). The v1 checks (flat, gains, phases, alt gain, ramp residual; D4) read `roof`; trace and
#     invariance read `out`; the bound reads `stoc` (the final output overshoots 0-1 by design: review §4).
#   * DC gain 0 (Roof has a double zero at DC): D4 rules 2 / 4, no ramp-lag check. The alt phase row is SKIP in every variant exporting roof (Roof gain at Nyquist ~ 1e-18).
#   * Start-up: no rule in the source (M-5). Rows < W of `out` are INFO only; IMP and trace replay rows >= W = 700.
#   * Flat / alt / ramp rows of the normalised output are INFO only (ill-conditioned: the stochastic normalises Roof rounding noise).
#   * No statics in MESAStochastic.c, RoofingFilter.c, HighPassFilter.c, SuperSmoother2Pole.c (all state is per-call series()): D6 rule 5 is NOT APPLICABLE and there is
#     no shared-state control (review §4). The layout still runs every variant as its own instance every bar and IMP replays each against its own model.
#   * NCS is the REAL superseded file (MESAStochastic_Superseded.c, written in stage 2): it returns only `out`, so it has no stoc column and no bound row (deviation from
#     the brief's remark that the bound fires on NCS: the model's Stoc max 100.00000000000001 is reported in [findings], not observable in the run).
#     Decided 2026-11-19 (user): NCS is detected by trace only (2.04e6x, D2 per-control detection); the brief's remark was a planning-chat error
#     (it used the model's Stoc). Recorded in docs/harness/MESA_STAGE1_REPORT.md.

[batch]
name = "MST_ArticleFidelity"
id_prefix = "MST"
indicator = "MESAStochasticCore"       # Light-C function called by the `param` variants (corrected MESAStochastic.c, stage 2)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/MESA_ArticleFidelity.toml (this file)"
script_name = "GEN_MST_MESAStochastic"   # generated Light-C file; the generator never overwrites

[source]
article = "Ehlers, J. F., 'Predictive And Successful Indicators', Technical Analysis of Stocks & Commodities V.32:1 (2014), pp. 16-25, sidebar 'EasyLanguage Code To Compute The MESA Stochastic Indicator' (PDF p. 8)"
formula = """
(a) alpha1 = (Cosine(.707*360 / 48) + Sine(.707*360 / 48) - 1) / Cosine(.707*360 / 48);
    HP = (1 - alpha1 / 2)*(1 - alpha1 / 2)*(Close - 2*Close[1] + Close[2]) + 2*(1 - alpha1)*HP[1] - (1 - alpha1)*(1 - alpha1)*HP[2];
    a1 = expvalue(-1.414*3.14159 / 10);  b1 = 2*a1*Cosine(1.414*180 / 10);  c2 = b1;  c3 = -a1*a1;  c1 = 1 - c2 - c3;
    Filt = c1*(HP + HP[1]) / 2 + c2*Filt[1] + c3*Filt[2];
    HighestC = Filt;  LowestC = Filt;
    For count = 0 to Length - 1 Begin  If Filt[count] > HighestC then HighestC = Filt[count];  If Filt[count] < LowestC then LowestC = Filt[count];  End;
    Stoc = (Filt - LowestC) / (HighestC - LowestC);
    MESAStochastic = c1*(Stoc + Stoc[1]) / 2 + c2*MESAStochastic[1] + c3*MESAStochastic[2];
    Plot1(MESAStochastic); Plot2(.8); Plot6(.2);
(a) Default Length 20. HP + Filt are the Roofing Filter (48, 10) (verified, RFF run 1 d1395d3); the final smoothing reuses the SuperSmoother(10) coefficients.
    The window is Length bars (count 0 .. Length - 1) (M-1). Scale 0-1 (M-2). No zero-range guard (M-6), no start-up rule (M-4 / M-5): all variables start at 0 (Vars: ...(0)).
    Cosine takes degrees: .707*360/48 deg = (sqrt(2)/2)*2*pi/48 rad; 1.414*180/10 deg = sqrt(2)*pi/10 rad. D1 rule 1: .707 -> sqrt(2)/2, 1.414 -> sqrt(2), 3.14159 -> pi.
(c) Library generalisation (M-7): MESAStochastic(Price, StochPeriod, HPPeriod, SSPeriod); SSPeriod is used for BOTH SuperSmoother passes (the source shares the coefficients).
Library conventions the model implements for the real variants (decided M-4 / M-5 / M-6): HP history 0 and input history = Price[0] (series seeding) -> first Roof = 0 (RFF O_SEED);
the window history is seeded with the first Roof value (series() seeding); zero range (HH == LL) -> Stoc = 0.5 (the source divides 0/0); the final SuperSmoother2Pole(series(Stoc, 3), SSPeriod)
starts with its Stoc and output histories at the first Stoc.
"""
reference = "analysis/harness/reference.py mesa_article(L, hp, ss) (exact constants, library conventions; simulate_mesa), mesa_code (Zorro PI), mesa_superseded; roof_article(hp, ss) for the analytic Roof tables"
other_forms = "(a) Not tested here: other uses of the Stoc (the article's Figure 5 crossing rules at 0.2 / 0.8 are a strategy matter, not an indicator check)."

[[literal_replacements]]
literal = "1.414"
exact = 1.4142135623730951
name = "sqrt(2)"
rule = "D1 rule 1"
source = "(a) a1 and b1 lines (roofing SuperSmoother and final smoothing). 1.414 = sqrt(2) to its printed digits (D1 rule 1, decided: replace). 180 in the degrees form is exact pi rad."

[[literal_replacements]]
literal = "3.14159"
exact = 3.141592653589793
name = "pi"
rule = "D1 rule 1"
source = "(a) a1 line. 3.14159 = pi to its printed digits (D1 rule 1, decided: replace). 180 / 360 in the degrees forms are exact pi / 2 pi rad."

[[literal_replacements]]
literal = ".707"
exact = 0.7071067811865476
name = "sqrt(2)/2"
rule = "D1 rule 1"
source = "(a) alpha1 lines of the high-pass. .707 = 1/sqrt(2) to its printed digits (D1 rule 1, decided: replace; as HP_ArticleFidelity D-1). 360 in the degrees form is exact 2 pi rad."


# Pre-registered lines of the corrected indicators/ehlers/MESAStochastic.c (M-1, M-2, M-6, M-7, M-8, M-9). The .c is written to these lines AFTER this file is
# committed (stage 2); a test then asserts it contains them verbatim (whitespace-normalised, comments stripped).
# reference.mesa_code(L, hp, ss) with simulate_mesa implements exactly these lines.
[corrected_code]
file = "indicators/ehlers/MESAStochastic.c"
function = "var MESAStochasticCore(vars Price, int StochPeriod, int HPPeriod, int SSPeriod, var* pRoof, var* pStoc)"
lines = """
vars mstc_Roof = series(RoofingFilter(Price, HPPeriod, SSPeriod), StochPeriod);
var mstc_HH = mstc_Roof[0];
var mstc_LL = mstc_Roof[0];
int mstc_i;
for(mstc_i = 1; mstc_i < StochPeriod; mstc_i++) {
    if(mstc_Roof[mstc_i] > mstc_HH) mstc_HH = mstc_Roof[mstc_i];
    if(mstc_Roof[mstc_i] < mstc_LL) mstc_LL = mstc_Roof[mstc_i];
}
var mstc_Stoc = 1;
mstc_Stoc = mstc_Stoc/2;
if(mstc_HH != mstc_LL)
    mstc_Stoc = (mstc_Roof[0] - mstc_LL)/(mstc_HH - mstc_LL);
vars mstc_S = series(mstc_Stoc, 3);
var mstc_Out = SuperSmoother2Pole(mstc_S, SSPeriod);
*pRoof = mstc_Roof[0];
*pStoc = mstc_Stoc;
return mstc_Out;"""
wrapper_function = "var MESAStochastic(vars Price, int StochPeriod, int HPPeriod, int SSPeriod)"
wrapper_lines = """
var mstc_r;
var mstc_s;
return MESAStochasticCore(Price, StochPeriod, HPPeriod, SSPeriod, &mstc_r, &mstc_s);"""
notes = """(b) Changed vs the current .c (git blob a8c51bacf951cd1aa7a0d1c2f39347824ca1d6bf at c760160): M-1 the window is StochPeriod bars (series(..., StochPeriod), [0 .. StochPeriod-1]; was StochPeriod + 1); M-2 the scale is 0-1 (was 100.0 * ...; the 100.0 literal-first expression is gone); M-6 the zero-range fallback is 0.5 built from a variable (was 50); M-9 the linear stage and the raw Stoc are exported through MESAStochasticCore(Price, StochPeriod, HPPeriod, SSPeriod, &roof, &stoc); `MESAStochastic(Price, StochPeriod, HPPeriod, SSPeriod)` is a thin wrapper, so callers do not change; M-8 header with source, formula, deviations and the review path (written with the .c). M-4 / M-5 / M-7: no change.
(c) Both series() calls are unconditional and precede any use (gotchas 3.1); no expression starts with two literals (gotchas 9d.8). (c) `*pRoof = ...` out-parameters compile in Light-C: the same pattern is in Reflex.c (RFX run 1 PASS, ReflexCore with `var* pSum`, `var* pMS`). If any line cannot compile, stage 2 stops and reports.
Superseded file (stage 2): the CURRENT MESAStochastic.c body verbatim as indicators/ehlers/MESAStochastic_Superseded.c, function `MESAStochastic_Superseded`, locals `mstc_` -> `mstco_` (flat namespace, gotchas 1.3). It is the negative control NCS (M-1 and M-2 together).
Pre-run (ii): the blob hash of the current MESAStochastic.c is recorded above (a8c51bacf951cd1aa7a0d1c2f39347824ca1d6bf)."""


[zorro]
include = ["../../indicators/ehlers/HighPassFilter.c", "../../indicators/ehlers/SuperSmoother2Pole.c", "../../indicators/ehlers/RoofingFilter.c", "../../indicators/ehlers/MESAStochastic_Superseded.c", "../../indicators/ehlers/MESAStochastic.c"]   # dependency order (gotchas 5.3), resolved from strategies/tests/; MESAStochastic_Superseded.c and the corrected MESAStochastic.c are written in stage 2 (lint reports the Superseded include missing until then; the current MESAStochastic.c exists but has no MESAStochasticCore)
raw_file = "Data/GEN_MST_raw.csv"
marker_file = "Data/GEN_MST_exit_marker.txt"       # gotchas 9d.4: never fires; NOT a check on the run card
clock_asset = "EUR/USD"
bar_period = 1440
start_date = 20080101
end_date = 20240101
series_len = 3

[inputs]                    # as RFX / RFF / USE, incl. the alternating input; warmup 700 (D6 rule 2)
n_bars = 3000
warmup = 700              # (b) start-up memory: the final-seed effect is gone after row 59 (finding 7); W = 700 is the family default (>= 10x the measured memory)
level = [11, 10]            # 1.1, built at run time from integers (gotchas 9d.1)
amp = [1, 100]              # 0.01
slope = [1, 10000]          # 0.0001
sine_periods = [5, 10, 20, 40, 100]
alternating = true          # extra input id `alt`: level + amp*(-1)^n, after the sines and before ramp

[inputs.invariance]         # D6 rule 4: transformed copies of every sine, fed to every variant with invariance = true
transforms = [{ id = "sc", level = [11, 10], amp = [1, 10] }, { id = "of", level = [22, 10], amp = [1, 100] }]   # scale x10 (amp 0.1, level 1.1) and offset (level 2.2, amp 0.01); ids sc<T> / of<T>

[clock]
lo = 0.8
hi = 1.7
source = "(b) h1_check.py CLOCK_LO/CLOCK_HI: EUR/USD D1 closes lie inside; magnitude guard against a wrong asset"

[checks]                    # HARNESS_DESIGN D4 + D6
dc_gain = 0.0
phase_gate = 0.05
linear_output = "roof"       # the v1 checks (flat, gains, phases, alt, ramp residual) read this output (D6 rule 1)
trace_gate = 0.01            # g: rows with (HighestC - LowestC of the MODEL)/amplitude < g are excluded from trace / invariance (D6 rule 2 + note)
bound = [0.0, 1.0]           # raw Stoc lies in [0, 1] (two-sided, ABSOLUTE allowance [tolerances.bound])
bound_output = "stoc"        # the bound reads the raw Stoc, not the final output (which overshoots: finding 5)
source = """(b) Roof has DC gain 0 and a double zero at DC (HP second difference): D4 rules 2 and 4 (flat expected 0, ramp residual expected 0), no ramp-lag check. phase_gate (c): judgement, as HPF / RFF / USE / RFX; (b) the smallest expected Roof gain in the four tables is 0.05743161850487488 (S20, T = 5) >= 0.05, so all 20 sine phases are checked; the expected alt gain is <= 6.1e-18 (the HP has a zero at Nyquist): the alt phase is SKIP for every variant exporting roof. trace_gate g = 0.01 (c): judgement (D6 default); (b) the smallest (HighestC - LowestC)/amplitude over the sine rows >= W in the four real models is 0.028396521846796308 (L14, T = 100), 2.84x the gate (finding 4): no gated row on a correct variant; a gated row is counted and reported. bound [0, 1] (b): Stoc = (r - LL)/(HH - LL) with LL <= r <= HH lies in [0, 1] exactly in IEEE arithmetic, the fallback 0.5 is inside; 0.0 and 1.0 are attained (finding 5)."""


[tolerances.flat]
value = 1e-09
source = "(a) H1 criteria section 5 (unchanged). Applies to Roof: expected |Roof| = 0 on flat (DC gain 0, D4 rule 2). (b) floor 0."
[tolerances.gain]
value = 3e-05
source = "(c) HPF / SS2F / RFF / USE / RFX default (D4 rule 5). (b) window: floor x10 <= 3e-5, see [floor].gain. Applies to the five Roof sine gains and the alt gain."
[tolerances.phase]
value = 3e-05
source = "(c) HPF / RFF / USE / RFX default (D4 rule 5), radians. (b) window: floor x10 <= 3e-5, see [floor].phase. Applies to the five Roof sine phases; the alt phase is gated out."
[tolerances.resid]
value = 1e-09
source = "(c) HPF / RFF / RFX default (D4 rule 5). Applies to Roof on the ramp: expected 0 (double zero at DC). (b) floor ~1e-17."
[tolerances.trace]
value = 5e-05
source = "(c) THIS spec's value under D2 rule 1 (the D6 default 3e-5 stays the family default): max |Zorro out - model out| over the gated rows >= W, per sine. (b) the D6 default fails the D2 window: the largest floor is 3.875e-06 (L14, T = 100: HighestC - LowestC is smallest there, so the normalisation amplifies the PI gap), floor x10 = 3.88e-05 > 3e-5 (D2 rule 3). 5e-5: floor margin 12.9x, smallest control (NCA 7.94e-04) 15.9x, floor guard tol/10 = 5e-6 (b: 3.875e-06 <= 5e-6). See [floor].trace and [detect]."
[tolerances.bound]
value = 1e-12
source = "(c) NEW form (D6 rule 3, two-sided): ABSOLUTE allowance tol_abs on both ends: PASS if every raw Stoc row lies in [0 - tol_abs, 1 + tol_abs]; the Reflex one-sided relative form is unchanged. (b) the bound holds exactly (finding 5); 1e-12 is a few-ulp allowance, the check needs no model."
[tolerances.invariance]
value = 1e-09
source = "(c) D6 rule 4 default: max |out(input) - out(transformed input)| over the gated rows >= W, five sines, transforms sc (amp x10) and of (level 2.2). (b) floor ~1e-12 (finding 6, float64): window ok. Zorro-internal comparison, no model."
[tolerances.x]
value = 1e-12
source = "(a) STEP2_HANDOFF Stage 3 G4 (= h1_check.TOL_X, exported input vs recomputed x[n]). Covers the alt input and the invariance copies."
[tolerances.imp]
value = 1e-09
source = "(c) As HPF / SS3F / RFF / USE / RFX. Applies to roof (all base inputs, absolute) and to stoc / out on the gated sine rows. (b) Fire tests: see [imp.fire_test]."


