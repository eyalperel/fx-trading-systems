body = '''
var mst_ncw(vars Price, int StochPeriod, int HPPeriod, int SSPeriod, var* pRoof, var* pStoc)
{
	vars ncw_Roof = series(RoofingFilter(Price, HPPeriod, SSPeriod), StochPeriod + 1);
	var ncw_HH = ncw_Roof[0];
	var ncw_LL = ncw_Roof[0];
	int ncw_i;
	for(ncw_i = 1; ncw_i <= StochPeriod; ncw_i++) {
		if(ncw_Roof[ncw_i] > ncw_HH) ncw_HH = ncw_Roof[ncw_i];
		if(ncw_Roof[ncw_i] < ncw_LL) ncw_LL = ncw_Roof[ncw_i];
	}
	var ncw_Stoc = 1;
	ncw_Stoc = ncw_Stoc / 2;
	if(ncw_HH != ncw_LL)
		ncw_Stoc = (ncw_Roof[0] - ncw_LL) / (ncw_HH - ncw_LL);
	vars ncw_S = series(ncw_Stoc, 3);
	var ncw_Out = SuperSmoother2Pole(ncw_S, SSPeriod);
	*pRoof = ncw_Roof[0];
	*pStoc = ncw_Stoc;
	return ncw_Out;
}'''
