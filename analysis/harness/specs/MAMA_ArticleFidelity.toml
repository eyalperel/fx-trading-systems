source = """(b) 2026-11-20, tests/maf_support.numbers() (reference.py models, checker): the brief's items 1-4 reproduced; differences are in docs/harness/MAF_STAGE1_REPORT.md. alpha_* / period_* / fama_*: the real models on the checked sines (rows n >= 5 for alpha; ge1000 = rows n >= 1000). alpha_rows_lt5_max: alpha on rows n < 5 (the initial 0). equiv_ge1000_<v>_<input>_<copy>_<column>: |copy - (k base + c)| (mama, fama) or |copy - base| over rows n >= 1000, model, inputs s20 and s40 (copies computed in Python); equiv_last_row_off_*: the last row with any column off by > 1e-9 (phase > 1e-8); equiv_model_*: the same on s40 for the spec's copies (the equivariance floor). imp_est_<v>_<input>_<column>: the model on x printed with %.15f vs the exact x, all rows (the IMP residual of a perfect run; CHECKED pairs); imp_est_info_*: the same on the INFO pairs. effect_<control>_<column>_<input>: the control's own-model output vs the MA05 model, max over all rows. ncs_* / ncs2_*: the shared-barCount replay (14 superseded calls per bar in the generator's call order) vs the MA05 model per (instance, column, input): max over all rows, over rows n >= 1000, the number of rows and the last row with |diff| > 1e-12."""

# ----------------------------------------------------------------------------- pass condition
[pass_condition]
text = """MAMA / FAMA source fidelity and implementation PASS only if ALL of the following hold; any other outcome is FAIL, recorded and kept
(CLAUDE.md section 4.8), and its cause found before anything is changed:
1. All 66 real checks PASS: 2 variants (MA05, MA03) x 33 checks = trace 21 (every CHECKED (input, column) pair of the variant's
   [expected.*.conditioning], from row 1 = n >= 0: s10, s20, s40, s100 x mama / fama / period / alpha / phase = 20, plus s5 period = 1) + bound 2
   (alpha in [SL, FL] on rows n >= 5; period <= 50 on every row; every input incl. the copies; relative allowance) + equivariance 10 (s40, copies
   sc and of, x 5 columns, rows n >= 1000). The brief expected 32 per variant / 64: the one extra trace check per variant is s5 period, which the
   per-(input, column) classification of D7 rule 3 makes CHECKED (conditioning 4.157e-13 MA05 / 5.755e-13 MA03 <= 1e-10; the planning chat's
   table 1 has the same values, 4.086e-13 / 5.755e-13). INFO rows (info-trace on the 14 INFO pairs per real variant: flat x 5, ramp x 5, s5 x 4;
   info-flat) are written with result INFO and are not counted.
2. Each of the 7 negative controls (NCB, NCH, NCF, NC32, NCP, NCS, NCS2) FAILS on every kind listed in [detect.required]. A control that passes =
   harness broken.
3. No input guard fires (x[n] incl. the copies sc40 / of40 vs recomputed, tol 1e-12; clock range), no row is ERROR in ANY variant, no NaN /
   infinite value.
4. No line starting with 'Error' in the Zorro window (gotchas 9d.3). The EXITRUN marker / EXIT line is NOT a check (gotchas 9d.4: it never fires).
5. The results file reports the variant count: 2 real + 7 negative controls = 9 variants (NCB a control since the stage 1 review).
6. IMP: every [imp].must_pass replay <= its column tolerance (1e-9; phase 1e-8) on every CHECKED pair of every input the variant is called on
   (9 variants), and both [imp].must_fail replays exceed it (MA05 vs the NCH model; NCS vs the MA05 model; guard seen to fire). The INFO pairs'
   IMP residuals are reported (trailer IMP_INFO; expected large where the conditioning fails), never PASS / FAIL.
7. Floor guard: for every real variant, max |Zorro - model| <= tolerance / 10 for trace (1e-10; phase 1e-9) and equivariance (1e-10; phase 1e-9)
   (D2 rule 3 floor side). If exceeded, the window is invalid: the result is NOT accepted until explained, even if items 1-6 hold.
Pre-run (not run-time) conditions, done before the [Test] click and recorded in Amendment 1 (stage 2):
   (i) the corrected MAMA.c contains [corrected_code].lines and wrapper_lines verbatim (whitespace-normalised, comments stripped);
   (ii) the current MAMA.c blob (bab4cbbb5961be5720bce82fc6e487e283f7f00e, last commit 2a5eca5) is recorded and the corrected file differs from it
        only by MA-1, MA-2, MA-3, MA-4, S1, MA-7, MA-8 (MA-5 removed with S1, MA-6 kept); MAMA_Superseded.c is the current body with ONLY the
        mao_ prefix and the function name;
   (iii) reference.py reproduces this file's conditioning values, floors, effects, [findings] and IMP fire-test numbers to <= 1e-9 relative (an
        absolute 1e-15 for values below 1e-6). Every number is stored at full precision. Each inline control body is checked at run time, not by
        reading: IMP must_pass replays every variant with its own model (pass item 6);
   (iv) generator --lint-only passes on this file (D2 windows ok, every required margin >= 10x; after stage 2 also the two includes resolve and the
        no-static check passes);
   (v) no-static lint: indicators/ehlers/MAMA.c contains no `static` token (comments excluded); the check is seen to fire on the superseded body
        (1 hit: barCount). Recorded here and in the results header (INFO L_NO_STATIC line);
   (vi) the callers of MAMA (strategies/tests/Test_FRAMA_vs_MAMA.c:38, strategies/tests/Test_MAMA.c:32; grep, stage 1 report) build .5 / .05 from
        integers (stage 2); no other caller exists;
   (vii) the conditioning classification recomputed by the tooling (checker.conditioning_table: same seed, draw order and bound) equals the INFO
        lists of [expected.MA05.conditioning] and [expected.MA03.conditioning] (checker.conditioning_mismatches = []); a mismatch is a STOP."""


# ----------------------------------------------------------------------------- observations (INFO only)
[observations]
O_MARGIN = "Report the generator's D2 INFO lines (floor x10 vs tolerance per kind and per column override; per-control margin) in the results header."
O_CONDITIONING = "(b) Rule 3 classification ([expected.*.conditioning], both variants identical): INFO flat (all 5 columns), ramp (all 5), s5 (mama, fama, alpha, phase); CHECKED s10, s20, s40, s100 (all 5), s5 period, and the copies sc40 / of40 (all 5; used by equivariance and IMP only). Largest checked: MA05 s100 phase 1.453e-10, alpha 2.318e-11, fama 2.351e-13; MA03 s100 phase 1.538e-10, alpha 1.624e-11, fama 6.678e-13 (brief item 1, reproduced). INFO examples: MA05 ramp alpha 0.45, fama 2.788e-04; flat fama 3.244e-02; s5 fama 1.686e-02."
O_S5_PERIOD = "(b) s5 sits on the Period floor 6 (T = 5 < 6): the phase wraps flip alpha (s5 is INFO for alpha / phase / mama / fama), but Period comes from Re / Im, not from the phase, and stays on its floor: s5 period is well conditioned (4.157e-13) and is a CHECKED trace pair. This is the one difference from the brief's count (pass item 1)."
O_NCB = "(b) NCB (dn .67 -> .68, control): zero effect on s10, s20, s40, s100 (all columns, S4 reproduced) but 3.626e-02 on s5 period (the .67 / .68 bound acts during s5's climb to the 6 floor; findings effect_NCB_period_s5). S4's 'zero effect on every checked input' was stated for the four checked sines; s5 period, checked here, is the exception. Planning-chat review 2026-11-20: NCB is a control, [detect.required] NCB = [trace] (3.63e7x); its IMP model is unchanged."
O_NC32 = "(b) NC32 (MA-4): trace 5.944e-06 on period (= 5943x, every checked sine), and the bound: with float32 .2 and .8 (sum 1 + 1.49e-8) the blend P = .2 x 50 + .8 x P[1] converges to 50 x 1.0000000745 = 50.0000037 > 50, so period breaks its exact bound by 3.7e-6 (74500x the relative allowance). MA-4 is therefore seen by two kinds."
O_NCP = "(b) NCP (Zorro PI): period 2.042e-05 .. 4.328e-05, phase 7.18e-05 .. 7.26e-05 degrees (s10 .. s100): 4.3e4x the trace tolerance; S1 is a checked change."
O_NCS = "(b) NCS / NCS2 (the superseded file, two instances, 14 superseded calls per bar, variant-major): only barCount is shared, so the shared state shifts the start-up only (NCS's calls on flat .. s40 at bar 0 are the run's first 5 and return Price; every later call computes). Every (instance, input) differs from MA05 by about the level at start-up (1.10 .. 1.108, price seed vs zero start); at rows n >= 1000 the difference is 0 on s10 / s20, 2.2e-9 .. 5.4e-9 on s40 / s100 (float32 literals, Zorro PI), 3.1e-4 / 3.5e-4 on ramp and 4.6e-3 / 1.5e-3 on s5 (long memory / wraps) ([findings] ncs_* / ncs2_*). Not only flat, not only a constant: the trace catches it at 1.1e9x."
O_EQUIV = "(b) C-2 reproduced: the zero start does not map under x -> kx + c; the model's last row with a column off > 1e-9 (phase > 1e-8) is n = 516 (MA05, s40, sc) at most over s20 / s40 and both variants; rows n >= 1000: mama 1.89e-14, fama 1.58e-14, alpha 3.72e-13, period 6.24e-12, phase 5.27e-11 ([findings] equiv_*). W_eq = 1000."
O_IMP_RESIDUAL = "Report the IMP residual per real variant (checked pairs) and, separately, the INFO-pair residuals, and the Zorro-vs-model residual per kind and column group per real variant (the measured floor; expected at rounding level). (b) A perfect run printed with %.15f: MA05 1.737e-11 (s100 alpha, ratio 0.017), MA03 1.124e-10 (s100 phase, ratio 0.011); INFO pairs up to 180 degrees (phase on flat / ramp / s5) ([imp.fire_test.exported_x_15f])."
O_STATICS_RESET = "(b) The generated script's own statics (mam_n, mam_done, mam_hdr, mam_rows) are reset at INITRUN. The superseded file's static barCount is not (it is called only after INITRUN returns): restart Zorro before a rerun ([run_notes])."

