# MAMA_ArticleFidelity.toml -- MESA Adaptive Moving Average MAMA and its FAMA (Ehlers, TASC V.19:9 2001, Sidebar Fig. 1), SOURCE FIDELITY +
# IMPLEMENTATION (HARNESS_DESIGN section 1, both questions), the FIRST spec of the ADAPTIVE-SMOOTHER family (HARNESS_DESIGN D7).
# Pre-registration: this file, committed BEFORE the corrected MAMA.c / MAMA_Superseded.c are written and BEFORE the generated script is run
# (CLAUDE.md section 4.2). Amendments are dated and appended at the end of the file, never edited in place.
# DRAFT of MAF stage 1 (planning chat 2026-11-20; review docs/harness/MAMA_FRAMA_SOURCE_REVIEW.md (b7bdd69) incl. its appendix C-1..C-3 and
# S1..S5, D7, accepted by the user; brief docs/harness/MAF_STAGE1_PROMPT.md). Tooling: the D7 path of generator.py / checker.py
# ([checks].adaptive = true) and the reference models mama_article / mama_superseded (reference.py).
# Labels: (a) source states, (b) measured / computed here, (c) inference. Ids must not contain '-'. Rows are numbered n = 0, 1, ... (0-based):
# "row 1" of the brief / D7 = n 0; "CurrentBar 6" = n 5.
#
# What D7 changes against the oscillator specs (D6):
#   * The output is a price level: scale / offset copies are checked for EQUIVARIANCE (mama, fama: copy = k out + c; alpha, period, phase:
#     copy = out), rows n >= 1000 (C-2: the zero start does not map under x -> kx + c; the residual falls below 1e-9 by n <= 516).
#   * No warm-up cut: every column is traced against the source model from row 1 (n >= 0), start-up included (the source defines it: every
#     var 0, the body from CurrentBar 6). No gate: instead each (input, column) pair is classified BEFORE the run (D7 rule 3, [conditioning]):
#     checked if 5 one-ulp perturbations of the input move that column of the model by <= trace tolerance / 10 over ALL rows, else INFO.
#   * Five exported columns (MA-7): MAMACore(Price, FastLimit, SlowLimit, &fama, &period, &alpha, &phase) returns mama.
#   * Exact pi (S1): the corrected code builds pi at run time (4*atan(1)); Zorro's PI (float32 3.14159) is the control NCP.
#   * NCB (Period bound .67 -> .68) is a control: S4 called it zero-effect, but on the checked pair s5 period it moves by 3.6e-2 (stage 1).
#   * NCS / NCS2 are the REAL superseded file (MAMA_Superseded.c, stage 2) called as two instances (both .5 / .05) on every base input; they
#     share only the file static barCount (MA-3). (The brief names one control NCS "called as TWO instances"; the second instance is the
#     variant NCS2 here, as FSH's NCT; the id NCT is not used in this spec.)

[batch]
name = "MAMA_ArticleFidelity"
id_prefix = "MAM"
indicator = "MAMACore"                   # Light-C function called by the `param` variants (corrected MAMA.c, stage 2)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/MAMA_ArticleFidelity.toml (this file)"
script_name = "GEN_MAM_MAMA"            # generated Light-C file; the generator never overwrites
real_params = true                       # FastLimit / SlowLimit are real values built from integers at run time (LRS pattern)

[source]
article = "Ehlers, J. F., 'MESA Adaptive Moving Averages', Technical Analysis of Stocks & Commodities V.19:9 (2001), pp. 30-35; Sidebar Figure 1 'TradeStation code for MAMA and FAMA', PDF p. 5 (project knowledge `MESA Adaptive Moving Averages.pdf`). (b) Cybernetic Analysis (2004) does not contain MAMA."
formula = """
(a) Inputs: Price((H+L)/2), FastLimit(.5), SlowLimit(.05); every var starts at 0; the body runs only If CurrentBar > 5:
    Smooth = (4*Price + 3*Price[1] + 2*Price[2] + Price[3]) / 10;
    Detrender = (.0962*Smooth + .5769*Smooth[2] - .5769*Smooth[4] - .0962*Smooth[6])*(.075*Period[1] + .54);
    Q1 = (... Detrender ...)*(.075*Period[1] + .54);  I1 = Detrender[3];  jI = (... I1 ...)*(...);  jQ = (... Q1 ...)*(...);
    I2 = I1 - jQ;  Q2 = Q1 + jI;  I2 = .2*I2 + .8*I2[1];  Q2 = .2*Q2 + .8*Q2[1];
    Re = I2*I2[1] + Q2*Q2[1];  Im = I2*Q2[1] - Q2*I2[1];  Re = .2*Re + .8*Re[1];  Im = .2*Im + .8*Im[1];
    If Im <> 0 and Re <> 0 then Period = 360/ArcTangent(Im/Re);
    If Period > 1.5*Period[1] then Period = 1.5*Period[1];  If Period < .67*Period[1] then Period = .67*Period[1];
    If Period < 6 then Period = 6;  If Period > 50 then Period = 50;  Period = .2*Period + .8*Period[1];
    SmoothPeriod = .33*Period + .67*SmoothPeriod[1];                (computed, unused: MA-6)
    If I1 <> 0 then Phase = ArcTangent(Q1/I1);  DeltaPhase = Phase[1] - Phase;  If DeltaPhase < 1 then DeltaPhase = 1;
    alpha = FastLimit/DeltaPhase;  If alpha < SlowLimit then alpha = SlowLimit;  If alpha > FastLimit then alpha = FastLimit;
    MAMA = alpha*Price + (1 - alpha)*MAMA[1];  FAMA = .5*alpha*MAMA + (1 - .5*alpha)*FAMA[1];
(a) ArcTangent returns DEGREES (EasyLanguage). A var not assigned on a bar keeps its value (EasyLanguage); that is the MA-2 hold.
(b) Exported here: mama, fama, period (after the .2 / .8 blend), alpha (after the clamps), phase (degrees). Exact bounds: alpha in [SL, FL] on
    every computed row (n >= 5); period <= 50 on every row (period >= 6 only asymptotically from the zero start: review section 3).
"""
reference = "analysis/harness/reference.py mama_article(FL, SL, w1, w2, ka, kb, a2, a8, up, dn, c33, c67, fama_k, pi, literals) (simulate_mama: per-instance state, every var 0, body from the 6th call, hold rule, the corrected code's operation order: deg = 180/pi, atan(.)*deg, 360/P), mama_superseded(params, index) (simulate_mama_shared: the old MAMA.c, its static barCount shared by every superseded call in the generator's ACTUAL call order, float32 literals, Zorro PI)"
d1 = "(b) D1 rule 2: every literal of Fig. 1 (.0962, .5769, .075, .54, .2, .8, 1.5, .67, .33, 6, 50, 360, .5) is taken at its decimal value, built from integers at run time; none equals a named constant to every printed digit, so there is no rule-1 / rule-4 replacement and no 'as printed' INFO variant. The degree conversion uses exact pi built at run time (S1, a D3 exception under D3's own rule: with Zorro PI the floor exceeds the float32-literal effect, so MA-4 could never be seen)."
review_only = "(b) Checked by CODE REVIEW only (S4), not by a run: MA-2 (Period / Phase keep their value when Im or Re = 0 / I1 = 0) acts only on exact zeros, i.e. on flat, whose trace is INFO (rule 3). Stage 2's pre-run item (i) asserts the hold lines verbatim. (b) S4 also recorded the .67 -> .68 Period bound as having zero effect on every checked input; that is superseded by a stage 1 finding (planning-chat review, 2026-11-20): s5 period is a CHECKED pair (rule 3) and the bound moves it by 3.626e-02, so NCB is a run-checked control (detected by trace on s5 period, 3.63e7x)."
other_forms = "(a) SmoothPeriod is computed and unused (MA-6, kept for fidelity, not exported). (c) The MAMA / FAMA crossover is the source's suggested signal; whether the NNFX baseline uses price vs FAMA or the cross is a template decision (step 4)."

# Pre-registered corrected indicators/ehlers/MAMA.c (MA-1..MA-4, MA-7; the brief's code block, verbatim). Written in stage 2 AFTER this file
# is committed; a test then asserts it contains these lines verbatim (whitespace-normalised, comments stripped). reference.mama_article
# implements exactly these lines (same operations in the same order; IMP must pass).
[corrected_code]
file = "indicators/ehlers/MAMA.c"
function = "var MAMACore(vars Price, var FastLimit, var SlowLimit, var* pFama, var* pPeriod, var* pAlpha, var* pPhase)"
lines = """
    vars ma_n  = series(0, 2);     // per-instance CurrentBar (9d.9)
    vars ma_S  = series(0, 7);
    vars ma_De = series(0, 7);
    vars ma_I1 = series(0, 7);
    vars ma_Q1 = series(0, 7);
    vars ma_jI = series(0, 2);
    vars ma_jQ = series(0, 2);
    vars ma_I2 = series(0, 2);
    vars ma_Q2 = series(0, 2);
    vars ma_Re = series(0, 2);
    vars ma_Im = series(0, 2);
    vars ma_P  = series(0, 2);
    vars ma_SP = series(0, 2);
    vars ma_Ph = series(0, 2);
    vars ma_A  = series(0, 2);
    vars ma_M  = series(0, 2);
    vars ma_F  = series(0, 2);
    ma_n[0] = ma_n[1] + 1;
    // EasyLanguage: a var keeps its value on a bar where it is not assigned (MA-2)
    ma_S[0] = ma_S[1];   ma_De[0] = ma_De[1]; ma_I1[0] = ma_I1[1]; ma_Q1[0] = ma_Q1[1];
    ma_jI[0] = ma_jI[1]; ma_jQ[0] = ma_jQ[1]; ma_I2[0] = ma_I2[1]; ma_Q2[0] = ma_Q2[1];
    ma_Re[0] = ma_Re[1]; ma_Im[0] = ma_Im[1]; ma_P[0] = ma_P[1];   ma_SP[0] = ma_SP[1];
    ma_Ph[0] = ma_Ph[1]; ma_A[0] = ma_A[1];   ma_M[0] = ma_M[1];   ma_F[0] = ma_F[1];
    var ma_w1 = 962;  ma_w1 = ma_w1/10000;
    var ma_w2 = 5769; ma_w2 = ma_w2/10000;
    var ma_ka = 75;   ma_ka = ma_ka/1000;
    var ma_kb = 54;   ma_kb = ma_kb/100;
    var ma_a2 = 2;    ma_a2 = ma_a2/10;
    var ma_a8 = 8;    ma_a8 = ma_a8/10;
    var ma_c33 = 33;  ma_c33 = ma_c33/100;
    var ma_c67 = 67;  ma_c67 = ma_c67/100;
    var ma_up = 15;   ma_up = ma_up/10;
    var ma_dn = 67;   ma_dn = ma_dn/100;
    var ma_pi = 4;    ma_pi = ma_pi*atan(1);       // S1: exact pi at run time (D3)
    var ma_deg = 180; ma_deg = ma_deg/ma_pi;
    var ma_h = 1;     ma_h = ma_h/2;
    var ma_u = 1;
    var ma_pf = 0;
    var ma_p1 = 0;
    var ma_dp = 0;
    var ma_ah = 0;
    if(ma_n[0] > 5) {
        ma_S[0] = 4*Price[0] + 3*Price[1] + 2*Price[2] + Price[3];
        ma_S[0] = ma_S[0]/10;
        ma_pf = ma_ka*ma_P[1] + ma_kb;
        ma_De[0] = (ma_w1*ma_S[0] + ma_w2*ma_S[2] - ma_w2*ma_S[4] - ma_w1*ma_S[6])*ma_pf;
        ma_Q1[0] = (ma_w1*ma_De[0] + ma_w2*ma_De[2] - ma_w2*ma_De[4] - ma_w1*ma_De[6])*ma_pf;
        ma_I1[0] = ma_De[3];
        ma_jI[0] = (ma_w1*ma_I1[0] + ma_w2*ma_I1[2] - ma_w2*ma_I1[4] - ma_w1*ma_I1[6])*ma_pf;
        ma_jQ[0] = (ma_w1*ma_Q1[0] + ma_w2*ma_Q1[2] - ma_w2*ma_Q1[4] - ma_w1*ma_Q1[6])*ma_pf;
        ma_I2[0] = ma_I1[0] - ma_jQ[0];
        ma_Q2[0] = ma_Q1[0] + ma_jI[0];
        ma_I2[0] = ma_a2*ma_I2[0] + ma_a8*ma_I2[1];
        ma_Q2[0] = ma_a2*ma_Q2[0] + ma_a8*ma_Q2[1];
        ma_Re[0] = ma_I2[0]*ma_I2[1] + ma_Q2[0]*ma_Q2[1];
        ma_Im[0] = ma_I2[0]*ma_Q2[1] - ma_Q2[0]*ma_I2[1];
        ma_Re[0] = ma_a2*ma_Re[0] + ma_a8*ma_Re[1];
        ma_Im[0] = ma_a2*ma_Im[0] + ma_a8*ma_Im[1];
        if(ma_Im[0] != 0 && ma_Re[0] != 0) {
            ma_P[0] = atan(ma_Im[0]/ma_Re[0]);
            ma_P[0] = ma_P[0]*ma_deg;
            ma_P[0] = 360/ma_P[0];
        }
        ma_p1 = ma_P[1];
        if(ma_P[0] > ma_up*ma_p1) ma_P[0] = ma_up*ma_p1;
        if(ma_P[0] < ma_dn*ma_p1) ma_P[0] = ma_dn*ma_p1;
        if(ma_P[0] < 6)  ma_P[0] = 6;
        if(ma_P[0] > 50) ma_P[0] = 50;
        ma_P[0] = ma_a2*ma_P[0] + ma_a8*ma_p1;
        ma_SP[0] = ma_c33*ma_P[0] + ma_c67*ma_SP[1];
        if(ma_I1[0] != 0) {
            ma_Ph[0] = atan(ma_Q1[0]/ma_I1[0]);
            ma_Ph[0] = ma_Ph[0]*ma_deg;
        }
        ma_dp = ma_Ph[1] - ma_Ph[0];
        if(ma_dp < 1) ma_dp = 1;
        ma_A[0] = FastLimit/ma_dp;
        if(ma_A[0] < SlowLimit) ma_A[0] = SlowLimit;
        if(ma_A[0] > FastLimit) ma_A[0] = FastLimit;
        ma_M[0] = ma_A[0]*Price[0] + (ma_u - ma_A[0])*ma_M[1];
        ma_ah = ma_h*ma_A[0];
        ma_F[0] = ma_ah*ma_M[0] + (ma_u - ma_ah)*ma_F[1];
    }
    *pFama   = ma_F[0];
    *pPeriod = ma_P[0];
    *pAlpha  = ma_A[0];
    *pPhase  = ma_Ph[0];
    return ma_M[0];"""
wrapper_function = "var MAMA(vars Price, var FastLimit, var SlowLimit, var* outFAMA)"
wrapper_lines = """
    var maw_1;
    var maw_2;
    var maw_3;
    return MAMACore(Price, FastLimit, SlowLimit, outFAMA, &maw_1, &maw_2, &maw_3);"""
notes = """(b) Changed vs the current .c (blob bab4cbbb5961be5720bce82fc6e487e283f7f00e, last commit 2a5eca5; recorded again at pre-run (ii), stage 2):
MA-1 zero start (every series(0, n): the source's var initial values) and the body only from the 6th call of THIS instance (ma_n, a per-instance
counter series(0, 2), gotchas 9d.9) in place of the price seeds, the Period 20 init and the `return Price[0]` for 5 calls; MA-2 every state
starts the bar at its previous value (the EasyLanguage hold); MA-3 the static barCount removed; MA-4 every constant built from integers at run
time; S1 exact pi (4*atan(1)) and deg = 180/pi; MA-7 the columns exported through MAMACore(Price, FastLimit, SlowLimit, &fama, &period, &alpha,
&phase), MAMA(Price, FastLimit, SlowLimit, &fama) a thin wrapper (callers unchanged); MA-8 header with source and page, formula, deviations fixed,
the review path and labelled claims (written with the .c). MA-5 (the #ifndef PI fallback) disappears with S1. MA-6 SmoothPeriod kept, unused.
(b) Every series() call is unconditional and first (gotchas 3.1); every expression starts with a variable or a single integer literal times a
variable (gotchas 9d.8: `4*Price[0] + ...`, `360/ma_P[0]`); no decimal literal (asserted by test_generator_maf). The model's operation order is
the code's (deg = 180/pi, atan(.)*deg, 360/P); the planning chat's script used atan(.)*180/pi: differences <= 8.3e-14 (finding xcheck_*).
(c) If any line cannot compile in Light-C (declarations after statements, `&&`, unary minus on a variable), stage 2 stops and reports. (b) Each
construct has compiled in a harness run already: `&&` (LaguerreRSI_Superseded.c:25, LRS run 1), declarations after statements (FisherCore,
FSH run 1), unary minus on a variable inside an expression (Reflex.c:60 `exp(-rx_k*PI/rx_half)`, RFX run 1).
(c) MAMACore reads Price[0..3]: the caller's series must hold >= 4 values ([zorro].series_len = 34).
Superseded file (stage 2): the CURRENT MAMA.c body as indicators/ehlers/MAMA_Superseded.c, `MAMA_Superseded(vars Price, var FastLimit, var
SlowLimit, var* outFAMA)`, every local / static prefixed mao_, NO behavioural edit. It is the shared-state control NCS / NCS2."""

[zorro]
include = ["../../indicators/ehlers/MAMA_Superseded.c", "../../indicators/ehlers/MAMA.c"]   # resolved from strategies/tests/; MAMA_Superseded.c is written in stage 2 (lint reports it missing until then); the current MAMA.c exists but has no MAMACore and still has its static
raw_file = "Data/GEN_MAM_raw.csv"
marker_file = "Data/GEN_MAM_exit_marker.txt"       # gotchas 9d.4: never fires; NOT a check on the run card
clock_asset = "EUR/USD"
bar_period = 1440
start_date = 20080101
end_date = 20240101
series_len = 34           # (c) brief: >= 33 for FRAMA (FR32 + NCN); MAMACore reads Price[0..3] only; the same value in both D7 specs

[inputs]
n_bars = 3000
warmup = 0                # D7 rule 2: no W cut; every check reads rows n >= 0 (trace from row 1)
level = [11, 10]          # 1.1, built at run time from integers (gotchas 9d.1)
amp = [1, 100]            # 0.01
slope = [1, 10000]        # 0.0001
sine_periods = [5, 10, 20, 40, 100]

[inputs.equivariance]     # D7 rule 5: affine copies of s40 only (C-2; brief): sc = 10 x - 9.9 (amplitude 0.1), of = x + 1.1 (level 2.2)
inputs = ["s40"]
transforms = [{ id = "sc", scale = [10, 1], offset = [-99, 10] }, { id = "of", scale = [1, 1], offset = [11, 10] }]

[clock]
lo = 0.8
hi = 1.7
source = "(b) h1_check.py CLOCK_LO/CLOCK_HI: EUR/USD D1 closes lie inside; magnitude guard against a wrong asset"

[checks]                  # HARNESS_DESIGN D7 (rules 1-8) as mapped here
adaptive = true
columns = ["mama", "fama", "period", "alpha", "phase"]
level_columns = ["mama", "fama"]                     # equivariance: copy = k out + c; alpha / period / phase: copy = out
equivariance_from_n = 1000                           # W_eq (C-2)
flat_info = { columns = ["mama", "fama"], from_n = 1000 }    # D7 rule 6 for MAMA: flat -> level is INFO (C-1)
source = """(a)/(b) D7 mapped to MAMA: rule 1 the five columns exported (MA-7); rule 2 trace of every column from row 1 (n >= 0) against
mama_article, start-up included; rule 3 per (input, column) classification below ([conditioning], each expected table's conditioning list):
INFO pairs are written as info-trace rows, never PASS/FAIL; rule 4 bounds from the expected tables (alpha in [SL, FL] from n = 5, the first
computed row; period <= 50 every row), every input incl. the copies, relative allowance [tolerances.bound]; rule 5 equivariance on s40, copies
sc and of, rows n >= 1000; rule 6 flat -> level only as INFO (info-flat, n >= 1000; the flat trace is INFO, C-1), the ramp is a trace and here
INFO too (C-1: ill-conditioned); rule 7 NCS / NCS2; rule 8 no linear checks."""

[conditioning]            # D7 rule 3, the pre-run classifier (checker.conditioning_table), deterministic
seed = 20261120
draws = 5
skip_draws = 0
order = ["flat", "ramp", "s5", "s10", "s20", "s40", "s100"]
bound = { mama = 1e-10, fama = 1e-10, period = 1e-10, alpha = 1e-10, phase = 1e-09 }
source = """(b) S2: bound = trace tolerance / 10 per column. One numpy default_rng(20261120); per real expected table (MA05, then MA03), per
input in `order`, then per table the copies (sc40, of40): 5 perturbations x(1 + 2^-52 u), u = rng.integers(-1, 2, 3000), and the max over ALL
rows of |column(perturbed) - column(x)| of the MODEL (reference.mama_article). The base order and seed are the planning chat's
(docs/harness/MAMA_FRAMA_STAGE1_NUMBERS.py section 1), so the base values reproduce its table 1 up to the operation-order difference. A pair
above its bound is INFO. A recomputed classification that differs from the lists below is a pre-run STOP (pass condition, pre-run (vii))."""

[tolerances.x]
value = 1e-12
source = "(a) STEP2_HANDOFF Stage 3 G4 (= h1_check.TOL_X, exported input vs recomputed x[n]). Covers the copies."
[tolerances.trace]
value = 1e-09
columns = { phase = 1e-08 }
source = "(c) S2 (user, 2026-11-20): MAMA trace 1e-9 (mama, fama, alpha, period), 1e-8 (phase, degrees). Every checked (input, column) pair, every row n >= 0. Window: [floor] x10 <= tolerance (checked below, D2 rule 3); NC32 / NCP (the smallest controls) >= 10x."
[tolerances.bound]
value = 1e-12
source = "(c) D6 default: RELATIVE allowance |bound| x 1e-12 on alpha in [SL, FL] (both sides, rows n >= 5) and period <= 50 (every row), every input of the variant incl. the copies."
[tolerances.equivariance]
value = 1e-09
columns = { phase = 1e-08 }
source = "(c) Brief: as the trace (1e-9; phase 1e-8), rows n >= 1000 (W_eq, C-2). Zorro-internal, no model. (b) Model floor [floor].equivariance*."
[tolerances.imp]
value = 1e-09
columns = { phase = 1e-08 }
source = "(c) As every earlier spec (1e-9); phase in degrees 1e-8 (brief). On the CHECKED (input, column) pairs only; INFO pairs are reported (rule 3). (b) Expected residual: [floor] imp estimate (the %.15f rounding of the exported x through the model)."

[lint]
no_static = ["indicators/ehlers/MAMA.c"]
source = "(b) As LRSI / FSH: the corrected MAMA.c must contain no `static` token (comments and strings excluded): the structural check for MA-3. generator.lint_no_static; seen to fire on the current body (1 hit, barCount: test_generator_maf). Until stage 2 the current file has the static: lint reports it, as it reports the missing MAMA_Superseded.c include."

# D2 floor per quantity (see source).
[floor]
trace = 2.3175628083293986e-11
trace_phase = 1.5377921158687968e-10
equivariance = 6.23856521997368e-12
equivariance_phase = 5.2733428734796917e-11
imp_estimate = 1.7374324201568925e-11
imp_estimate_phase = 1.1239009722885385e-10
source = """(b) 2026-11-20, tests/maf_support.numbers(). trace / trace_phase = the largest of two estimates over the real variants and the CHECKED (input, column) pairs: the conditioning values (5 one-ulp perturbations, [expected.*.conditioning]; phase: MA03 s100 1.5378e-10, the rest MA05 s100 alpha 2.3176e-11) and the IMP estimate (the model on x printed with %.15f vs the exact x: imp_estimate / imp_estimate_phase). No PI gap (S1: exact pi in code and model). x10: 2.3e-10 <= 1e-9 and 1.5e-9 <= 1e-8: the window holds (brief STOP rule not met). equivariance / equivariance_phase = the model's own residual on s40, rows n >= 1000 (brief item 3: period 6.2e-12, phase 5.3e-11). (c) Zorro vs the model is expected at rounding level on the checked pairs (the model mirrors the code's operation order; Zorro's atan / sin may differ from numpy's by an ulp, which the conditioning values bound); pass item 7 guards the run value."""


# Expected values: the trace model per variant (no tables), the bounds, and the pre-registered conditioning classification. Never from the .c file.
[expected.MA05]
article = "mama_article(1/2,1/20)"
bounds = { alpha = { lo = 0.05, hi = 0.5, from_n = 5 }, period = { hi = 50.0 } }
source = "(b) reference.mama_article((1, 2), (1, 20)): Sidebar Fig. 1, FastLimit .5, SlowLimit .05 (the slot, S3), literals as integer ratios, exact pi, zero start, body from n = 5, hold rule. (a) Bounds: alpha clamped to [SlowLimit, FastLimit] on every computed row (n >= 5; n < 5 alpha = 0, the initial value); period clamped to <= 50 before the .2 / .8 blend with a value <= 50."

