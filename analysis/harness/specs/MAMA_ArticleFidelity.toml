# ----------------------------------------------------------------------------- IMP
[imp]
what = """Implementation check (HARNESS_DESIGN section 1, first question). Replay the model named per variant on the x columns EXPORTED by Zorro
(reference.IMP_MODELS); residual per (input, column) = max |Zorro - replay| over every row n >= 0, on every input the variant is called on
(base inputs flat, s5, s10, s20, s40, s100, ramp; MA05 / MA03 also the copies sc40, of40). The pairs its expected table classifies as INFO
(rule 3: flat, ramp, s5 except s5 period) are reported separately (trailer line IMP_INFO; expected large) and never decide PASS/FAIL; on the
checked pairs the ratio residual / column tolerance decides (imp 1e-9, phase 1e-8). NCS / NCS2 are replayed with mama_superseded: the old
file over ALL superseded calls in the generator's ACTUAL call order (checker.adaptive_shared_slots: NCS on flat .. ramp, then NCS2)."""
tolerance = "[tolerances.imp] 1e-9 (phase 1e-8)"
must_pass = { MA05 = "mama_article(1/2,1/20)", MA03 = "mama_article(3/10,1/10)", NCB = "mama_article(1/2,1/20,dn=68/100)", NCH = "mama_article(1/2,1/20,w1=963/10000)", NCF = "mama_article(1/2,1/20,fama_k=51/100)", NC32 = "mama_article(1/2,1/20,literals=float32)", NCP = "mama_article(1/2,1/20,pi=zorro)", NCS = "mama_superseded(1/2,1/20;1/2,1/20)[0]", NCS2 = "mama_superseded(1/2,1/20;1/2,1/20)[1]" }
must_fail = { MA05 = "mama_article(1/2,1/20,w1=963/10000)", NCS = "mama_article(1/2,1/20)" }
diagnosis = """FIDELITY PASS + IMP PASS: verified on both questions. FIDELITY FAIL + IMP PASS: copying difference (.c lines vs the source). IMP FAIL on
any real variant: Zorro / implementation problem; the fidelity result is not interpretable. MA05 must_fail = the NCH model is absent from the run
output; NCS must_fail = the superseded calls do not behave as the source."""

