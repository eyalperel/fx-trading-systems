body = '''
var mam_ncb(vars Price, var FastLimit, var SlowLimit,
             var* pFama, var* pPeriod, var* pAlpha, var* pPhase)
{
    vars mxb_n  = series(0, 2);     // per-instance CurrentBar (9d.9)
    vars mxb_S  = series(0, 7);
    vars mxb_De = series(0, 7);
    vars mxb_I1 = series(0, 7);
    vars mxb_Q1 = series(0, 7);
    vars mxb_jI = series(0, 2);
    vars mxb_jQ = series(0, 2);
    vars mxb_I2 = series(0, 2);
    vars mxb_Q2 = series(0, 2);
    vars mxb_Re = series(0, 2);
    vars mxb_Im = series(0, 2);
    vars mxb_P  = series(0, 2);
    vars mxb_SP = series(0, 2);
    vars mxb_Ph = series(0, 2);
    vars mxb_A  = series(0, 2);
    vars mxb_M  = series(0, 2);
    vars mxb_F  = series(0, 2);
    mxb_n[0] = mxb_n[1] + 1;
    // EasyLanguage: a var keeps its value on a bar where it is not assigned (MA-2)
    mxb_S[0] = mxb_S[1];   mxb_De[0] = mxb_De[1]; mxb_I1[0] = mxb_I1[1]; mxb_Q1[0] = mxb_Q1[1];
    mxb_jI[0] = mxb_jI[1]; mxb_jQ[0] = mxb_jQ[1]; mxb_I2[0] = mxb_I2[1]; mxb_Q2[0] = mxb_Q2[1];
    mxb_Re[0] = mxb_Re[1]; mxb_Im[0] = mxb_Im[1]; mxb_P[0] = mxb_P[1];   mxb_SP[0] = mxb_SP[1];
    mxb_Ph[0] = mxb_Ph[1]; mxb_A[0] = mxb_A[1];   mxb_M[0] = mxb_M[1];   mxb_F[0] = mxb_F[1];
    var mxb_w1 = 962;  mxb_w1 = mxb_w1/10000;
    var mxb_w2 = 5769; mxb_w2 = mxb_w2/10000;
    var mxb_ka = 75;   mxb_ka = mxb_ka/1000;
    var mxb_kb = 54;   mxb_kb = mxb_kb/100;
    var mxb_a2 = 2;    mxb_a2 = mxb_a2/10;
    var mxb_a8 = 8;    mxb_a8 = mxb_a8/10;
    var mxb_c33 = 33;  mxb_c33 = mxb_c33/100;
    var mxb_c67 = 67;  mxb_c67 = mxb_c67/100;
    var mxb_up = 15;   mxb_up = mxb_up/10;
    var mxb_dn = 68;   mxb_dn = mxb_dn/100;
    var mxb_pi = 4;    mxb_pi = mxb_pi*atan(1);       // S1: exact pi at run time (D3)
    var mxb_deg = 180; mxb_deg = mxb_deg/mxb_pi;
    var mxb_h = 1;     mxb_h = mxb_h/2;
    var mxb_u = 1;
    var mxb_pf = 0;
    var mxb_p1 = 0;
    var mxb_dp = 0;
    var mxb_ah = 0;
    if(mxb_n[0] > 5) {
        mxb_S[0] = 4*Price[0] + 3*Price[1] + 2*Price[2] + Price[3];
        mxb_S[0] = mxb_S[0]/10;
        mxb_pf = mxb_ka*mxb_P[1] + mxb_kb;
        mxb_De[0] = (mxb_w1*mxb_S[0] + mxb_w2*mxb_S[2] - mxb_w2*mxb_S[4] - mxb_w1*mxb_S[6])*mxb_pf;
        mxb_Q1[0] = (mxb_w1*mxb_De[0] + mxb_w2*mxb_De[2] - mxb_w2*mxb_De[4] - mxb_w1*mxb_De[6])*mxb_pf;
        mxb_I1[0] = mxb_De[3];
        mxb_jI[0] = (mxb_w1*mxb_I1[0] + mxb_w2*mxb_I1[2] - mxb_w2*mxb_I1[4] - mxb_w1*mxb_I1[6])*mxb_pf;
        mxb_jQ[0] = (mxb_w1*mxb_Q1[0] + mxb_w2*mxb_Q1[2] - mxb_w2*mxb_Q1[4] - mxb_w1*mxb_Q1[6])*mxb_pf;
        mxb_I2[0] = mxb_I1[0] - mxb_jQ[0];
        mxb_Q2[0] = mxb_Q1[0] + mxb_jI[0];
        mxb_I2[0] = mxb_a2*mxb_I2[0] + mxb_a8*mxb_I2[1];
        mxb_Q2[0] = mxb_a2*mxb_Q2[0] + mxb_a8*mxb_Q2[1];
        mxb_Re[0] = mxb_I2[0]*mxb_I2[1] + mxb_Q2[0]*mxb_Q2[1];
        mxb_Im[0] = mxb_I2[0]*mxb_Q2[1] - mxb_Q2[0]*mxb_I2[1];
        mxb_Re[0] = mxb_a2*mxb_Re[0] + mxb_a8*mxb_Re[1];
        mxb_Im[0] = mxb_a2*mxb_Im[0] + mxb_a8*mxb_Im[1];
        if(mxb_Im[0] != 0 && mxb_Re[0] != 0) {
            mxb_P[0] = atan(mxb_Im[0]/mxb_Re[0]);
            mxb_P[0] = mxb_P[0]*mxb_deg;
            mxb_P[0] = 360/mxb_P[0];
        }
        mxb_p1 = mxb_P[1];
        if(mxb_P[0] > mxb_up*mxb_p1) mxb_P[0] = mxb_up*mxb_p1;
        if(mxb_P[0] < mxb_dn*mxb_p1) mxb_P[0] = mxb_dn*mxb_p1;
        if(mxb_P[0] < 6)  mxb_P[0] = 6;
        if(mxb_P[0] > 50) mxb_P[0] = 50;
        mxb_P[0] = mxb_a2*mxb_P[0] + mxb_a8*mxb_p1;
        mxb_SP[0] = mxb_c33*mxb_P[0] + mxb_c67*mxb_SP[1];
        if(mxb_I1[0] != 0) {
            mxb_Ph[0] = atan(mxb_Q1[0]/mxb_I1[0]);
            mxb_Ph[0] = mxb_Ph[0]*mxb_deg;
        }
        mxb_dp = mxb_Ph[1] - mxb_Ph[0];
        if(mxb_dp < 1) mxb_dp = 1;
        mxb_A[0] = FastLimit/mxb_dp;
        if(mxb_A[0] < SlowLimit) mxb_A[0] = SlowLimit;
        if(mxb_A[0] > FastLimit) mxb_A[0] = FastLimit;
        mxb_M[0] = mxb_A[0]*Price[0] + (mxb_u - mxb_A[0])*mxb_M[1];
        mxb_ah = mxb_h*mxb_A[0];
        mxb_F[0] = mxb_ah*mxb_M[0] + (mxb_u - mxb_ah)*mxb_F[1];
    }
    *pFama   = mxb_F[0];
    *pPeriod = mxb_P[0];
    *pAlpha  = mxb_A[0];
    *pPhase  = mxb_Ph[0];
    return mxb_M[0];
}'''
