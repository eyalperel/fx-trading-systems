comment = "NCS: the correct body with the running ATR value (at_A) replaced by ONE file static ats_prev (read as the previous value, written at the end of every call); counter and TR per instance. Called as two instances per bar, NCS then NCS2 (both Length 14), each on the 16 base and band inputs in the generator's variant-major order (32 calls per bar); the static is shared by all 32 calls. Exports atr only. Restart Zorro before a rerun."
body = '''
static var ats_prev = 0;         // NCS: the running ATR in ONE file static shared by every call (restart Zorro before a rerun)
var atr_ncs(vars High, vars Low, vars Close, int Length)
{
    vars ats_n  = series(0, 2);            // per-instance CurrentBar (9d.9)
    vars ats_TR = series(0, Length + 2);   // explicit length (9d.10)
    var ats_a = 0;
    var ats_th = 0;
    var ats_tl = 0;
    var ats_s  = 0;
    int ats_i;
    ats_n[0] = ats_n[1] + 1;
    ats_TR[0] = 0;
    if(ats_n[0] > 1) {
        ats_th = High[0];
        if(Close[1] > ats_th) ats_th = Close[1];
        ats_tl = Low[0];
        if(Close[1] < ats_tl) ats_tl = Close[1];
        ats_TR[0] = ats_th - ats_tl;
    }
    if(ats_n[0] == Length + 1) {
        for(ats_i = 0; ats_i < Length; ats_i++)
            ats_s = ats_s + ats_TR[ats_i];
        ats_a = ats_s/Length;
    }
    if(ats_n[0] > Length + 1)
        ats_a = ats_prev + (ats_TR[0] - ats_TR[Length])/Length;
    ats_prev = ats_a;                      // the shared state
    return ats_a;
}'''
