# ATR_MT4Fidelity.toml -- Average True Range, MetaTrader 4 definition (NNFX "ATR 14, default settings"), SOURCE FIDELITY + IMPLEMENTATION
# (HARNESS_DESIGN section 1, both questions), the THIRD spec of the D7 family (MAMA_ArticleFidelity, FRAMA_ArticleFidelity first); D7 APPLIED
# with the tooling additions of ATR stage 1: the three of the brief (a column role `scale` for equivariance, the `window_hull` bound, the `rampdn`
# bars input) and the ones they needed ([tolerances.bound].abs, the `range_bound` check, the `known_value` kind, [inputs].band_flat, [checks].bar_args).
# Pre-registration: this file, committed BEFORE indicators/nnfx/ATR.c / the controls are written and BEFORE the generated script is run
# (CLAUDE.md section 4.2). Amendments are dated and appended at the end of the file, never edited in place.
# DRAFT of ATR stage 1 (planning chat 2026-11-21; review docs/harness/ATR_SOURCE_REVIEW.md (e11270a) AT-1..AT-7, decisions S1..S8 accepted by the
# user; brief docs/harness/ATR_STAGE1_PROMPT.md; planning numbers docs/harness/ATR_STAGE1_NUMBERS.py + _output.txt). Tooling: the D7 path of
# generator.py / checker.py ([checks].adaptive = true, bars inputs, bar_args = "hlc") and the reference models atr_mt4 / atr_shared (reference.py).
# Labels: (a) source states, (b) measured / computed here, (c) inference. Ids must not contain '-'. Rows are numbered n = 0, 1, ... (0-based):
# "row 1" of the brief / D7 = n 0; ATR[P] of the source = n P. Row 0 of an instance = its first call.
#
# What D7 changes against the oscillator specs (D6), as mapped to ATR:
#   * Bars inputs: ATRMT4Core(High, Low, Close, Length, &tr). Point bars pass x as High, Low and Close (H = L = C = x); band bars
#     (flatB, rampB, rampdnB, s5B .. s100B) pass the same x as Close with High = x + h, Low = x - h, h = 2/10000 (S3: with h above every per-bar
#     move TR is constant and the averaging is blind, review section 3 item 4; here h = 2e-4 is below the largest per-bar move of every sine, 6.3e-4 at
#     T = 100 (amplitude x 2 pi / T), so TR varies on every sine; on the ramps and flat TR is constant by construction).
#   * The output is a price-DIFFERENCE level: copies sc = 10 x - 9.9 and of = x + 1.1 of s40B (x, High and Low mapped together) are checked
#     for equivariance with the role `scale`: copy = |k| x base column for tr and atr, the offset has no effect, from n = 1 (S1).
#   * Trace of tr and atr on all 16 inputs from n >= 0 (D7 row 1), start-up included (rows 0..P-1 of atr are 0, row P is the mean of TR[1..P]).
#     Conditioning (D7 rule 3): every (input, column) pair is CHECKED, none is INFO (no division by a data-dependent quantity).
#   * Known answers: flat 0; flatB, rampB, rampdnB 2h = 4e-4; ramp, rampdn the slope 1e-4, rows n >= P. Bounds: atr >= 0, tr >= High - Low
#     (rows n >= 1), and the window hull min TR[r-P+1..r] <= atr[r] <= max TR[r-P+1..r] (rows n >= P), absolute allowance 1e-15.
#   * Two variants: Length 14 (the template) and Length 20 (the window is a parameter, not a constant).
#   * NCS / NCS2 are an INLINE control body (the correct body with the running ATR in ONE file static, ats_prev) called as two instances on
#     the 16 inputs; the shared state is the IIR state (D7 rule 7). Restart Zorro before a rerun (see [run_notes]).


[batch]
name = "ATR_MT4Fidelity"
id_prefix = "ATR"
indicator = "ATRMT4Core"                 # Light-C function called by the `param` variants (corrected indicators/nnfx/ATR.c, stage 2)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/ATR_MT4Fidelity.toml (this file)"
script_name = "GEN_ATR_MT4"              # generated Light-C file; the generator never overwrites

[source]
article = "(a) MetaQuotes ATR.mq4, installed copy (MQL4/Indicators, 3900 bytes), sha256 prefixes 134da529e0382b89 (two copies, 2000-2026) and c5c680c466e7d87f (two copies, 2000-2025); the two differ only in the copyright year, the code is identical (docs/harness/ATR_SOURCE_REVIEW.md section 2). NNFX: ATR period 14, default settings (docs/sources/NNFX_Sources.md, review section 1)."
formula = """
(a) InpAtrPeriod = 14 (line 16); TR[0] = 0, ATR[0] = 0 (lines 76-77);
    TR[i] = max(high[i], close[i-1]) - min(low[i], close[i-1]), i = 1 .. (lines 79-80);
    ATR[1..P] = 0 while the sum is formed, ATR[P] = sum(TR[1..P]) / P (lines 83-90); TR[0] never enters;
    ATR[i] = ATR[i-1] + (TR[i] - TR[i-P]) / P for i = P + 1 .. (line 99, the running form).
(a) Per indicator instance: row 0 of the instance = its first call. There is no literal other than the integer period, no PI, no trig.
(b) Exported here: tr = TR, atr = ATR (the return value). ATR is the simple P-bar mean of TR (not Wilder's recursive form; Zorro's own ATR() is
    Wilder's, ATRS() is this definition: review section 2).
"""
reference = "analysis/harness/reference.py atr_mt4(P, tr_kind, avg, first, startup) (simulate_atr: per-instance state, the corrected code's operation order: TR as th - tl, the first window summed newest to oldest, the running update A[1] + (TR[0] - TR[P])/P), atr_shared(Ps, index) (simulate_atr_shared: NCS, ONE shared ats_prev over every call in the generator's ACTUAL call order, parsed from the generated script)"
d1 = "(b) D1 rule 2: the only constant of the source is the integer period; there is no replacement and no 'as printed' INFO variant. The band half-width h = 2/10000 and the sc / of copies are built at run time from integers (gotchas 9d.1)."
review_only = "(b) Checked by CODE REVIEW only: (1) the Close[1] read on the instance's first call is unreachable by construction (the corrected code reads it only when the call counter is > 1; stage 2's pre-run item (i) asserts the guard line verbatim); (2) the running form against the direct P-bar mean (AT-4): measured <= 5.6e-17 over 3000 rows in the review (finding 3), not re-measured by a run."
other_forms = "(c) Wilder's recursive ATR (Zorro ATR()) is not the template default; if ever used it is a named, counted, pre-registered variant. The compiled iATR of MT4 is not proven identical to the published ATR.mq4 (review AT-7, recorded only)."


# Pre-registered corrected indicators/nnfx/ATR.c (the brief's code block, verbatim). Written in stage 2 AFTER this file is committed; a test
# then asserts the function bodies equal these lines (whitespace-normalised, comments stripped). reference.atr_mt4 implements exactly these
# lines (same operations in the same order; IMP must pass).
[corrected_code]
file = "indicators/nnfx/ATR.c"
function = "var ATRMT4Core(vars High, vars Low, vars Close, int Length, var* pTR)"
lines = """
    vars at_n  = series(0, 2);            // per-instance CurrentBar (9d.9); row r = at_n[0] - 1
    vars at_TR = series(0, Length + 2);   // explicit length (9d.10): reads at_TR[Length]
    vars at_A  = series(0, 2);
    var at_th = 0;
    var at_tl = 0;
    var at_s  = 0;
    int at_i;
    at_n[0] = at_n[1] + 1;
    at_TR[0] = 0;                         // row 0: no previous close (ATR.mq4 line 76)
    at_A[0] = 0;                          // rows 0..Length-1: 0 (lines 77, 85)
    if(at_n[0] > 1) {
        at_th = High[0];
        if(Close[1] > at_th) at_th = Close[1];
        at_tl = Low[0];
        if(Close[1] < at_tl) at_tl = Close[1];
        at_TR[0] = at_th - at_tl;         // line 80 / 98
    }
    if(at_n[0] == Length + 1) {           // row Length: mean of TR[1..Length] (lines 83-90)
        for(at_i = 0; at_i < Length; at_i++)
            at_s = at_s + at_TR[at_i];
        at_A[0] = at_s/Length;
    }
    if(at_n[0] > Length + 1)              // line 99, running form kept (AT-4)
        at_A[0] = at_A[1] + (at_TR[0] - at_TR[Length])/Length;
    *pTR = at_TR[0];
    return at_A[0];"""
wrapper_function = "var ATRMT4(vars High, vars Low, vars Close, int Length)"
wrapper_lines = """
    var atw_1;
    return ATRMT4Core(High, Low, Close, Length, &atw_1);"""
notes = """(b) New file (AT-1): the library has no ATR indicator (review header). Names ATRMT4Core / ATRMT4 because Zorro has built-in ATR() overloads (manual ta.htm); (b) grep of C:/Zorro/include for ATRMT4: no hit (ATR stage 1 report). Prefixes at_ (core), atw_ (wrapper), ats_ (NCS body), ax0_ / axi_ / axr_ / axz_ (NC0 / NCWi / NCR / NCZ): a repo grep found none in use (ATR stage 1 report); stage 2 adds them to gotchas 1.3.
(b) Every series() call is unconditional and first (gotchas 3.1) and has an explicit length (9d.10): the per-instance counter and ATR series length 2, the TR series Length + 2 (it reads at_TR[Length]); no static (lint); no decimal literal; every expression starts with a variable (9d.8).
(b) The sum loop reads at_TR[0..Length-1] = rows Length .. 1: the source's TR[1..Length], newest first. Callers: none today (grep ATRMT4); the template (step 4) passes series(priceHigh()), series(priceLow()), series(priceClose()).
(c) Stage 2 must check that a series() whose length depends on a parameter (series(0, Length + 2)) compiles and allocates per call in Light-C; if it is refused, STOP and report (fallback: a fixed upper bound, e.g. 64, with a Length <= 62 guard).
(c) The caller's High / Low / Close series must hold >= Length + 1 values ([zorro].series_len = 22 >= 21): the core reads only High[0], Low[0] and Close[1], the rule keeps the margin of the other harness specs."""


[zorro]
include = ["../../indicators/nnfx/ATR.c"]   # resolved from strategies/tests/; written in stage 2 (lint reports it missing until then, as FRAMA stage 1)
raw_file = "Data/GEN_ATR_raw.csv"
marker_file = "Data/GEN_ATR_exit_marker.txt"       # gotchas 9d.4: never fires; NOT a check on the run card
clock_asset = "EUR/USD"
bar_period = 1440
start_date = 20080101
end_date = 20240101
series_len = 22           # (c) >= Length + 1 for the largest Length (AT20: 21), made 22; the core reads High[0], Low[0], Close[1] only

[inputs]
n_bars = 3000
warmup = 0                # D7 rule 2: no W cut; every check reads rows n >= 0 (trace from row 1)
level = [11, 10]          # 1.1, built at run time from integers (gotchas 9d.1)
amp = [1, 100]            # 0.01
slope = [1, 10000]        # 0.0001
sine_periods = [5, 10, 20, 40, 100]
ramp_down = true          # ATR stage 1 (tooling): adds 'rampdn' = level - slope*n after 'ramp'
band_flat = true          # ATR stage 1 (tooling): allows the band copy flatB (older specs refuse a flat band input)
band_half = [2, 10000]    # S3: h = 2e-4 built at run time from integers; below the largest per-bar move of every sine (6.3e-4 at T = 100), so TR varies
band_inputs = ["flat", "ramp", "rampdn", "s5", "s10", "s20", "s40", "s100"]   # band copies flatB, rampB, rampdnB, s5B .. s100B (High = x + h, Low = x - h)

[inputs.equivariance]     # D7 rule 5: affine copies of s40B only: sc = 10 x - 9.9, of = x + 1.1; High / Low mapped the same way (h -> 10 h for sc)
inputs = ["s40B"]
transforms = [{ id = "sc", scale = [10, 1], offset = [-99, 10] }, { id = "of", scale = [1, 1], offset = [11, 10] }]

[clock]
lo = 0.8
hi = 1.7
source = "(b) h1_check.py CLOCK_LO/CLOCK_HI: EUR/USD D1 closes lie inside; magnitude guard against a wrong asset"

[checks]                  # HARNESS_DESIGN D7 (rules 1-8) as mapped here
adaptive = true
bars = true                                          # calls pass three series
bar_args = "hlc"                                     # ... in the order (High, Low, Close): ATRMT4Core(High, Low, Close, Length, &tr)
columns = ["tr", "atr"]
level_columns = []                                   # no level column: ATR is a difference, not a price level
scale_columns = ["tr", "atr"]                        # equivariance role `scale`: copy = |k| x base, the offset has no effect
equivariance_from_n = 1                              # rows >= 1 (brief S1); at n = 0 tr = atr = 0 on every input, so n >= 0 would add nothing
range_bound = ["tr"]                                 # tr >= High - Low, rows n >= 1, absolute allowance [tolerances.bound].abs
window_hull = { atr = "tr" }                         # min TR[r-P+1..r] <= atr[r] <= max TR[r-P+1..r], rows n >= P (P = the table's window)
source = """(a)/(b) D7 mapped to ATR: rule 1 tr and atr exported; rule 2 trace of every column from n >= 0 against atr_mt4, start-up included; rule 3
per (input, column) classification ([conditioning]; none is INFO); rule 4 bounds (atr >= 0, tr >= High - Low, window hull); rule 5
equivariance on s40B, copies sc and of, role `scale`; rule 6 known answers (flat 0, band 2h, ramp slope); rule 7 NCS / NCS2; rule 8 no
linear checks. The TR window of the hull is the model's TR where a variant exports no tr column (NCS / NCS2)."""

[checks.known_value]      # column = { input = [n, d] }: the column equals n/d on every row n >= the expected table's window
atr = { flat = [0, 1], flatB = [4, 10000], ramp = [1, 10000], rampdn = [1, 10000], rampB = [4, 10000], rampdnB = [4, 10000] }


[conditioning]            # D7 rule 3, the pre-run classifier (checker.conditioning_table), deterministic
seed = 20261121
draws = 5
skip_draws = 0
order = ["flat", "flatB", "ramp", "rampB", "rampdn", "rampdnB", "s5", "s5B", "s10", "s10B", "s20", "s20B", "s40", "s40B", "s100", "s100B"]
bound = { tr = 1e-13, atr = 1e-13 }
source = """(b) S7: bound = trace tolerance / 10 = 1e-13. One numpy default_rng(20261121), never re-seeded; per real expected table (AT14, then AT20),
per input in `order` (the planning chat's order: flat, flatB, ramp, rampB, ... point then band per base input), then per table the copies
(sc40B, of40B): 5 perturbations x(1 + 2^-52 u), u = rng.integers(-1, 2, 3000), and the max over ALL rows of |column(perturbed) - column(x)| of the
MODEL (reference.atr_mt4). Band inputs: High / Low = y +- h built from the perturbed y (a copy of a band input with h x 10 (sc) / h (of)).
A pair above its bound is INFO. A recomputed classification that differs from the lists below is a pre-run STOP (pass condition, pre-run
(vii))."""

[tolerances.x]
value = 1e-12
source = "(a) STEP2_HANDOFF Stage 3 G4 (= h1_check.TOL_X). Covers the band inputs' exported High / Low (xh_ / xl_ columns) and the copies."
[tolerances.trace]
value = 1e-12
source = "(c) S6 (user, 2026-11-21): trace 1e-12 for tr and atr, every checked (input, column) pair, every row n >= 0. Window: [floor] x10 <= tolerance (D2 rule 3); the smallest required control effect (NCWi, 1.870e-4 on s40) / 10 = 1.9e-5 >= 1e-12."
[tolerances.bound]
value = 1e-12
abs = 1e-15
source = "(c) S6: atr >= 0 and tr >= High - Low with an ABSOLUTE allowance 1e-15 (the bound is 0, so the D6 relative allowance |bound| x 1e-12 would be 0); the relative part (|bound| x 1e-12) is kept for any non-zero bound. Tolerance of a bound row = |bound| x value + abs."
[tolerances.window_hull]
value = 1e-12
abs = 1e-15
source = "(c) S6: the window hull's net excess (violation minus the relative allowance |violated bound| x 1e-12) must be <= the absolute 1e-15. At the ATR scale (4e-4 .. 9e-3) the relative part is 4e-16 .. 9e-15, so a 1e-12-RELATIVE excess (4e-16) is inside the allowance; a 1e-12 ABSOLUTE excess fires (ATR stage 1 report)."
[tolerances.equivariance]
value = 1e-12
source = "(c) S6: copy = |k| x base for tr and atr, rows n >= 1, as the trace (1e-12). Zorro-internal, no model. (b) Model floor [floor].equivariance."
[tolerances.known_value]
value = 1e-12
source = "(c) S6: flat 0, band 2h, ramp slope as values, rows n >= P. (b) The model's own residual is the floor ([floor].known_value, <= 4.5e-17)."
[tolerances.imp]
value = 1e-12
source = "(c) S6: as the trace. (b) Expected residual: [floor] imp_estimate (the %.15f rounding of the exported x, High, Low through the model)."

[lint]
no_static = ["indicators/nnfx/ATR.c"]
source = "(b) As LRSI / FSH / FRAMA: the corrected ATR.c must contain no `static` token (comments and strings excluded): the structural check for AT-3. generator.lint_no_static; seen to fire on the NCS body (1 hit, ats_prev: test_generator_atr). Until stage 2 the file does not exist: lint reports it, as it reports the missing include."


