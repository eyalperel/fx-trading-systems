comment = "NC0: off-by-one first window (review finding 2): the first mean sums TR[1..Length] of the series, i.e. TR rows Length-1 .. 0 (row 0's TR = 0 included); the running update is unchanged, so the error persists (the dropped TR is never restored)."
body = '''
var atr_nc0(vars High, vars Low, vars Close, int Length, var* pTR)
{
    vars ax0_n  = series(0, 2);            // per-instance CurrentBar (9d.9); row r = ax0_n[0] - 1
    vars ax0_TR = series(0, Length + 2);   // explicit length (9d.10): reads ax0_TR[Length]
    vars ax0_A  = series(0, 2);
    var ax0_th = 0;
    var ax0_tl = 0;
    var ax0_s  = 0;
    int ax0_i;
    ax0_n[0] = ax0_n[1] + 1;
    ax0_TR[0] = 0;                         // row 0: no previous close (ATR.mq4 line 76)
    ax0_A[0] = 0;                          // rows 0..Length-1: 0 (lines 77, 85)
    if(ax0_n[0] > 1) {
        ax0_th = High[0];
