[pass_condition]
text = """ATR source fidelity and implementation PASS only if ALL of the following hold; any other outcome is FAIL, recorded and kept
(CLAUDE.md section 4.8), and its cause found before anything is changed:
1. All 90 real checks PASS: 2 variants (AT14, AT20) x 45 checks = trace 32 (tr and atr on the 16 inputs: point flat, ramp, rampdn, s5 .. s100; band
   flatB, rampB, rampdnB, s5B .. s100B; every row n >= 0, start-up included; none is INFO) + bound 3 (atr >= 0; tr >= High - Low, rows n >= 1;
   window hull of atr against the TR window of length P, rows n >= P; every input incl. the copies; absolute allowance 1e-15) + known answers 6
   (atr on flat 0, flatB / rampB / rampdnB 4e-4, ramp / rampdn 1e-4, rows n >= P) + equivariance 4 (s40B, copies sc and of, tr and atr = |k| x base,
   rows n >= 1). The brief expected 45 / 90: no difference. Rows 0..P-1 of atr are 0 on every input (covered by the trace; the known answers
   start at row P).
2. Each of the 7 negative controls (NCW, NC0, NCWi, NCR, NCZ, NCS, NCS2) FAILS on every kind listed in [detect.required]. A control that passes =
   harness broken.
3. No input guard fires (x[n] incl. the band inputs and the copies, and the exported High / Low of the band inputs and band copies (xh_ / xl_),
   vs recomputed, tol 1e-12; clock range), no row is ERROR in ANY variant, no NaN / infinite value.
4. No line starting with 'Error' in the Zorro window (gotchas 9d.3). The EXITRUN marker / EXIT line is NOT a check (gotchas 9d.4: it never fires).
5. The results file reports the variant count: 2 real + 7 negative controls = 9 variants.
6. IMP: every [imp].must_pass replay <= 1e-12 on every CHECKED pair of every input the variant is called on (9 variants), and both [imp].must_fail
   replays exceed it (AT14 vs the NCWi model; NCS vs the AT14 model; guard seen to fire).
7. Floor guard: for every real variant, max |Zorro - model| <= tolerance / 10 for trace (1e-13), equivariance (1e-13) and known_value (1e-13)
   (D2 rule 3 floor side). If exceeded, the window is invalid: the result is NOT accepted until explained, even if items 1-6 hold.
Pre-run (not run-time) conditions, done before the [Test] click and recorded in Amendment 1 (stage 2):
   (i) the corrected ATR.c contains [corrected_code].lines and wrapper_lines verbatim (whitespace-normalised, comments stripped; function body EQUALS);
   (ii) the file is new: no old blob exists; the callers of ATRMT4 are none (grep); the Zorro include folder has no ATRMT4 (grep, recorded);
   (iii) reference.py reproduces this file's conditioning values, floors, effects, [findings] and IMP fire-test numbers to <= 1e-9 relative (an
        absolute 1e-15 for values below 1e-6). Every number is stored at full precision. Each inline control body is checked at run time, not by
        reading: IMP must_pass replays every variant with its own model (pass item 6);
   (iv) generator --lint-only passes on this file (D2 windows ok, every required margin >= 10x; after stage 2 also the include resolves and the
        no-static check passes);
   (v) no-static lint: indicators/nnfx/ATR.c contains no `static` token (comments excluded); the check is seen to fire on the NCS body (1 hit:
        ats_prev). Recorded here and in the results header (INFO L_NO_STATIC line);
   (vi) a series() whose length is an expression (series(0, Length + 2)) compiles in Light-C and allocates one slot per call (stage 2; STOP
        if refused: fixed-bound fallback in [corrected_code].notes);
   (vii) the conditioning classification recomputed by the tooling (checker.conditioning_table: same seed, draw order and bound) equals the INFO
        lists of [expected.AT14.conditioning] and [expected.AT20.conditioning] (both empty: checker.conditioning_mismatches = []); a mismatch is a STOP;
   (viii) the NCS replay order is taken from the generated script (the call lines in text order), not from the input list (MAF lesson 1)."""

# ----------------------------------------------------------------------------- observations (INFO only)
[observations]
O_MARGIN = "Report the generator's D2 INFO lines (floor x10 vs tolerance per kind; per-control margin) in the results header."
O_CONDITIONING = "(b) Rule 3 classification ([expected.*.conditioning], both variants): every (input, column) pair CHECKED, none INFO. Largest: tr 4.441e-16 (every point sine, ramp and flat), atr 3.965e-16 (AT14 flat) / 3.442e-16 (AT20 flat); bound 1e-13 (planning item 1, reproduced; the copies sc40B / of40B are classified by the tooling only)."
O_KNOWN = "(b) Known answers (planning item 2, reproduced): flat 0 (diff 0), flatB / rampB / rampdnB 2h = 4e-4 (<= 4.407e-17), ramp / rampdn 1e-4 (<= 1.118e-17), rows >= P; rows 0..P-1 exactly 0 on every input; start-up s20 AT14 ATR[14] = 0.002107897511639391, AT20 ATR[20] = 0.0020000000000000018."
O_BOUNDS = "(b) Bounds (planning item 3, reproduced): atr >= 0 (min 0), tr - (H - L) >= 0 (min 0), window hull violation 0 on every input and copy."
O_NCS = "(b) NCS / NCS2 (two instances, 32 shared calls per bar in the generator's variant-major order = per bar NCS on the 16 inputs in the script's order, then NCS2): min over (instance, input) of max |control - AT14| over all rows = 0.0025700975339346807 in the GENERATED order (parsed from the script text; test_generator_atr). For comparison: the input-major order over the same 16 inputs gives 0.0028060272811000647; the planning chat's two ASSUMED orders (its own input-list order, which differs from the script's band_inputs order) gave 2.581e-03 (instance-major) and 3.265e-03 (input-major): the number depends on the order, which is why it is taken from the script. Every (instance, input) is far above 10 x the trace tolerance. Source: tests/atr_support.numbers()[ncs]."
