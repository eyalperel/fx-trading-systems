[[variants]]
id = "NCL"
role = "info"
label = "NCL: article as printed (1.414, 3.14159) vs L20 article"
kind = "inline"
function = "rfx_ncl"
params = [20]
expected = "L20"
outputs = ["sum", "ms", "r"]
comment = "INFO variant (not a control, not in [detect]; D1 rule 3): the article as PRINTED, 1.414 and 3.14159 built from integers at run time (1414/1000, 314159/100000, gotchas 9d.1 / 9d.8) in the exponent; the cosine's 180 degrees is the PI macro (Zorro float32 PI, as the other variants). Everything else as [corrected_code]. L = 20. Reported, never PASS/FAIL."
body = '''
var rfx_ncl(vars Price, int Length, var* pSum, var* pMS)
{
	var ncl_f = 1414;
	ncl_f = ncl_f / 1000;
	var ncl_g = 314159;
	ncl_g = ncl_g / 100000;
	var ncl_half = Length;
	ncl_half = ncl_half / 2;
	var ncl_a1 = exp(-ncl_f * ncl_g / ncl_half);
	var ncl_b1 = 2.0 * ncl_a1 * cos(ncl_f * PI / ncl_half);
	var ncl_c2 = ncl_b1;
	var ncl_c3 = -ncl_a1 * ncl_a1;
	var ncl_c1 = 1.0 - ncl_c2 - ncl_c3;
	var ncl_w1 = 4;
	ncl_w1 = ncl_w1 / 100;
	var ncl_w2 = 96;
	ncl_w2 = ncl_w2 / 100;
	vars ncl_Filt = series(Price[0], Length + 2);
	vars ncl_MS = series(0, 2);
	ncl_Filt[0] = ncl_c1 * (Price[0] + Price[1]) / 2.0 + ncl_c2 * ncl_Filt[1] + ncl_c3 * ncl_Filt[2];
	var ncl_Slope = (ncl_Filt[Length] - ncl_Filt[0]) / Length;
	var ncl_Sum = 0;
	int ncl_i;
	for(ncl_i = 1; ncl_i <= Length; ncl_i++)
		ncl_Sum += (ncl_Filt[0] + ncl_i * ncl_Slope) - ncl_Filt[ncl_i];
	ncl_Sum = ncl_Sum / Length;
	ncl_MS[0] = ncl_w1 * ncl_Sum * ncl_Sum + ncl_w2 * ncl_MS[1];
	var ncl_R = 0;
	if(ncl_MS[0] > 0)
		ncl_R = ncl_Sum / sqrt(ncl_MS[0]);
	*pSum = ncl_Sum;
	*pMS = ncl_MS[0];
	return ncl_R;
}'''
