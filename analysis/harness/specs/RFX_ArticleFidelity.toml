label = "NCA: pole factor a1 + 1/1000 vs L20 article"
kind = "inline"
function = "rfx_nca"
params = [20]
expected = "L20"
outputs = ["sum", "ms", "r"]
comment = "NCA: realistic copying error in the pole factor (D2 rule 4). [corrected_code] except a1 + 1/1000 (1/1000 built from a variable, 9d.8) BEFORE b1, c3 and c1 are derived. L = 20."
body = '''
var rfx_nca(vars Price, int Length, var* pSum, var* pMS)
{
	var nca_k = sqrt(2.0);
	var nca_half = Length;
	nca_half = nca_half / 2;
	var nca_a1 = exp(-nca_k * PI / nca_half);
	var nca_e = 1;
	nca_e = nca_e / 1000;
	nca_a1 = nca_a1 + nca_e;
	var nca_b1 = 2.0 * nca_a1 * cos(nca_k * PI / nca_half);
	var nca_c2 = nca_b1;
	var nca_c3 = -nca_a1 * nca_a1;
	var nca_c1 = 1.0 - nca_c2 - nca_c3;
	var nca_w1 = 4;
	nca_w1 = nca_w1 / 100;
	var nca_w2 = 96;
	nca_w2 = nca_w2 / 100;
	vars nca_Filt = series(Price[0], Length + 2);
