# RFX_ArticleFidelity.toml -- Reflex (Ehlers V.38:02), SOURCE FIDELITY + IMPLEMENTATION (HARNESS_DESIGN §1, both questions), first spec of
# the OSCILLATOR family (HARNESS_DESIGN D6).
# Pre-registration: this file, committed BEFORE the corrected Reflex.c / Reflex_Superseded.c are written and BEFORE the generated script is
# run (CLAUDE.md §4.2). Amendments are dated and appended at the end of the file, never edited in place.
# DRAFT of RFX stage 1 (planning chat 2026-11-18; decisions R-1..R-5 of docs/harness/REFLEX_SOURCE_REVIEW.md and D6 accepted by the user;
# brief docs/harness/RFX_STAGE1_PROMPT.md), built on tooling that adds multi-output calls (`outputs`), invariance copies of the sines,
# the checks trace / bound / invariance and the shared-state replay (generator / checker / reference, this branch).
# Format: as specs/USE_ArticleFidelity.toml. Labels: (a) source states, (b) measured / computed here, (c) inference.
# Ids must not contain '-' (check ids are <prefix>-<variantid>-<check>).
#
# What differs from USE:
#   * One integer parameter per call (Length). Real variants L14 / L20 (source default) / L21 (odd Length, R-2) / L30.
#   * Every variant is called through ReflexCore(Price, Length, &sum, &ms) and exports three outputs: sum (linear stage), ms and r (the
#     normalised Reflex). The v1 checks (flat, gains, phases, alternating input, ramp residual; D4) read `sum`; trace / bound /
#     invariance read `r` (D6 rules 1-4).
#   * DC gain 0 (Sum has a double zero at DC): D4 rule 2 / 4, no ramp-lag check. The alt phase row is SKIP in every variant (H_Sum has a zero at Nyquist).
#   * Start-up: no rule in the source (R-4). Start-up rows of r are INFO only (rows < W = 700); IMP and trace replay rows >= W.
#   * Flat / ramp rows of the normalised output are INFO only (finding 5: ill-conditioned).
#   * NCS / NCT are the REAL superseded file (Reflex_Superseded.c, written in stage 2) called as TWO instances (L20, L14) in call order: one static MS is shared by ALL
#     16 calls of every bar (R-1). Two spec variants because the grammar has one call-site group per variant (deviation from the brief, flagged in the stage-1 report).

[batch]
name = "RFX_ArticleFidelity"
id_prefix = "RFX"
indicator = "ReflexCore"            # Light-C function called by the `param` variants (corrected Reflex.c, stage 2)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/RFX_ArticleFidelity.toml (this file)"
script_name = "GEN_RFX_Reflex"       # generated Light-C file; the generator never overwrites

[source]
article = "Ehlers, J. F., 'Reflex: A New Zero-Lag Indicator', Technical Analysis of Stocks & Commodities V.38:02 (2020), pp. 6-8, 21, sidebar 'EasyLanguage Code For Reflex Indicator'"
formula = """
(a) a1 = expvalue(-1.414*3.14159 / (.5*Length));
    b1 = 2*a1*Cosine(1.414*180 / (.5*Length));
    c2 = b1;  c3 = -a1*a1;  c1 = 1 - c2 - c3;
    Filt = c1*(Close + Close[1]) / 2 + c2*Filt[1] + c3*Filt[2];
    Slope = (Filt[Length] - Filt) / Length;
    Sum = 0;  For count = 1 to Length Begin Sum = Sum + (Filt + count*Slope) - Filt[count]; End;
    Sum = Sum / Length;
    MS = .04*Sum*Sum + .96*MS[1];
    If MS <> 0 Then Reflex = Sum / SquareRoot(MS);
(a) Default Length 20 ("assumed cycle period"). The smoothing length is "half the period of the assumed cycle period": `.5*Length` is REAL (R-2).
    Cosine takes degrees: 1.414*180/(.5*Length) deg = sqrt(2)*pi/(.5*Length) rad. D1 rule 1: 1.414 -> sqrt(2), 3.14159 -> pi. D1 rule 2: .5, .04, .96 literal.
(a) No start-up rule is printed (R-4). Article claim: "exactly in phase with the data and has zero lag" (cycle-plus-trend model). MS is an EMA of Sum^2, so
    Reflex "is scaled in terms of standard deviations".
"""
reference = "analysis/harness/reference.py reflex_article(L) (exact constants, price seed for Filt history, MS starts 0); reflex_sum_filter(L) for the analytic Sum tables"
other_forms = "(a) Not tested here: Trendflex (same article, horizontal line instead of the slope line; not in the library)."

[[literal_replacements]]
literal = "1.414"
exact = 1.4142135623730951
name = "sqrt(2)"
rule = "D1 rule 1"
source = "(a) a1 and b1 lines. 1.414 = sqrt(2) to its printed digits (D1 rule 1, decided: replace). 180 in the degrees form is exact pi rad."

[[literal_replacements]]
literal = "3.14159"
exact = 3.141592653589793
name = "pi"
rule = "D1 rule 1"
source = "(a) a1 and b1 lines. 3.14159 = pi to its printed digits (D1 rule 1, decided: replace). 180 in the degrees form is exact pi rad."

# Pre-registered lines of the corrected indicators/ehlers/Reflex.c (R-1, R-2, R-3, R-5). The .c is written to these lines AFTER this file is
# committed (stage 2); a test then asserts it contains them verbatim (whitespace-normalised, comments stripped).
# reference.reflex_code(L) with simulate_reflex implements exactly these lines.
[corrected_code]
file = "indicators/ehlers/Reflex.c"
function = "var ReflexCore(vars Price, int Length, var* pSum, var* pMS)"
lines = """
var rx_half = Length;
rx_half = rx_half/2;
var rx_k = sqrt(2.0);
var rx_a1 = exp(-rx_k*PI/rx_half);
var rx_b1 = 2.0*rx_a1*cos(rx_k*PI/rx_half);
var rx_c2 = rx_b1;
var rx_c3 = -rx_a1*rx_a1;
var rx_c1 = 1.0 - rx_c2 - rx_c3;
var rx_w1 = 4;
rx_w1 = rx_w1/100;
var rx_w2 = 96;
rx_w2 = rx_w2/100;
vars rx_Filt = series(Price[0], Length + 2);
vars rx_MS = series(0, 2);
rx_Filt[0] = rx_c1*(Price[0] + Price[1])/2.0 + rx_c2*rx_Filt[1] + rx_c3*rx_Filt[2];
var rx_Slope = (rx_Filt[Length] - rx_Filt[0])/Length;
var rx_Sum = 0;
int rx_i;
for(rx_i = 1; rx_i <= Length; rx_i++)
    rx_Sum += (rx_Filt[0] + rx_i*rx_Slope) - rx_Filt[rx_i];
rx_Sum = rx_Sum/Length;
rx_MS[0] = rx_w1*rx_Sum*rx_Sum + rx_w2*rx_MS[1];
var rx_R = 0;
if(rx_MS[0] > 0)
    rx_R = rx_Sum/sqrt(rx_MS[0]);
*pSum = rx_Sum;
*pMS = rx_MS[0];
return rx_R;"""
wrapper_function = "var Reflex(vars Price, int Length)"
wrapper_lines = """
var rx_s;
var rx_m;
return ReflexCore(Price, Length, &rx_s, &rx_m);"""
notes = """(b) Changed vs the current .c (git blob 7c6b235c00f053faef6f70dff71d9e09b99c440d at fd3d8eb): R-1 the file-static `rx_MS` shared by every call -> a per-instance series `rx_MS = series(0, 2)`; R-2 the SuperSmoother is computed inside the file with a REAL half length (the int `Length / 2` and the call of SuperSmoother2Pole(int) are gone); R-3 the MS weights are built from integers (4/100, 96/100, no float32 literals, gotchas 9d.1); R-5 header with source, formula, deviations and the review path (written with the .c). `Reflex(Price, Length)` is a thin wrapper, so callers do not change.
(c) Both series() calls are unconditional and precede any use (gotchas 3.1); no expression starts with two literals (gotchas 9d.8). (c) `&Y[k]` as an out-parameter and `*pSum = ...` are expected to compile in Light-C but have NOT been compiled in this stage (no Zorro here): if any line cannot compile, stage 2 stops and reports.
Superseded file (stage 2): the CURRENT Reflex.c body verbatim as indicators/ehlers/Reflex_Superseded.c, function `Reflex_Superseded`, locals / static renamed `rx_` -> `rxo_` (flat namespace, gotchas 1.3). It is the shared-state control NCS / NCT.
Pre-run (ii): the blob hash of the current Reflex.c is recorded above (7c6b235c00f053faef6f70dff71d9e09b99c440d)."""

[zorro]
include = ["../../indicators/ehlers/SuperSmoother2Pole.c", "../../indicators/ehlers/Reflex_Superseded.c", "../../indicators/ehlers/Reflex.c"]   # dependency order (gotchas 5.3), resolved from strategies/tests/; Reflex_Superseded.c and the corrected Reflex.c are written in stage 2 (lint reports them missing until then)
raw_file = "Data/GEN_RFX_raw.csv"
marker_file = "Data/GEN_RFX_exit_marker.txt"       # gotchas 9d.4: never fires; NOT a check on the run card
clock_asset = "EUR/USD"
bar_period = 1440
start_date = 20080101
end_date = 20240101
series_len = 3

[inputs]                    # as SS2F / RFF / USE, incl. the alternating input; warmup 700 (D6 rule 2, finding 8)
n_bars = 3000
warmup = 700              # (b) MS memory 0.96^n < 1e-12 after 676.87 bars (finding 8): W = 700
level = [11, 10]            # 1.1, built at run time from integers (gotchas 9d.1)
amp = [1, 100]              # 0.01
slope = [1, 10000]          # 0.0001
sine_periods = [5, 10, 20, 40, 100]
alternating = true          # extra input id `alt`: level + amp*(-1)^n, after the sines and before ramp

[inputs.invariance]         # D6 rule 4: transformed copies of every sine, fed to every variant with invariance = true
transforms = [{ id = "sc", level = [11, 10], amp = [1, 10] }, { id = "of", level = [22, 10], amp = [1, 100] }]   # scale x10 (amp 0.1, level 1.1) and offset (level 2.2, amp 0.01); ids sc<T> / of<T>

[clock]
lo = 0.8
hi = 1.7
source = "(b) h1_check.py CLOCK_LO/CLOCK_HI: EUR/USD D1 closes lie inside; magnitude guard against a wrong asset"

[checks]                    # HARNESS_DESIGN D4 + D6
dc_gain = 0.0
phase_gate = 0.05
linear_output = "sum"        # the v1 checks (flat, gains, phases, alt, ramp residual) read this output (D6 rule 1)
trace_gate = 0.01            # g: rows with sqrt(MS)/amplitude < g are excluded from trace / invariance (D6 rule 2)
bound = 5.0                  # |Reflex| <= 5 exactly: MS >= 0.04 Sum^2 (D6 rule 3)
source = """(b) Sum has DC gain 0 and a double zero at DC (finding 1): D4 rules 2 and 4 (flat expected 0, ramp residual expected 0), no ramp-lag check. phase_gate (c): judgement, as HPF / RFF / USE; (b) the smallest expected Sum gain in the four tables is 0.06291300715458449 (L14, T = 100) >= 0.05, so all 20 sine phases are checked; the expected alt gain is <= 1.3e-17 (H_SS has a zero at Nyquist): the alt phase is SKIP for every variant. trace_gate g = 0.01 (c): judgement; (b) the smallest sqrt(MS)/amplitude over the sine rows >= W is 0.036981783618884045 (L14), 3.7x the gate (finding 7): no gated row on a correct variant, a gated row is counted and reported. bound 5 (b): MS >= 0.04 Sum^2 gives |Reflex| <= 5 exactly; attained (finding 6)."""

[tolerances.flat]
value = 1e-09
source = "(a) H1 criteria section 5 (unchanged). Applies to Sum: expected |Sum| = 0 on flat (DC gain 0, D4 rule 2). (b) floor 0."
[tolerances.gain]
value = 3e-05
source = "(c) HPF / SS2F / RFF / USE default (D4 rule 5). (b) window: floor x10 <= 3e-5, see [floor].gain. Applies to the five Sum sine gains and the alt gain."
[tolerances.phase]
value = 3e-05
source = "(c) HPF / RFF / USE default (D4 rule 5), radians. (b) window: floor x10 <= 3e-5, see [floor].phase. Applies to the five Sum sine phases; the alt phase is gated out."
[tolerances.resid]
value = 1e-09
source = "(c) HPF / RFF default (D4 rule 5). Applies to Sum on the ramp: expected 0 (double zero at DC, finding 1). (b) floor ~1e-16."
[tolerances.trace]
value = 3e-05
source = "(c) NEW quantity (D6 rule 2), default proposed in this spec and recorded in HARNESS_DESIGN under D2 rule 1 when the spec is committed: max |Zorro r - model r| over the gated rows >= W, per sine. (b) window: floor x10 = 1.57e-5 <= 3e-5, see [floor].trace; ceiling: every control has a kind >= 10x (see [detect])."
[tolerances.bound]
value = 1e-12
source = "(c) NEW quantity (D6 rule 3), RELATIVE allowance: PASS if max |r| <= bound*(1 + 1e-12). (b) a few-ulp allowance: |Reflex| = 5.000000 is attained on the first non-zero Sum row (finding 6), where MS = 0.04 Sum^2 and sqrt rounds. The check needs no model."
[tolerances.invariance]
value = 1e-09
source = "(c) NEW quantity (D6 rule 4): max |r(input) - r(transformed input)| over the gated rows >= W, five sines, transforms sc (amp x10) and of (level 2.2). (b) floor ~1.2e-12 (finding 11): window ok. Zorro-internal comparison, no model."
[tolerances.x]
value = 1e-12
source = "(a) STEP2_HANDOFF Stage 3 G4 (= h1_check.TOL_X, exported input vs recomputed x[n]). Covers the alt input and the invariance copies."
[tolerances.imp]
value = 1e-09
source = "(c) As HPF / SS3F / RFF / USE. Applies to sum and ms (all base inputs, absolute) and to r on the gated sine rows. (b) Fire tests: see [imp.fire_test]."

