[[variants]]
id = "NCA"
role = "neg_control"
label = "NC-A: SS pole factor a1 +1 in 3rd digit vs P48S10 article"
kind = "inline"
function = "rff_nca"
params = [48, 10]
expected = "P48S10"
seed = "zero"
comment = """NC-A: realistic copying error in the SuperSmoother pole factor (D2 rule 4). [corrected_code] pipeline, SuperSmoother inline, except a1 + 1/1000 (= bump3 at SS = 10: 0.6412807 -> 0.6422807 with Zorro PI, 0.6412805 -> 0.6422805 with exact pi) BEFORE b1, c3 and c0 are derived, so the DC gain stays 1. HighPassFilter is called (verified)."""
body = '''
var rff_nca(vars Price, int HPP, int SSP)
{
	var* nca_hp = series(HighPassFilter(Price, HPP), 3);
	var nca_a1 = exp(-sqrt(2.0) * PI / SSP);
	nca_a1 = nca_a1 + 1.0 / 1000;
	var nca_b1 = 2.0 * nca_a1 * cos(sqrt(2.0) * PI / SSP);
	var nca_c3 = -nca_a1 * nca_a1;
	var nca_c0 = (1.0 - nca_b1 + nca_a1 * nca_a1) / 2.0;
	var* nca_f = series(nca_hp[0], 3);
	nca_f[0] = nca_c0 * (nca_hp[0] + nca_hp[1])
	        + nca_b1 * nca_f[1]
	        + nca_c3 * nca_f[2];
	return nca_f[0];
}'''
