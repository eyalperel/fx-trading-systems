[[variants]]
id = "NCO"
role = "neg_control"
label = "NC-O: old HighPassFilter feeding SuperSmoother2Pole vs P48S10 article"
kind = "inline"
function = "rff_nco"
params = [48, 10]
expected = "P48S10"
seed = "price"
lint_allow_float32 = ["0.707"]
lint_allow_reason = "NCO reproduces the old HighPassFilter.c verbatim; float32 0.707 is the old deviation itself (gotchas 9d.1). Exempt in this body only."
comment = """NCO: the old pipeline. The OLD HighPassFilter body (= HPF spec variant NCH: literal 0.707, history seeded at the price level, series(Price[0], 3)) feeding SuperSmoother2Pole as the current RoofingFilter.c does. Locals renamed only. Gain / phase effects are small (T = 20 gain 2.1e-5 < tolerance); caught by start-up (the seed) and by IMP must_fail (corrected model)."""
body = '''
var rff_nco(vars Price, int HPP, int SSP)
{
	var nco_alpha1 = (cos(0.707*2.0*PI / HPP) + sin(0.707*2.0*PI / HPP) - 1.0)
	       / cos(0.707*2.0*PI / HPP);
	var* nco_hraw = series(Price[0], 3);
	nco_hraw[0] = (1.0 - nco_alpha1/2.0) * (1.0 - nco_alpha1/2.0)
	        * (Price[0] - 2.0*Price[1] + Price[2])
	        + 2.0*(1.0 - nco_alpha1) * nco_hraw[1]
	        - (1.0 - nco_alpha1) * (1.0 - nco_alpha1) * nco_hraw[2];
	var* nco_hp = series(nco_hraw[0], 3);
	var nco_out = SuperSmoother2Pole(nco_hp, SSP);
	return nco_out;
}'''
