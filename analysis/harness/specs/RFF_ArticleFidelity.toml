# RFF_ArticleFidelity.toml -- RoofingFilter (HP-A followed by the 2-pole SuperSmoother), SOURCE FIDELITY + IMPLEMENTATION
# (HARNESS_DESIGN §1, both questions).
# Pre-registration: this file, committed BEFORE the corrected RoofingFilter.c is written and BEFORE the generated script is
# run (PROJECT_STATE §2 rule 2). Amendments are dated and appended at the end of the file, never edited in place.
# DRAFT of RFF stage 1 (planning chat 2026-11-17, decisions 1A / 2A / 3 accepted by the user): built on tooling that adds
# `params = [..]`, `[zorro].include` as a list and `[inputs].alternating` (generator / checker / reference, this branch).
# Format: as specs/HP_ArticleFidelity.toml. Labels: (a) source states, (b) measured / computed here, (c) inference.
# Ids must not contain '-' (check ids are <prefix>-<variantid>-<check>).
#
# What differs from HPF:
#   * Two integer parameters per call (HPPeriod, SSPeriod). The article fixes (48, 10); the library's HPPeriod / SSPeriod
#     parameters are a generalisation (the HP lines with HPPeriod are in V.33:09); (30,10), (125,10), (48,20) probe it.
#   * An alternating (Nyquist) input, x[n] = level + amp*(-1)^n: a period-2 "sine" cannot be built (sin(pi*n) = 0), and the
#     article filter has a gain zero there (HP-A passes it, the SuperSmoother's (1 + z^-1) numerator nulls it). The alt
#     phase is checked only where the expected gain reaches [checks].phase_gate; here it never does, so the alt phase row
#     is written as SKIP (never PASS) for every variant: the gate binds for the first time.
#   * Start-up is checked on flat, ramp AND the s20 sine, against the source's zero seeds.
#   * No NCH-style control: the corrected file is numerically identical to the current one (two renames only). NCO is the
#     "what changed" control: the OLD HighPassFilter feeding SuperSmoother2Pole, as the current RoofingFilter.c does.
#
# Decisions recorded here:
#   1A tooling: two integer parameters (`params`), include list.   2A tooling: alternating input, gated alt phase, SKIP row.
#   3  corrected code: the three lines in [corrected_code] (the .c is written AFTER this file is committed).
#   4  Seed-declaring variants are replayed by IMP over n >= 0 (as HPF decision 4).

[batch]
name = "RFF_ArticleFidelity"
id_prefix = "RFF"
indicator = "RoofingFilter"                # Light-C function called by `params` variants (corrected file)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/RFF_ArticleFidelity.toml (this file)"
script_name = "GEN_RFF_RoofingFilter"      # generated Light-C file; the generator never overwrites

[source]
article = "Ehlers, J. F., 'Predictive And Successful Indicators', Technical Analysis of Stocks & Commodities V.32:1 (Jan 2014), pp. 16-25, sidebar 'EasyLanguage Code To Compute The Roofing Filter'"
formula = """
(a) alpha1 = (Cosine(.707*360 / 48) + Sine (.707*360 / 48) - 1) / Cosine(.707*360 / 48);
    HP = (1 - alpha1 / 2)*(1 - alpha1 / 2)*(Close - 2*Close[1] + Close[2]) + 2*(1 - alpha1)*HP[1] - (1 - alpha1)*(1 - alpha1)*HP[2];
    a1 = expvalue(-1.414*3.14159 / 10);
    b1 = 2*a1*Cosine(1.414*180 / 10);
    c2 = b1;  c3 = -a1*a1;  c1 = 1 - c2 - c3;
    Filt = c1*(HP + HP[1]) / 2 + c2*Filt[1] + c3*Filt[2];
    Vars: ... HP(0) ... Filt(0) ...             (EasyLanguage: both histories start at 0)
    Cosine/Sine take degrees: .707*360/P deg = .707*2*pi/P rad; 1.414*180/P deg = sqrt(2)*pi/P rad.
(a) The article fixes 48 and 10. HPPeriod / SSPeriod as parameters is the library's generalisation (HP: V.33:09).
"""
reference = "analysis/harness/reference.py roof_article(hp, ss) = cascade(hp_article(hp), ss2_article(ss)); seed zero"
other_forms = "(a) Not tested here: the 1-pole HP (V.34:09) and the $HighPass / $SuperSmoother forms of V.42:04."

[[literal_replacements]]
literal = ".707"
exact = 0.7071067811865476
name = "1/sqrt(2)"
rule = "D1 rule 1"
source = "(a) alpha1 line. .707 equals 1/sqrt(2) to every printed digit (D1 rule 1 example). 360 in the degrees form is exact 2*pi rad, not a replacement."

[[literal_replacements]]
literal = "1.414"
exact = 1.4142135623730951
name = "sqrt(2)"
rule = "D1 rule 1"
source = "(a) a1 and b1 lines (SuperSmoother). 1.414 = sqrt(2) to 4 significant digits (D1 decided: replace, TASC V.42:04 as quoted in D1). 180 in the degrees form is exact pi rad."

[[literal_replacements]]
literal = "3.14159"
exact = 3.141592653589793
name = "pi"
rule = "D1 rule 1"
source = "(a) a1 line. 3.14159 = pi to its printed digits (D1 rule 1)."

# Pre-registered lines of the corrected indicators/ehlers/RoofingFilter.c (decision 3). The .c is written to these lines
# after this file is committed; a test asserts the .c contains them verbatim (whitespace-normalised, comments stripped).
# reference.roof_code(hp, ss) is the cascade of hp_code (k = sqrt(2)/2) and ss2_code; with simulate(seed='zero') it
# implements exactly these lines (test: simulate_cascade of the two stages equals it to <= 1e-14).
[corrected_code]
file = "indicators/ehlers/RoofingFilter.c"
function = "var RoofingFilter(vars Price, int HPPeriod, int SSPeriod)"
lines = """
var* rf_hp = series(HighPassFilter(Price, HPPeriod), 3);
var rf_out = SuperSmoother2Pole(rf_hp, SSPeriod);
return rf_out;"""
notes = """(b) Changed vs the current .c (blob bb717f103fc1521c2ffc6046dfbaa0011a84ca3f at 9b117fc): the two locals are renamed
(hp -> rf_hp, roofed -> rf_out, flat-namespace prefix, CLAUDE.md section 6); every other token is unchanged, so the compiled
function is numerically identical to the current one (no NCH-style control). The numerical change comes from the corrected
HighPassFilter.c it calls (literal 0.707 -> sqrt(2)/2, seed 0; HPF run 2 PASS, 512781c): NCO is the control for it.
Header to write with the .c: source V.32:1 sidebar (GAP-1.31 fix); remove 'Validated', 'only dominant cycle survives' and
'HPPeriod must be >> SSPeriod' (unsourced); add a verification line pointing at this spec.
(b) Seeding: with the corrected HP the first HP output is 0 (input history = x[0] by series seeding, gotchas 9d.6; HP history 0),
so SuperSmoother2Pole's series(Price[0], 3) seeds Filt at hp[0] = 0 = the source's Filt(0)."""

[zorro]
include = ["../../indicators/ehlers/HighPassFilter.c", "../../indicators/ehlers/SuperSmoother2Pole.c", "../../indicators/ehlers/RoofingFilter.c"]   # dependency order (gotchas 5.3), resolved from strategies/tests/
raw_file = "Data/GEN_RFF_raw.csv"
marker_file = "Data/GEN_RFF_exit_marker.txt"       # gotchas 9d.4: never fires; NOT a check on the run card
clock_asset = "EUR/USD"
bar_period = 1440
start_date = 20080101
end_date = 20240101
series_len = 3

[inputs]                    # as SS2F / SS3F / HPF, plus the alternating input
n_bars = 3000
warmup = 500
level = [11, 10]            # 1.1, built at run time from integers (gotchas 9d.1)
amp = [1, 100]              # 0.01
slope = [1, 10000]          # 0.0001
sine_periods = [5, 10, 20, 40, 100]
alternating = true          # extra input id `alt`: level + amp*(-1)^n, after the sines and before ramp

[clock]
lo = 0.8
hi = 1.7
source = "(b) h1_check.py CLOCK_LO/CLOCK_HI: EUR/USD D1 closes lie inside; magnitude guard against a wrong asset"

[checks]                    # HARNESS_DESIGN D4
dc_gain = 0.0
phase_gate = 0.05
startup_inputs = ["flat", "ramp", "s20"]
source = """(a)/(b) DC gain 0: the HP numerator x - 2x[1] + x[2] sums to 0, the SuperSmoother has DC gain 1. phase_gate (c): judgement,
as HPF. (b) Smallest expected sine gain in the four tables is 0.0574 (P48S20, T = 5) >= 0.05, so all 20 sine phases are checked.
The expected alt gain is ~6e-18 (a numerical zero) in every table: the alt phase is SKIP in all of them (the gate binds)."""

[tolerances.flat]
value = 1e-9
source = "(a) H1 criteria section 5 (unchanged). Expected output 0 (D4 rule 2). (b) floor 0."
[tolerances.gain]
value = 3e-5
source = "(c) HPF / SS2F / SS3F default (D4 rule 5). (b) window: floor x10 <= 3e-5, see [floor].gain. Applies to the five sine gains and the alt gain."
[tolerances.phase]
