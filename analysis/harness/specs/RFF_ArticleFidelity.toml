[[variants]]
id = "NC2"
role = "neg_control"
label = "NC2: SS cos arg in degrees vs P48S10 article"
kind = "inline"
function = "rff_nc2"
params = [48, 10]
expected = "P48S10"
seed = "zero"
comment = """NC2: gross units bug (gotchas section 2, mixed-file mode). SuperSmoother cosine argument in degrees (sqrt(2)*180/SSP) with the exponent unchanged. Stable at SS = 10 (pole radius a1 = 0.64)."""
body = '''
var rff_nc2(vars Price, int HPP, int SSP)
{
	var* nc2_hp = series(HighPassFilter(Price, HPP), 3);
	var nc2_a1 = exp(-sqrt(2.0) * PI / SSP);
	var nc2_b1 = 2.0 * nc2_a1 * cos(sqrt(2.0) * 180.0 / SSP);
	var nc2_c3 = -nc2_a1 * nc2_a1;
	var nc2_c0 = (1.0 - nc2_b1 + nc2_a1 * nc2_a1) / 2.0;
	var* nc2_f = series(nc2_hp[0], 3);
	nc2_f[0] = nc2_c0 * (nc2_hp[0] + nc2_hp[1])
	        + nc2_b1 * nc2_f[1]
	        + nc2_c3 * nc2_f[2];
	return nc2_f[0];
}'''
