phase_gate = 0.05
startup_inputs = ["flat", "ramp"]
source = """(a)/(b) DC gain 0: numerator x - 2x[1] + x[2] sums to 0. phase_gate (c): judgement; smallest reference gain in
the tables is 0.0736 (P20, T = 100), so all 20 phases are checked; the gate exists for RoofingFilter (gain 0 at T = 2)."""

[tolerances.flat]
value = 1e-9
source = "(a) H1 criteria section 5 (unchanged). Expected output 0 (D4 rule 2). (b) floor 0."
[tolerances.gain]
value = 3e-5
source = "(b)+(c) Decision 2. Floor 4.036e-07 x10 = 4.036e-06 <= 3e-5. NCA 5.095e-04 = 17x, NCB 36x. Same value as SS2F / SS3F."
[tolerances.phase]
value = 3e-5
source = "(b)+(c) Decision 2; first phase tolerance (D4 rule 5: becomes the library default, recorded in HARNESS_DESIGN). Radians. Floor 8.085e-07 x10 = 8.085e-06 <= 3e-5. NCA 1.097e-03 = 37x. Phase error 3e-5 rad = 3e-5*T/(2*pi) bars: 2.4e-5 at T = 5, 4.8e-4 at T = 100."
[tolerances.resid]
value = 1e-9
source = "(c) Judgement, as [tolerances.imp]. (b) floor 2.752e-16 (round-off; expected residual 0, double zero at DC). Only NCZ moves it (1.166e-02)."
[tolerances.startup]
value = 1e-6
source = "(c) Judgement. (b) floor 1.229e-09 x10 = 1.229e-08 <= 1e-6. NCS / NCH 1.091e+00 (~1e6x); NCF 29x, NC1 12x, NC2 91x."
[tolerances.lag]
value = 1e-3
source = "(a) H1 default; UNUSED here (dc_gain 0, D4 rule 1). Present for the schema."
[tolerances.x]
value = 1e-12
source = "(a) STEP2_HANDOFF Stage 3 G4 (= h1_check.TOL_X, exported input vs recomputed x[n])"
[tolerances.imp]
value = 1e-9
source = "(c) As SS3F. (b) Fire tests: P48 replayed with the float32 0.707 model 1.188e-06 = 1188x tol (D-1); NCH replayed with the corrected model 9.056e-05. Own-model replays 0 in the standalone model."

