raw_file = "Data/GEN_HPF_raw.csv"
marker_file = "Data/GEN_HPF_exit_marker.txt"       # gotchas 9d.4: never fires; NOT a check on the run card
clock_asset = "EUR/USD"
bar_period = 1440
start_date = 20080101
end_date = 20240101
