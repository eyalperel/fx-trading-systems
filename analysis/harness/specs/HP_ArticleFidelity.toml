# HP_ArticleFidelity.toml -- HighPassFilter (2-pole, HP-A), SOURCE FIDELITY + IMPLEMENTATION (HARNESS_DESIGN §1, both questions).
# Pre-registration: this file, committed BEFORE the corrected .c is written and BEFORE the generated script is run
# (PROJECT_STATE §2 rule 2). Amendments are dated and appended at the end of the file, never edited in place.
# Format: as specs/SS3_ArticleFidelity.toml, plus the D4 fields ([checks], phases, resid, seed; HARNESS_DESIGN D4, 032d766;
# tooling 14395a0). Labels: (a) source states, (b) measured / computed here, (c) inference.
# Ids must not contain '-' (check ids are <prefix>-<variantid>-<check>).
#
# What differs from SS3F:
#   * DC gain 0: no ramp-lag check (D4 rule 1). Flat expects 0 (rule 2); sine PHASE checked (rule 3, radians, gated);
#     ramp RESIDUAL (rule 4); START-UP check over 0 <= n < warmup against the source's zero seed.
#   * Ehlers published three different high-pass filters (HARNESS_DESIGN D4 sourcing note). HighPassFilter.c implements
#     HP-A (b, read 2026-11-16) with two deviations from the source, corrected by this spec ([corrected_code]):
#       D-1  literal 0.707 (float32 in Zorro, gotchas 9d.1) where D1 rule 1 gives 1/sqrt(2);
#       D-2  HP history seeded at the price level, series(Price[0], 3), where the source starts at 0 (GAP-1.26).
#   * The current .c is negative control NCH; each deviation alone is a control (D-2: NCS; D-1: IMP must_fail on P48).
#
# Decisions recorded here (planning chat 2026-11-16/17, user accepted each):
#   0. Order C (PROJECT_STATE §1.2 slot path: MESAStochastic -> RoofingFilter -> HighPassFilter); source HP-A.
#   1. Option A for the .c: pre-register both corrections; current .c = NCH.
#   2. Option B for tolerances: gain 3e-5, phase 3e-5 rad (SS2/SS3 scale); D-1 (NCK) is verified by the IMP replay,
#      not by a gain/phase tolerance (its gain/phase windows are ~1.6x wide, see [observations].O_LIT).
#   3. NC2 (degrees) at P = 20: at P = 48 the degrees form is unstable (pole radius 3.29, overflow; tooling report).
#   4. Seed-declaring variants are replayed by IMP over n >= 0 (tooling 14395a0; n >= warmup cannot see a seed).

[batch]
name = "HP_ArticleFidelity"
id_prefix = "HPF"
indicator = "HighPassFilter"               # Light-C function called by `param` variants (corrected file)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/HP_ArticleFidelity.toml (this file)"
script_name = "GEN_HPF_HighPassFilter"     # generated Light-C file; the generator never overwrites

[source]
article = "Ehlers, J. F., 'Predictive And Successful Indicators', Technical Analysis of Stocks & Commodities V.32:1 (Jan 2014), pp. 16-25, sidebar 'EasyLanguage Code To Compute The Roofing Filter' (HP lines); same HP lines in 'Decyclers', V.33:09 (2015) with HPPeriod, and 'Recursive Median Filters', V.36:03 (2018)"
formula = """
(a) alpha1 = (Cosine(.707*360 / 48) + Sine (.707*360 / 48) - 1) / Cosine(.707*360 / 48);
    HP = (1 - alpha1 / 2)*(1 - alpha1 / 2)*(Close - 2*Close[1] + Close[2])
         + 2*(1 - alpha1)*HP[1] - (1 - alpha1)*(1 - alpha1)*HP[2];
    Vars: ... HP(0) ...                         (EasyLanguage: HP history starts at 0)
    Cosine/Sine take degrees -> .707*2*pi/P radians. Decyclers uses HPPeriod in place of 48.
(a) V.32:1 text (paraphrase): the second-order high-pass gives a nominal zero mean and removes much of the lag
    from leaking longer cycles; combined with the SuperSmoother it forms the roofing filter.
"""
reference = "analysis/harness/reference.py hp_article(period): the formula above with the D1 replacement below; seed zero"
other_forms = "(a) Not this filter: 1-pole HP, V.34:09 (2016) 'Measuring Market Cycles'; Butterworth-type 2-pole $HighPass, V.42:04 (2024) 'The Ultimate Smoother'. Neither is tested here."

[[literal_replacements]]
literal = ".707"
exact = 0.7071067811865476
name = "1/sqrt(2)"
rule = "D1 rule 1"
source = "(a) alpha1 line, all three listings. .707 equals 1/sqrt(2) to every printed digit (D1 rule 1 example). 360 in the degrees form is exact 2*pi rad, not a replacement."

# D1 rule 3: literal-vs-exact difference, INFORMATION ONLY, never PASS/FAIL.
[literal_info]
gain_max = 7.591453912e-05
phase_max = 0.0001520951803
source = "(b) 2026-11-17: hp_code(P) (float32 0.707, Zorro PI) vs hp_article(P), analytic, P = 20, 30, 48, 125, sine periods 5..100. Measured at P = 48 with the checker's own fit: gain 6.564e-05, phase 1.413e-04 rad (= 2.2x / 4.7x tolerance: not a fidelity-check control; IMP covers it, decision 2)."

# Pre-registered lines of the corrected indicators/ehlers/HighPassFilter.c (decision 1). The .c is written to these
# lines after this file is committed; a test asserts the .c contains them verbatim (whitespace-normalised, comments
# stripped). reference.hp_code(P, k=sqrt(2)/2) with simulate(seed='zero') implements exactly these lines.
[corrected_code]
file = "indicators/ehlers/HighPassFilter.c"
function = "var HighPassFilter(vars Price, int HPPeriod)"
lines = """
var hp_k = sqrt(2.0) / 2.0;
var alpha1 = (cos(hp_k*2.0*PI / HPPeriod) + sin(hp_k*2.0*PI / HPPeriod) - 1.0)
       / cos(hp_k*2.0*PI / HPPeriod);
var* HP = series(0, 3);
HP[0] = (1.0 - alpha1/2.0) * (1.0 - alpha1/2.0)
        * (Price[0] - 2.0*Price[1] + Price[2])
        + 2.0*(1.0 - alpha1) * HP[1]
        - (1.0 - alpha1) * (1.0 - alpha1) * HP[2];
return HP[0];"""
notes = """(b) Changed vs the current .c (blob at 14395a0, recorded in Amendment 1): D-1 0.707 -> hp_k = sqrt(2.0)/2.0 (2.0 is
exact in float32; sqrt in double), D-2 series(Price[0], 3) -> series(0, 3). Every other token unchanged. PI kept (D3).
(c) Downstream: RoofingFilter, MESAStochastic, Decycler and RecursiveMedian (RMO) outputs change -- start-up fully
(~200 bars at P = 48), steady state by ~7e-5 relative (D-1). They are re-verified by their own specs; data/ CSVs are
already stale (GAP-1.35). Header comments to correct with the fix: line 32 ('Initialize at Price[0] level'), line 20
('Validated'), line 13 (0.707 note). No superseded copy is kept: the current file is preserved in git and as NCH."""

[zorro]
