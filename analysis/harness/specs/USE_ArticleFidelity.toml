{
	var nca_k = sqrt(2.0);
	var nca_e = 1;
	nca_e = nca_e / 1000;
	var nca_a1 = exp(-nca_k * PI / USP);
	nca_a1 = nca_a1 + nca_e;
	var nca_b1 = 2.0 * nca_a1 * cos(nca_k * PI / USP);
	var nca_c2 = nca_b1;
	var nca_c3 = -nca_a1 * nca_a1;
	var nca_c1 = (1.0 + nca_c2 - nca_c3) / 4.0;
