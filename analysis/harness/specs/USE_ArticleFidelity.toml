[[variants]]
id = "NCL"
role = "info"
label = "NCL: article as printed (1.414, 3.14159) vs P20 article"
kind = "inline"
function = "use_ncl"
params = [20]
expected = "P20"
seed = "pass3"
comment = """INFO variant (not a control, not in [detect]; D1 rule 3): the article as PRINTED, 1.414 and 3.14159 built from integers at run time (1414/1000, 314159/100000, gotchas 9d.1 / 9d.8) in the exponent; the cosine's 180 degrees is the PI macro (Zorro float32 PI, as in the other variants). Everything else as [corrected_code]. P = 20. Reported, never PASS/FAIL."""
body = '''
var use_ncl(vars Price, int USP)
{
	var ncl_f = 1414;
	ncl_f = ncl_f / 1000;
	var ncl_g = 314159;
	ncl_g = ncl_g / 100000;
	var ncl_a1 = exp(-ncl_f * ncl_g / USP);
	var ncl_b1 = 2.0 * ncl_a1 * cos(ncl_f * PI / USP);
	var ncl_c2 = ncl_b1;
	var ncl_c3 = -ncl_a1 * ncl_a1;
	var ncl_c1 = (1.0 + ncl_c2 - ncl_c3) / 4.0;
	vars ncl_n = series(0, 2);
	ncl_n[0] = ncl_n[1] + 1;
	vars ncl_US = series(Price[0], 3);
	if(ncl_n[0] < 4) {
		ncl_US[0] = Price[0];
		return ncl_US[0];
	}
	ncl_US[0] = (1.0 - ncl_c1) * Price[0] + (2.0 * ncl_c1 - ncl_c2) * Price[1]
	          - (ncl_c1 + ncl_c3) * Price[2] + ncl_c2 * ncl_US[1] + ncl_c3 * ncl_US[2];
	return ncl_US[0];
}'''
