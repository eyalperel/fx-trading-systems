# USE_ArticleFidelity.toml -- UltimateSmootherE (Ehlers V.42:04 UltimateSmoother), SOURCE FIDELITY + IMPLEMENTATION
# (HARNESS_DESIGN §1, both questions).
# Pre-registration: this file, committed BEFORE the corrected UltimateSmootherE.c is written and BEFORE the generated script is
# run (CLAUDE.md §4.2). Amendments are dated and appended at the end of the file, never edited in place.
# DRAFT of USE stage 1 (planning chat 2026-11-17, decisions D-1 and D-2 accepted by the user; brief docs/harness/USE_STAGE1_PROMPT.md),
# built on tooling that adds the seed mode `pass<n>`, `[checks].startup_seed`, the complement model `one_minus`, the article model
# `us_article(P)` and the variant role `info` (generator / checker / reference, this branch).
# Format: as specs/RFF_ArticleFidelity.toml. Labels: (a) source states, (b) measured / computed here, (c) inference.
# Ids must not contain '-' (check ids are <prefix>-<variantid>-<check>).
#
# What differs from RFF:
#   * One integer parameter per call (Period); real variants P10 / P14 / P20 (the article's example) / P30.
#   * DC gain 1 (D4 rule 1): the ramp-lag check applies, expected 0 (structural). No resid check.
#   * Start-up rule of the source: the first 3 outputs equal Price (EasyLanguage CurrentBar < 4). Reference seed `pass3`
#     ([checks].startup_seed). Start-up is checked on flat, ramp AND s20: (b) a 3-bar and a 4-bar seed are IDENTICAL on flat and
#     ramp and differ by up to 8.337e-4 on s20, so s20 is the only input that sees the D-2 off-by-one.
#   * The alt phase row is SKIP in every variant: the numerator has a zero at z = -1, so the expected alt gain is ~1e-16 (< phase_gate).
#   * NCL (role info) is the article AS PRINTED (1.414, 3.14159): run and reported, never PASS/FAIL (D1 rule 3).
#
# Decisions recorded here:
#   D-1  corrected code: `1.414 * PI` (folded literal product, gotchas 9d.8; D1 rule 1) -> `us_k * PI` with us_k = sqrt(2.0).
#   D-2  corrected code: global `Bar < 4` (base unconfirmed; the comment says 4 bars, the source 3) -> a per-instance counter us_n,
#        EasyLanguage CurrentBar (1 on this instance's first call).
#   4    Every variant declares a seed and is replayed by IMP over n >= 0.

[batch]
name = "USE_ArticleFidelity"
id_prefix = "USE"
indicator = "UltimateSmootherE"            # Light-C function called by `params` variants (corrected file)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/USE_ArticleFidelity.toml (this file)"
script_name = "GEN_USE_UltimateSmootherE"   # generated Light-C file; the generator never overwrites

[source]
article = "Ehlers, J. F., 'The Ultimate Smoother', Technical Analysis of Stocks & Commodities V.42:04 (2024), pp. 8-15, sidebar 'UltimateSmoother Function, In EasyLanguage'"
formula = """
(a) a1 = expvalue(-1.414*3.14159 / Period);
    b1 = 2*a1*Cosine(1.414*180 / Period);
    c2 = b1;  c3 = -a1*a1;
    c1 = (1 + c2 - c3) / 4;
    If CurrentBar >= 4 Then US = (1 - c1)*Price + (2*c1 - c2)*Price[1] - (c1 + c3)*Price[2] + c2*US[1] + c3*US[2];
    If CurrentBar < 4 Then US = Price;
(a) Transfer function stated in the article: US = 1 - HP, HP = c1 (1 - 2 z^-1 + z^-2) / (1 - c2 z^-1 - c3 z^-2): the V.42:04
    $HighPass, NOT the HP-A of V.32:1 that HighPassFilter.c implements. Article example Period = 20. Article claim: 'zero lag in the pass band'.
    Cosine takes degrees: 1.414*180/P deg = sqrt(2)*pi/P rad. D1 rule 1: 1.414 -> sqrt(2), 3.14159 -> pi.
(a) Start-up: EasyLanguage CurrentBar starts at 1, so the first 3 outputs equal Price (seed pass3); the recursion starts on the 4th
    call with US[1], US[2] = the Price of calls 3, 2.
"""
reference = "analysis/harness/reference.py us_article(P) (exact constants), seed pass3"
other_forms = "(a) Not tested here: the SuperSmoother / HP forms of other articles. NCX is the wrong-high-pass control (HP-A of V.32:1)."

[[literal_replacements]]
literal = "1.414"
exact = 1.4142135623730951
name = "sqrt(2)"
rule = "D1 rule 1"
source = "(a) a1 and b1 lines. 1.414 = sqrt(2) to 4 significant digits (D1 rule 1, decided: replace). 180 in the degrees form is exact pi rad."

[[literal_replacements]]
literal = "3.14159"
exact = 3.141592653589793
name = "pi"
rule = "D1 rule 1"
source = "(a) a1 line. 3.14159 = pi to its printed digits (D1 rule 1)."

# Pre-registered lines of the corrected indicators/ehlers/UltimateSmootherE.c (D-1, D-2). The .c is written to these lines
# after this file is committed; a test asserts the .c contains them verbatim (whitespace-normalised, comments stripped).
# reference.us_code(P) with simulate(seed='pass3') implements exactly these lines.
[corrected_code]
file = "indicators/ehlers/UltimateSmootherE.c"
function = "var UltimateSmootherE(vars Price, int Period)"
lines = """
var us_k = sqrt(2.0);
var us_a1 = exp(-us_k*PI/Period);
var us_b1 = 2.0*us_a1*cos(us_k*PI/Period);
var us_c2 = us_b1;
var us_c3 = -us_a1*us_a1;
var us_c1 = (1.0 + us_c2 - us_c3)/4.0;
vars us_n = series(0, 2);
us_n[0] = us_n[1] + 1;
vars us_US = series(Price[0], 3);
if(us_n[0] < 4) {
    us_US[0] = Price[0];
    return us_US[0];
}
us_US[0] = (1.0 - us_c1)*Price[0] + (2.0*us_c1 - us_c2)*Price[1]
         - (us_c1 + us_c3)*Price[2] + us_c2*us_US[1] + us_c3*us_US[2];
return us_US[0];"""
notes = """(b) Changed vs the current .c (git blob c545c201140e2927e9a5c1ec7664440ded1b3350 at ddbf9fa): D-1 lines 47-48 `1.414 * PI` (folded literal product, gotchas 9d.8; D1 rule 1) -> `us_k*PI`; D-2 `Bar < 4` (global, base unconfirmed, the comment says 4 bars vs the source's 3) -> the per-instance counter `us_n` = EasyLanguage CurrentBar (1 on this instance's first call). Everything else (coefficient lines, recursion, series(Price[0], 3)) is unchanged.
(c) `series(0, 2)` giving `us_n[1] = 0` on the first call is expected from gotchas 9d.6, not proven: the start-up check on s20 detects an off-by-one (finding 7; NCS is that control). Both series() calls are unconditional (gotchas 3.1). Both series() calls precede the early return.
No NCH-style control: the old file's folded `1.414 * PI` would need a probe value (gotchas 9d.8); NCS and NCL cover its two deviations separately.
Header to write with the .c: source V.42:04 sidebar; keep the construction comment; correct the warm-up comment (3 bars, source); add a verification line pointing at this spec. Pre-run (ii): record the current file's blob hash (above)."""

