	nca_US[0] = (1.0 - nca_c1) * Price[0] + (2.0 * nca_c1 - nca_c2) * Price[1]
	          - (nca_c1 + nca_c3) * Price[2] + nca_c2 * nca_US[1] + nca_c3 * nca_US[2];
	return nca_US[0];
}'''
