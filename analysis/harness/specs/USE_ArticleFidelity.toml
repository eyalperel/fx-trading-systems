[[variants]]
id = "NC2"
role = "neg_control"
label = "NC2: cos arg in degrees vs P20 article"
kind = "inline"
function = "use_nc2"
params = [20]
expected = "P20"
seed = "pass3"
comment = """NC2: gross units bug (gotchas section 2, mixed-file mode): cosine argument in degrees (sqrt(2)*180/P), exponent unchanged. Stable at P = 20 (a1 = 0.80)."""
body = '''
var use_nc2(vars Price, int USP)
{
	var nc2_k = sqrt(2.0);
	var nc2_a1 = exp(-nc2_k * PI / USP);
	var nc2_b1 = 2.0 * nc2_a1 * cos(nc2_k * 180.0 / USP);
	var nc2_c2 = nc2_b1;
	var nc2_c3 = -nc2_a1 * nc2_a1;
	var nc2_c1 = (1.0 + nc2_c2 - nc2_c3) / 4.0;
	vars nc2_n = series(0, 2);
	nc2_n[0] = nc2_n[1] + 1;
	vars nc2_US = series(Price[0], 3);
	if(nc2_n[0] < 4) {
		nc2_US[0] = Price[0];
		return nc2_US[0];
	}
	nc2_US[0] = (1.0 - nc2_c1) * Price[0] + (2.0 * nc2_c1 - nc2_c2) * Price[1]
	          - (nc2_c1 + nc2_c3) * Price[2] + nc2_c2 * nc2_US[1] + nc2_c3 * nc2_US[2];
	return nc2_US[0];
}'''
