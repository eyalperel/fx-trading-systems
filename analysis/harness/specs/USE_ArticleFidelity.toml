body = '''
var use_ncs(vars Price, int USP)
{
	var ncs_k = sqrt(2.0);
	var ncs_a1 = exp(-ncs_k * PI / USP);
	var ncs_b1 = 2.0 * ncs_a1 * cos(ncs_k * PI / USP);
	var ncs_c2 = ncs_b1;
	var ncs_c3 = -ncs_a1 * ncs_a1;
	var ncs_c1 = (1.0 + ncs_c2 - ncs_c3) / 4.0;
	vars ncs_n = series(0, 2);
	ncs_n[0] = ncs_n[1] + 1;
	vars ncs_US = series(Price[0], 3);
	if(ncs_n[0] < 5) {
		ncs_US[0] = Price[0];
		return ncs_US[0];
	}
	ncs_US[0] = (1.0 - ncs_c1) * Price[0] + (2.0 * ncs_c1 - ncs_c2) * Price[1]
	          - (ncs_c1 + ncs_c3) * Price[2] + ncs_c2 * ncs_US[1] + ncs_c3 * ncs_US[2];
