	else                       ncg_CD = ncg_CD + ncg_L2[0] - ncg_L1[0];
	if(ncg_L2[0] >= ncg_L3[0]) ncg_CU = ncg_CU + ncg_L2[0] - ncg_L3[0];
	else                       ncg_CD = ncg_CD + ncg_L3[0] - ncg_L2[0];
	ncg_R[0] = ncg_R[1];
	if(ncg_CU + ncg_CD != 0) ncg_R[0] = ncg_CU/(ncg_CU + ncg_CD);
	*pL0 = ncg_L0[0];
	*pL3 = ncg_L3[0];
	*pDen = ncg_CU + ncg_CD;
	return ncg_R[0];
}'''
