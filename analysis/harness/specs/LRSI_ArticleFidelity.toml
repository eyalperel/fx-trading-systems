	vars ncg_R = series(0, 2);
	var ncg_e = 1;
	ncg_e = ncg_e / 1000;
	var ncg_q = gamma + ncg_e;
	var ncg_k = 1;
	ncg_k = ncg_k - ncg_q;
	ncg_L0[0] = ncg_k*Close[0] + ncg_q*ncg_L0[1];
	ncg_L1[0] = ncg_L0[1] - gamma*ncg_L0[0] + gamma*ncg_L1[1];
	ncg_L2[0] = ncg_L1[1] - gamma*ncg_L1[0] + gamma*ncg_L2[1];
	ncg_L3[0] = ncg_L2[1] - gamma*ncg_L2[0] + gamma*ncg_L3[1];
	var ncg_CU = 0;
	var ncg_CD = 0;
	if(ncg_L0[0] >= ncg_L1[0]) ncg_CU = ncg_L0[0] - ncg_L1[0];
	else                       ncg_CD = ncg_L1[0] - ncg_L0[0];
