body = '''
var lrs_ncp(vars Close, var gamma, var* pL0, var* pL3, var* pDen)
{
	var ncp_h = 1;
	ncp_h = ncp_h / 2;
	vars ncp_n = series(0, 2);
	vars ncp_L0 = series(0, 2);
	vars ncp_L1 = series(0, 2);
	vars ncp_L2 = series(0, 2);
	vars ncp_L3 = series(0, 2);
	vars ncp_R = series(0, 2);
	ncp_n[0] = ncp_n[1] + 1;
	ncp_R[0] = ncp_R[1];
	if(ncp_n[0] == 1) {
		ncp_L0[0] = Close[0];
		ncp_L1[0] = Close[0];
		ncp_L2[0] = Close[0];
		ncp_L3[0] = Close[0];
		*pL0 = ncp_L0[0];
		*pL3 = ncp_L3[0];
		*pDen = 0;
		return ncp_h;
	}
	var ncp_k = 1;
	ncp_k = ncp_k - gamma;
	ncp_L0[0] = ncp_k*Close[0] + gamma*ncp_L0[1];
	ncp_L1[0] = ncp_L0[1] - gamma*ncp_L0[0] + gamma*ncp_L1[1];
	ncp_L2[0] = ncp_L1[1] - gamma*ncp_L1[0] + gamma*ncp_L2[1];
	ncp_L3[0] = ncp_L2[1] - gamma*ncp_L2[0] + gamma*ncp_L3[1];
	var ncp_CU = 0;
	var ncp_CD = 0;
	if(ncp_L0[0] >= ncp_L1[0]) ncp_CU = ncp_L0[0] - ncp_L1[0];
	else                       ncp_CD = ncp_L1[0] - ncp_L0[0];
	if(ncp_L1[0] >= ncp_L2[0]) ncp_CU = ncp_CU + ncp_L1[0] - ncp_L2[0];
	else                       ncp_CD = ncp_CD + ncp_L2[0] - ncp_L1[0];
	if(ncp_L2[0] >= ncp_L3[0]) ncp_CU = ncp_CU + ncp_L2[0] - ncp_L3[0];
	else                       ncp_CD = ncp_CD + ncp_L3[0] - ncp_L2[0];
	if(ncp_CU + ncp_CD != 0) ncp_R[0] = ncp_CU/(ncp_CU + ncp_CD);
	*pL0 = ncp_L0[0];
	*pL3 = ncp_L3[0];
	*pDen = ncp_CU + ncp_CD;
	return ncp_R[0];
}'''
