[[variants]]
id = "NCH"
role = "info"
label = "NCH: hold initial 1/2 (L-2) vs G05"
kind = "inline"
function = "lrs_nch"
params = [[1, 2]]
expected = "G05_l0"
expected_outputs = { l0 = "G05_l0", l3 = "G05_l3" }
outputs = ["l0", "l3", "den", "out"]
comment = "INFO variant (L-2; not a control, not in [detect]): [corrected_code] except the held RSI starts at 1/2 (the old file's initial lr_prevRSI), held in a per-instance series seeded with 1/2 (series(nch_h, 2), gotchas 9d.6). (b) Invisible on every input here: the hold before a first defined value never fires, because x[0] != 0 makes CU + CD != 0 on the first row of every input. Reported, never PASS/FAIL."
body = '''
var lrs_nch(vars Close, var gamma, var* pL0, var* pL3, var* pDen)
{
	var nch_h = 1;
	nch_h = nch_h / 2;
	vars nch_L0 = series(0, 2);
	vars nch_L1 = series(0, 2);
	vars nch_L2 = series(0, 2);
	vars nch_L3 = series(0, 2);
	vars nch_R = series(nch_h, 2);
	var nch_k = 1;
	nch_k = nch_k - gamma;
	nch_L0[0] = nch_k*Close[0] + gamma*nch_L0[1];
	nch_L1[0] = nch_L0[1] - gamma*nch_L0[0] + gamma*nch_L1[1];
	nch_L2[0] = nch_L1[1] - gamma*nch_L1[0] + gamma*nch_L2[1];
	nch_L3[0] = nch_L2[1] - gamma*nch_L2[0] + gamma*nch_L3[1];
	var nch_CU = 0;
	var nch_CD = 0;
	if(nch_L0[0] >= nch_L1[0]) nch_CU = nch_L0[0] - nch_L1[0];
	else                       nch_CD = nch_L1[0] - nch_L0[0];
	if(nch_L1[0] >= nch_L2[0]) nch_CU = nch_CU + nch_L1[0] - nch_L2[0];
	else                       nch_CD = nch_CD + nch_L2[0] - nch_L1[0];
	if(nch_L2[0] >= nch_L3[0]) nch_CU = nch_CU + nch_L2[0] - nch_L3[0];
	else                       nch_CD = nch_CD + nch_L3[0] - nch_L2[0];
	nch_R[0] = nch_R[1];
	if(nch_CU + nch_CD != 0) nch_R[0] = nch_CU/(nch_CU + nch_CD);
	*pL0 = nch_L0[0];
	*pL3 = nch_L3[0];
	*pDen = nch_CU + nch_CD;
	return nch_R[0];
}'''
