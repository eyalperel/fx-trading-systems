# ----------------------------------------------------------------------------- pass condition
[pass_condition]
text = """Laguerre RSI source fidelity and implementation PASS only if ALL of the following hold; any other outcome is FAIL, recorded and kept (CLAUDE.md
section 4.8), and its cause found before anything is changed:
1. All 129 real checks PASS: 3 variants (G05, G07, G08) x 43 checks = l0: flat, 5 sine gains, alt gain, 5 sine phases, alt phase, ramp lag (14) +
   l3: the same 14 (14) + out: 5 trace (one per sine), 2 invariance (sc, of), 1 bound, 2 ramp_exact (ramp, rampdn), 5 startup (one per sine) (15), against
   the tables / model above at the tolerances above. No row is SKIP (every expected gain, alt included, is >= phase_gate). INFO rows (flat / ramp of out)
   are written with result INFO and are not counted.
2. Each of the 4 negative controls (NCG, NC25, NCP, NCS) FAILS on every kind listed in [detect.required]. A control that passes = harness broken.
3. No input guard fires (x[n] incl. alt, rampdn and the copies vs recomputed, tol 1e-12; clock range), no row is ERROR in ANY variant (a gate that removes
   every row of a sine is an ERROR), no NaN / infinite value. The NCH and NCT rows (role info) are written as INFO, never PASS / FAIL, and are not counted
   in item 1. The skipped pairs NCS:flat and NCT:flat have no column and no row; the results header lists them.
4. No line starting with 'Error' in the Zorro window (gotchas 9d.3). The EXITRUN marker / EXIT line is NOT a check (gotchas 9d.4: it never fires).
5. The results file reports the variant count: 3 real + 4 negative controls + 2 info (NCH, NCT) = 9 variants.
6. IMP: every [imp].must_pass replay <= 1e-9 (9 variants), and the [imp].must_fail replay > 1e-9 (1 row: G05 vs the NCG model; guard seen to fire).
7. Floor guard: for every real variant, max |Zorro - book| <= tolerance / 10 for gain (3e-6), lag (1e-4), phase (3e-6 rad), startup (1e-7), trace (3e-6),
   invariance (1e-10) and ramp_exact (1e-13) (D2 rule 3 floor side). If exceeded, the window is invalid: the result is NOT accepted until explained, even if
   items 1-6 hold.
Pre-run (not run-time) conditions, done before the [Test] click and recorded in Amendment 1 (stage 2):
   (i) the corrected LaguerreRSI.c contains [corrected_code].lines and wrapper_lines verbatim (whitespace-normalised, comments stripped);
   (ii) the current LaguerreRSI.c blob is recorded and the corrected file differs from it only by L-1, L-2, L-3, L-5, L-6; LaguerreRSI_Superseded.c is the
        current body verbatim, renamed lr_ -> lro_;
   (iii) reference.py reproduces this file's expected tables, floors, effects, [findings] and IMP fire-test numbers to <= 1e-9 (relative 1e-9 for values > 1).
        Every number is stored at full precision. Each inline control body is checked at run time, not by reading: IMP must_pass replays every variant with
        its own model (pass item 6);
   (iv) generator --lint-only passes on this file (D2 windows ok, every margin >= 10x; after stage 2 also the two includes resolve and the no-static check passes);
   (v) no-static lint (brief Amendment 1, decision C): indicators/ehlers/LaguerreRSI.c contains no `static` token (comments excluded); the check is seen to
        fire on the superseded body (2 hits: lr_init, lr_prevRSI). Recorded here and in the results header (INFO L_NO_STATIC line)."""


# ----------------------------------------------------------------------------- observations (INFO only)
[observations]
O_MARGIN = "Report the generator's D2 INFO lines (floor x10 vs tolerance; per-control margin) in the results header."
O_PIN = "(b) Pinning (finding 7, rows >= 200): the share of out rows at exactly 0 or 1 grows with T and depends on gamma: G05 0.0 / 0.0 / 0.5 / 0.7 / 0.88, G07 0.0 / 0.0 / 0.1 / 0.45 / 0.78, G08 0.0 / 0.0 / 0.0 / 0.2 / 0.66 at T = 5 / 10 / 20 / 40 / 100 ([findings] pinned_share_*). A pinned row only tests that the four stages are ordered; the informative rows are short T and the transitions, which is why T = 5 and 10 and three gammas are in the spec."
O_ALT = "(b) Alt input: out alternates between two values, min 0.3333333333333333 / max 0.6666666666666666 (G05), 0.3333333333333333 / 0.6666666666666666 (G07), 0.33333333333342213 / 0.6666666666667554 (G08) over rows >= W (= 1/3 and 2/3 to rounding; [findings] alt_out_*). Reported, INFO only (alt out is not a check; the alt gain and phase of l0 / l3 are)."
O_FLAT = "(b) Flat (D6 rule 2: INFO, never PASS/FAIL): G05 reaches CU + CD = 0 exactly at row 69 and holds 1.0 from there; G07 / G08 have 0 / 0 rows with CU + CD = 0 (never exactly 0: out is normalised rounding noise) ([findings] flat_*)."
O_HOLD = "(b) Brief Amendment 1, decision C: the shared hold of the superseded file (lr_prevRSI) acts only on CU + CD = 0 rows, which occur only on flat (G05 from row 69, finding 10); flat out is INFO (D6 rule 2), so no control can show it on these inputs. L-3 is covered by the no-static pre-run lint ([lint], pre-run item v), not by a control."
O_NCS = "(b) Brief Amendment 1, decision A: with skip_inputs = [\"flat\"] the first superseded call of the run is NCS on s5, which takes the run's only seed (file static lr_init): its start-up differs from the G05 model by up to 0.5979633949986088 (last row with |diff| > 0: 69, > 1e-12: 60; the planning chat's value for the price seed at T = 5 is 0.5979633949986088 = NCP T = 5). Every other (instance, input) pair of NCS / NCT is bit-identical to the G05 model on every row (max |diff| 0.0); on rows >= W no pair differs (0.0). NCS is therefore detected by startup on s5 only ([detect.required])."
O_NCT = "(b) NCT (instance 2 of the superseded file) is role info: it starts from zero history on every input (NCS took the seed) and equals the G05 model bit for bit, so no kind can see it and it cannot be a negative control under D2 per-control detection. It is run so that two instances share the statics every bar (D6 rule 5) and is replayed by IMP with the shared-state model in call order."
O_NCP = "(b) NCP (price seed alone, no statics) differs from the source only in rows < W: start-up 0.5979633949986088 / 0.9392821926106899 / 0.9233174011464185 / 0.6160813372907071 / 0.2142857142857143 at T = 5 / 10 / 20 / 40 / 100 ([findings] effect_NCP_startup_T*), trace (rows >= W) 0.0. Detected by startup; its IMP discrimination is 0 (O_IMP_ROWS)."
O_NCH = "(b) NCH (hold initial 1/2, L-2) is invisible on every input here: the hold before a first defined value never fires, because x[0] != 0 gives CU + CD != 0 on the first row of every input; effect vs the G05 model 0.0 (start-up) / 0.0 (trace), max over the five sines. INFO, never PASS/FAIL."
O_NCG = "(b) NCG (gamma + 1/1000 in L0 only): analytic gain effect max 0.0011355290725828526, phase max 0.0013338316280959717 rad, ramp lag of l0 1.0040080160320641 bars (theory 1; 4x the lag tolerance: lag is not required) ([findings] effect_NCG_*_analytic); trace by T 8.587296356932228e-05 / 0.0006342174551938473 / 0.0007133515100741228 / 0.0008146242189909225 / 0.0008469690514941175."
O_NC25 = "(b) NC25 (TASC 2025 stage form): L0 unchanged; L3 analytic gain effect max 0.4448555257468428, phase max 1.5370047327232639 rad, ramp lag of l3 7.0 bars (vs 10); trace by T 0.38513302852097764 / 0.3487701068339998 / 0.30284144990303796 / 0.2945505035341127 / 0.2937768393508384."
O_GATE = "(b) Gate margin (CU + CD)/amplitude of the model, rows >= 200, min over the sine set: G05 0.07555156262124552 (T = 100), G07 0.24451738161783698, G08 0.31807224827549163 (finding 3; alt: 2.000000000000046 / 1.0588235294117343 / 0.6666666666663268). The gate g = 0.01 excludes no row of a correct variant."
O_STARTUP = "(a)/(b) The source defines the start-up (L-1: zero histories, bar 1 computed), so rows < W of out on every sine are PASS/FAIL against the model (startup kind). G05, T = 20, rows 0-3: 0.7142857142857143, 0.7148014911433533, 0.8001802080788746, 1.0. Start-up memory (price seed vs zero start): last differing row 61 / 120 / 196 (G05 / G07 / G08); W = 700."
O_IMP_ROWS = "(b) IMP reads rows >= W only: NCP and NCS differ from the source only in rows < W and NCH nowhere, so their discrimination against the G05 model is 0 ([imp.fire_test.discrimination]); their own-model must_pass replays still check the run, and NCP / NCS are detected by startup."
O_NO_NCL = "(b) No NCL variant: no trig, no PI and no decimal literal in the source's arithmetic; gamma = 0.5 is exact (brief item 2)."
O_L4_FLOAT32 = "(b) L-4: 0.7 and 0.8 are not float32-exact (gotchas 9d.1); the harness builds every gamma at run time from integers (lrs_g7_10 = 7/10, lrs_g4_5 = 4/5) and the model uses the same double values (7/10, 4/5)."
O_SKIP = "(b) Brief Amendment 1, decision A: NCS:flat and NCT:flat are skipped (no call, no raw column, no check); the results header lists them (SKIPPED_INPUTS line)."
O_IMP_RESIDUAL = "Report the IMP residual per real variant and the Zorro-vs-model residual per kind per real variant; the latter is the measured floor (expected at rounding level: no PI gap)."
O_STATICS_RESET = "(b) The generated script's own statics (lrs_n, lrs_done, lrs_hdr, lrs_rows, lrs_sgn) are reset at INITRUN. The superseded file's statics are not (it is called only after INITRUN returns): restart Zorro before a rerun ([run_notes])."

