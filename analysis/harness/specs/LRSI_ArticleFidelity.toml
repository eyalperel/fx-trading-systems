# LRSI_ArticleFidelity.toml -- Laguerre RSI (Ehlers, Cybernetic Analysis 2004, Fig. 14.8), SOURCE FIDELITY + IMPLEMENTATION (HARNESS_DESIGN §1, both
# questions), the THIRD spec of the OSCILLATOR family (HARNESS_DESIGN D6; first RFX, second MST).
# Pre-registration: this file, committed BEFORE the corrected LaguerreRSI.c / LaguerreRSI_Superseded.c are written and BEFORE the generated script is run
# (CLAUDE.md §4.2). Amendments are dated and appended at the end of the file, never edited in place.
# DRAFT of LRSI stage 1 (planning chat 2026-11-19; decisions L-1..L-7 of docs/harness/LAGUERRERSI_SOURCE_REVIEW.md and D6 accepted by the user; brief
# docs/harness/LRSI_STAGE1_PROMPT.md incl. its Amendment 1 (NCS call order, user decision A + C)), built on the RFX / MST oscillator tooling plus: real-valued
# call parameters built from integers, four columns per call (l0 / l3 / den / out), linear checks on TWO outputs, the falling ramp `rampdn`, the check kinds
# ramp_exact and startup on the normalised output, the gate on the model's CU + CD, per-variant `skip_inputs`, the no-static pre-run lint (this branch).
# Format: as specs/MESA_ArticleFidelity.toml. Labels: (a) source states, (b) measured / computed here, (c) inference.
# Ids must not contain '-' (check ids are <prefix>-<variantid>-<check>; the linear checks carry a final -l0 / -l3).
#
# What differs from MST:
#   * One REAL-valued parameter (gamma), built at run time from integers (lrs_g1_2 = 1/2, lrs_g7_10 = 7/10, lrs_g4_5 = 4/5; gotchas 9d.1, 9d.8). Real
#     variants G05 (0.5, the book's and the C2 default), G07 (0.7), G08 (0.8).
#   * Every real variant is called through LaguerreRSICore(Close, gamma, &l0, &l3, &den) and exports four outputs: l0 (the EMA stage), l3 (the last allpass
#     stage), den (CU + CD, information only) and out (the RSI, the return value). The v1 checks (flat, 5 gains, alt gain, 5 phases, alt phase, ramp lag; D4)
#     run on BOTH l0 and l3, each against its own analytic table (DC gain 1: ramp lag, no residual). Trace, invariance, bound, ramp_exact and start-up read out.
#   * No trig, no PI, no decimal literal in the corrected code: there is NO Zorro-PI gap and NO NCL variant (nothing printed differs from its exact value:
#     gamma is an input, 0.5 is exact). Model = code; the floor is the IMP residual (rounding level).
#   * Start-up IS defined by the source (L-1: all histories 0, bar 1 computed): rows < W of out on every sine are PASS/FAIL against the model (startup kind).
#   * Known answers on the ramps (new kind ramp_exact): rising ramp out = 1.0 exactly, falling ramp out = 0.0 exactly, rows >= W.
#   * The final output itself is exactly bounded: out in [0, 1] (two-sided, read from out).
#   * NCS / NCT are the REAL superseded file (LaguerreRSI_Superseded.c, written in stage 2) called as TWO instances (both gamma 0.5) with skip_inputs = ["flat"]
#     (brief Amendment 1, decision A): the run's only seed (file static lr_init) then lands on NCS's s5 call, which its start-up check sees. The shared hold
#     (lr_prevRSI) acts only on CU + CD = 0 rows, i.e. flat: covered by the no-static pre-run lint (decision C), not by a control (O_HOLD).

[batch]
name = "LRS_ArticleFidelity"
id_prefix = "LRS"
indicator = "LaguerreRSICore"            # Light-C function called by the `param` variants (corrected LaguerreRSI.c, stage 2)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/LRSI_ArticleFidelity.toml (this file)"
script_name = "GEN_LRS_LaguerreRSI"     # generated Light-C file; the generator never overwrites
real_params = true                       # params elements may be [n, d] pairs: gamma built at run time from integers (gotchas 9d.1, 9d.8)

[source]
article = "Ehlers, J. F., Cybernetic Analysis for Stocks and Futures (Wiley 2004), ch. 14 'Time Warp - Without Space Travel', Fig. 14.8 'EasyLanguage Code to Compute a Laguerre RSI Indicator', p. 221; Fig. 14.9 (EFS, pp. 222-224) agrees"
formula = """
(a) Inputs: gamma(.5);   Vars: L0(0), L1(0), L2(0), L3(0), CU(0), CD(0), RSI(0);
    L0 = (1 - gamma)*Close + gamma*L0[1];
    L1 = - gamma *L0 + L0[1] + gamma *L1[1];
    L2 = - gamma *L1 + L1[1] + gamma *L2[1];
    L3 = - gamma *L2 + L2[1] + gamma *L3[1];
    CU = 0;  CD = 0;
    If L0 >= L1 then CU = L0 - L1 Else CD = L1 - L0;
    If L1 >= L2 then CU = CU + L1 - L2 Else CD = CD + L2 - L1;
    If L2 >= L3 then CU = CU + L2 - L3 Else CD = CD + L3 - L2;
    If CU + CD <> 0 then RSI = CU / (CU + CD);
    Plot1(RSI, "RSI"); Plot2(.8); Plot3(.2);
(a) All variables start at 0 and bar 1 is computed (L-1). RSI holds its previous value when CU + CD = 0, initial 0 (L-2). Input Close; only gamma is an input.
(b) Transfer functions: L0 = (1 - g)/(1 - g z^-1) (an EMA); each later stage multiplies by the allpass A = (z^-1 - g)/(1 - g z^-1). So L3 = L0 x A^3:
    |L3| = |L0| at every frequency, DC gain 1 for both; ramp lag L0 = g/(1 - g), L3 = g/(1 - g) + 3 (1 + g)/(1 - g).
"""
reference = "analysis/harness/reference.py lrsi_article(g, g_l0, form, seed, hold0) (simulate_lrsi; book term order), lrsi_superseded(gs, index) (simulate_lrsi_shared, the old file's shared statics in the generator's call order); lrsi_gain / lrsi_phase / lrsi_lag / lrsi_alt_phase for the analytic L0 / L3 tables (product form H_L0 x A^stage)"
other_forms = "(a) Not tested here: the source's use (buy after the line crosses back over 0.2, sell after it crosses back under 0.8; p. 221 / p. 225) is a strategy matter. (b) The 2025 TASC form (review L-6) is the negative control NC25."
no_ncl = "(b) No NCL variant: the source has no trig, no PI and no decimal literal in its arithmetic (gamma is an input; the book default .5 is exact in float32 and float64), so there is no 'as printed' form that differs from the exact one (brief, item 2)."

# Pre-registered lines of the corrected indicators/ehlers/LaguerreRSI.c (L-1, L-2, L-3, L-5). The .c is written to these lines AFTER this file is committed
# (stage 2); a test then asserts it contains them verbatim (whitespace-normalised, comments stripped). reference.lrsi_article(g) implements exactly these lines
# (book term order: same value up to rounding; IMP must pass at 1e-9).
[corrected_code]
file = "indicators/ehlers/LaguerreRSI.c"
function = "var LaguerreRSICore(vars Close, var gamma, var* pL0, var* pL3, var* pDen)"
lines = """
vars lr_L0 = series(0, 2);
vars lr_L1 = series(0, 2);
vars lr_L2 = series(0, 2);
vars lr_L3 = series(0, 2);
vars lr_R  = series(0, 2);
var lr_k = 1;
lr_k = lr_k - gamma;
lr_L0[0] = lr_k*Close[0] + gamma*lr_L0[1];
lr_L1[0] = lr_L0[1] - gamma*lr_L0[0] + gamma*lr_L1[1];
lr_L2[0] = lr_L1[1] - gamma*lr_L1[0] + gamma*lr_L2[1];
lr_L3[0] = lr_L2[1] - gamma*lr_L2[0] + gamma*lr_L3[1];
var lr_CU = 0;
var lr_CD = 0;
if(lr_L0[0] >= lr_L1[0]) lr_CU = lr_L0[0] - lr_L1[0];
else                     lr_CD = lr_L1[0] - lr_L0[0];
if(lr_L1[0] >= lr_L2[0]) lr_CU = lr_CU + lr_L1[0] - lr_L2[0];
else                     lr_CD = lr_CD + lr_L2[0] - lr_L1[0];
if(lr_L2[0] >= lr_L3[0]) lr_CU = lr_CU + lr_L2[0] - lr_L3[0];
else                     lr_CD = lr_CD + lr_L3[0] - lr_L2[0];
lr_R[0] = lr_R[1];
if(lr_CU + lr_CD != 0) lr_R[0] = lr_CU/(lr_CU + lr_CD);
*pL0 = lr_L0[0];
*pL3 = lr_L3[0];
*pDen = lr_CU + lr_CD;
return lr_R[0];"""
wrapper_function = "var LaguerreRSI(vars Close, var gamma)"
wrapper_lines = """
var lr_w0;
var lr_w3;
var lr_wd;
return LaguerreRSICore(Close, gamma, &lr_w0, &lr_w3, &lr_wd);"""
notes = """(b) Changed vs the current .c (mtime 2026-08-21; blob recorded at pre-run (ii), stage 2): L-1 zero start, every stage from its series(0, 2) history, the bar is computed from the first call (the `static int lr_init` price seed, the early `return 0.5` and the `Close[0] > 0` value guard are removed); L-2 the hold lives in a per-instance series lr_R (initial 0, was `static var lr_prevRSI = 0.5`); L-3 no statics left; L-5 the stages are exported through LaguerreRSICore(Close, gamma, &l0, &l3, &den), `LaguerreRSI(Close, gamma)` is a thin wrapper so callers do not change; L-6 header with source, formula, deviations fixed, the review path and labelled claims (written with the .c); L-4 header note for callers (gamma 0.7 / 0.8 are not float32-exact: build them at run time).
(b) The term order in L1..L3 differs from the book (`L(k-1)[1] - g*L(k-1) + g*Lk[1]` vs `-g*L(k-1) + L(k-1)[1] + g*Lk[1]`, every expression starts with a variable, gotchas 9d.8): the same value up to rounding; the model uses the book order; IMP must pass at 1e-9.
(c) All five series() calls are unconditional and first (gotchas 3.1); L-1's zero start is each series(0, 2)'s initial history on the instance's first call (gotchas 9d.6, to be confirmed by the start-up checks, pass item 1). `*pL0 = ...` out-parameters compile in Light-C (same pattern as ReflexCore and MESAStochasticCore: RFX / MST run 1 PASS). If any line cannot compile, stage 2 stops and reports.
Superseded file (stage 2): the CURRENT LaguerreRSI.c body verbatim as indicators/ehlers/LaguerreRSI_Superseded.c, function `LaguerreRSI_Superseded`, locals and statics `lr_` -> `lro_` (flat namespace, gotchas 1.3). It is the shared-state control NCS / NCT."""


[zorro]
include = ["../../indicators/ehlers/LaguerreRSI_Superseded.c", "../../indicators/ehlers/LaguerreRSI.c"]   # resolved from strategies/tests/; both written in stage 2 (lint reports LaguerreRSI_Superseded.c missing until then; the current LaguerreRSI.c exists but has no LaguerreRSICore and still has its two statics)
raw_file = "Data/GEN_LRS_raw.csv"
marker_file = "Data/GEN_LRS_exit_marker.txt"       # gotchas 9d.4: never fires; NOT a check on the run card
clock_asset = "EUR/USD"
bar_period = 1440
start_date = 20080101
end_date = 20240101
series_len = 3

[inputs]                    # as MST, plus the falling ramp
n_bars = 3000
warmup = 700              # (b) W = 700 (D6 family default): start-up memory of the price seed vs the zero start, last differing row 61 / 120 / 196 (G05 / G07 / G08, [findings] startup_memory_*); 700 = 3.6x the largest
level = [11, 10]            # 1.1, built at run time from integers (gotchas 9d.1)
amp = [1, 100]              # 0.01
slope = [1, 10000]          # 0.0001
sine_periods = [5, 10, 20, 40, 100]
alternating = true          # extra input id `alt`: level + amp*(-1)^n, after the sines and before ramp
ramp_down = true            # extra input id `rampdn`: level - slope*n, right after ramp (ramp_exact known answer 0)

[inputs.invariance]         # D6 rule 4: transformed copies of every sine, fed to every variant with invariance = true
transforms = [{ id = "sc", level = [11, 10], amp = [1, 10] }, { id = "of", level = [22, 10], amp = [1, 100] }]   # scale x10 (amp 0.1, level 1.1) and offset (level 2.2, amp 0.01)

[clock]
lo = 0.8
hi = 1.7
source = "(b) h1_check.py CLOCK_LO/CLOCK_HI: EUR/USD D1 closes lie inside; magnitude guard against a wrong asset"

[checks]                    # HARNESS_DESIGN D4 + D6
dc_gain = 1.0
phase_gate = 0.05
linear_output = ["l0", "l3"]  # the v1 checks run on BOTH outputs, each against its own table (variant key expected_outputs); check ids end in -l0 / -l3
trace_gate = 0.01             # g: rows with (CU + CD of the MODEL)/amplitude < g are excluded from trace / invariance (D6 rule 2)
bound = [0.0, 1.0]            # out lies in [0, 1] (two-sided, ABSOLUTE allowance [tolerances.bound])
bound_output = "out"          # the final output itself is exactly bounded (review §4)
ramp_exact = { ramp = 1.0, rampdn = 0.0 }   # known answers of out on rows >= W (finding 8)
startup_output = true         # rows < W of out on every sine vs the model, PASS/FAIL (L-1: the source defines the start-up)
source = """(b) L0 and L3 have DC gain 1 (lrsi_gain at T -> infinity = 1 to rounding; H_L0(1) = 1, |A(1)| = 1): D4 rule 1 ramp lag, flat expected error 0 (D4 rule 2), no ramp residual. phase_gate (c): judgement, as HPF / RFF / USE / RFX / MST; (b) the smallest expected gain in the six tables is the alt gain 0.11111111111111109 (G08) >= 0.05, so every sine phase AND every alt phase is checked (no SKIP row). trace_gate g = 0.01 (c): judgement (D6 default); (b) the smallest (CU + CD)/amplitude over the sine rows >= 200 of the three real models is 0.07555156262124552 (G05, T = 100), 7.6x the gate (finding 3): no gated row on a correct variant; a gated row is counted and reported. bound [0, 1] (b): CU, CD >= 0, the ratio lies in [0, 1] exactly in IEEE arithmetic and the hold is a previous ratio or the initial 0; 0.0 and 1.0 are attained (finding 7, pinning). ramp_exact (b): rising ramp out = 1.0 exactly from row 3 / 6 / 10, falling ramp 0.0 exactly after row 23 / 43 / 68 (G05 / G07 / G08; CD = 0 or CU = 0 exactly once the stages are ordered, finding 8): a known answer, not rounding noise. startup_output (a)/(b): L-1, the source defines the zero start; the model's start-up rows are the expected values."""


[tolerances.flat]
value = 1e-09
source = "(a) H1 criteria section 5 (unchanged). Applies to l0 and l3: expected max |y - level| = 0 on flat over rows >= W (DC gain 1, D4 rule 2). (b) floor: see [floor].flat."
[tolerances.gain]
value = 3e-05
source = "(c) D4 / D2 default for this family (SS2F / HPF / RFF / USE / RFX / MST). (b) window: floor x10 <= 3e-5 (see [floor].gain); smallest control on gain NCG 38x. Applies to the five sine gains and the alt gain of l0 and of l3."
[tolerances.phase]
value = 3e-05
source = "(c) D4 rule 5 default, radians. (b) window: see [floor].phase; NCG 44x. Applies to the five sine phases and the alt phase of l0 and l3."
[tolerances.lag]
value = 0.001
source = "(a) D2 rule 1 default (H1). Ramp lag of l0 and l3, bars, mean (x - y)/slope over the last 100 ramp rows. (b) floor: see [floor].lag."
[tolerances.trace]
value = 3e-05
source = "(c) D6 default (RFX), unchanged here: there is no PI gap, the floor is the IMP residual (rounding level; [floor].trace). (b) window: floor x10 far below 3e-5; smallest control on trace NCG 28x (max over T)."
[tolerances.startup]
value = 1e-06
source = "(c) D4 default (HPF; start-up 1e-6). Here on the normalised output, rows < W of every sine vs the model (L-1). (b) floor: [floor].startup; controls NCG / NCP / NCS >= 10x (see [detect])."
[tolerances.ramp_exact]
value = 1e-12
source = "(c) NEW kind (LRSI stage 1): absolute allowance on the known answers out = 1 (ramp) / 0 (rampdn), rows >= W; (b) the model gives the answers exactly (finding 8); 1e-12 is a few-ulp allowance, as the bound."
[tolerances.bound]
value = 1e-12
source = "(c) MST two-sided form, ABSOLUTE allowance tol_abs on both ends: PASS if every out row of every input lies in [0 - tol_abs, 1 + tol_abs]. (b) the bound holds exactly (finding 4)."
[tolerances.invariance]
value = 1e-09
source = "(c) D6 rule 4 default: max |out(input) - out(transformed input)| over the gated rows >= W, five sines, transforms sc (amp x10) and of (level 2.2). (b) float64 floor ~1e-12 (finding 5). Zorro-internal comparison, no model."
[tolerances.x]
value = 1e-12
source = "(a) STEP2_HANDOFF Stage 3 G4 (= h1_check.TOL_X, exported input vs recomputed x[n]). Covers alt, rampdn and the invariance copies."
[tolerances.imp]
value = 1e-09
source = "(c) As HPF / SS3F / RFF / USE / RFX / MST. Applies to l0 / l3 / den (every exported base input, absolute) and to out on the gated sine rows (and copies). (b) Fire tests: see [imp.fire_test]."

[lint]
