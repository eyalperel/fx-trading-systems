source = "(b) Brief Amendment 1, decision C (user, 2026-11-19): the corrected LaguerreRSI.c must contain no `static` token (comments and strings excluded): the structural check for L-3 (shared lr_init / lr_prevRSI). generator.lint_no_static; seen to fire on the superseded body (2 hits, lr_init and lr_prevRSI: test_generator_lrsi). generator --lint-only refuses (L_NO_STATIC) while the file has a static or is missing; the checker writes the record into the results header (INFO L_NO_STATIC). Until stage 2 the current file has both statics: lint reports it, as it reports the missing LaguerreRSI_Superseded.c include."


