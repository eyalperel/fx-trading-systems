[[variants]]
id = "NCA"
role = "neg_control"
label = "NC-A: a1 +1 in 3rd digit vs P=20 book"
kind = "inline"
function = "ss3f_nc_a"
param = 20
expected = "P20"
comment = """NC-A: realistic copying error (D2 rule 4), ceiling control. Identical to [corrected_code] except a1 gets +1
in its 3rd significant digit BEFORE b1, c1 and the coefs are derived (0.854636 -> 0.855636 at P = 20); coef1 is
recomputed from the bumped coefs, so DC gain stays 1. Step 1/1000 = bump3(a1) at P = 20. Defined here only."""
body = '''
var ss3f_nc_a(vars Price, int P)
{
	var a1 = exp(-PI / P);
	a1 = a1 + 1.0 / 1000;
	var b1 = 2.0 * a1 * cos(sqrt(3.0) * PI / P);
	var c1 = a1 * a1;
	var coef2 = b1 + c1;
	var coef3 = -(c1 + b1 * c1);
	var coef4 = c1 * c1;
	var coef1 = 1.0 - coef2 - coef3 - coef4;
	var* Filt = series(Price[0], 4);
	if(Init) {
		Filt[0] = Price[0];
		return Filt[0];
	}
	Filt[0] = coef1 * Price[0] + coef2 * Filt[1] + coef3 * Filt[2] + coef4 * Filt[3];
	return Filt[0];
}'''
[variants.effect]       # error vs the P=20 book table; lag = measured-check (sim_lag on the ramp), SS2F lesson
gain = 1.0740344574e-3
lag = 1.1553697025e-2
flat = 0.0
source = "(b) ss3_code(20, PI_ZORRO, a1_bump=1) vs ss3_article(20), computed 2026-11-15"

[[variants]]
id = "NCB"
role = "neg_control"
