[detect]
source = "(b) Each listed kind has [variants.effect] >= 10x its tolerance: NCA gain 36x, lag 11.6x; NCB gain 147x, lag 6.2e4x, flat 4.9e6x; NCL gain 123x, lag 16x; NCH gain 8956x, lag 3670x; NC1 gain 1802x, lag 316x; NC2 gain 12545x, lag 3131x."
rule = "A kind is detected for a control if at least one of that control's checks of that kind (flat | gain-T* | ramp-lag) has result FAIL. Every listed kind must be detected; otherwise the control counts as NOT failing as required and the run is FAIL."
[detect.required]
NCA = ["gain", "lag"]
NCB = ["gain", "lag", "flat"]
NCL = ["gain", "lag"]
NCH = ["gain", "lag"]
NC1 = ["gain", "lag"]
NC2 = ["gain", "lag"]

# ----------------------------------------------------------------------------- IMP (decision 4)
[imp]
what = """Implementation check (HARNESS_DESIGN §1, first question). For each listed variant, replay the recursion in
Python (reference.simulate) with the named coefficient model on the x columns EXPORTED by Zorro (not recomputed
inputs), and report max |y_Zorro - y_replay| over bars n >= warmup, per input and overall."""
tolerance = "[tolerances.imp] 1e-9"
must_pass = { P10 = "ss3_code(10, PI_ZORRO)", P14 = "ss3_code(14, PI_ZORRO)", P20 = "ss3_code(20, PI_ZORRO)", P30 = "ss3_code(30, PI_ZORRO)", NCH = "ss3_hybrid(20, PI_ZORRO)" }
must_fail = { NCH = "ss3_code(20, PI_ZORRO)" }
fire_test_effect = "(b) NCH output vs ss3_code(20) replay, n >= 500: flat 1.1e-14, s5 1.4e-4, s10 7.9e-4, s20 3.8e-3, s40 4.1e-3, s100 2.1e-3, ramp 3.7e-4; overall 4.1e-3 = 4e6x tol. Same filter replayed with its own (hybrid) coefficients: 0 in the standalone model."
diagnosis = """FIDELITY PASS + IMP PASS: verified on both questions. FIDELITY FAIL + IMP PASS: copying difference (.c lines vs
book). IMP FAIL on any real variant: Zorro / implementation problem; the fidelity result is not interpretable.
NCH is expected to show FIDELITY FAIL + IMP PASS (own coefficients): the copying-error signature on a real bug."""

# ----------------------------------------------------------------------------- pass condition
[pass_condition]
text = """SS3 source fidelity and implementation PASS only if ALL of the following hold; any other outcome is FAIL,
recorded and kept (PROJECT_STATE §2 rule 9), and its cause found before anything is changed:
1. All 28 real checks PASS: 4 periods (P10, P14, P20, P30) x 7 checks (flat, 5 sine gains, ramp lag), against the
   book tables above at the tolerances above.
2. Each of the 6 negative controls FAILS on every kind listed in [detect.required]. A control that passes = harness broken.
3. No input guard fires (x[n] vs recomputed, tol 1e-12; clock range), no row is ERROR in ANY variant, real or control,
   no NaN / infinite value.
4. No line starting with 'Error' in the Zorro window (gotchas 9d.3). The EXITRUN marker / EXIT line is NOT a check
   (gotchas 9d.4: it never fires).
5. The results file reports the variant count: 4 real + 6 negative controls = 10 variants.
6. IMP: every [imp].must_pass replay <= 1e-9, and the [imp].must_fail replay > 1e-9 (guard seen to fire).
7. Floor guard: for every real variant, max gain |Zorro - book| <= 3e-6 and lag |Zorro - book| <= 1e-4
   (= tolerance / 10, D2 rule 3 floor side). If exceeded, the tolerance window is invalid: the result is NOT accepted
   until explained, even if items 1-6 hold.
Pre-run (not run-time) conditions, done by Claude Code before the [Test] click and recorded in Amendment 1:
   (i) the corrected .c contains [corrected_code].lines verbatim (whitespace-normalised);
