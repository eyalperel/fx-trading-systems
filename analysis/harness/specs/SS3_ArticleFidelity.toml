kind = "inline"
function = "ss3f_nc_b"
param = 20
expected = "P20"
comment = """NC-B: realistic copying error (D2 rule 4). Identical to [corrected_code] except coef1 gets +1 in its 3rd
significant digit AFTER all coefficients are computed (0.022647 -> 0.022747 at P = 20), so DC gain != 1 and the FLAT
check must fire. On the ramp the DC error reads as lag (HARNESS_DESIGN D2 A1 correction): measured lag error 61.6 bars.
Step 1/10000 = bump3(coef1) at P = 20. Defined here only."""
body = '''
var ss3f_nc_b(vars Price, int P)
{
	var a1 = exp(-PI / P);
	var b1 = 2.0 * a1 * cos(sqrt(3.0) * PI / P);
	var c1 = a1 * a1;
	var coef2 = b1 + c1;
	var coef3 = -(c1 + b1 * c1);
	var coef4 = c1 * c1;
	var coef1 = 1.0 - coef2 - coef3 - coef4;
	coef1 = coef1 + 1.0 / 10000;
	var* Filt = series(Price[0], 4);
	if(Init) {
		Filt[0] = Price[0];
		return Filt[0];
	}
	Filt[0] = coef1 * Price[0] + coef2 * Filt[1] + coef3 * Filt[2] + coef4 * Filt[3];
	return Filt[0];
}'''
[variants.effect]
gain = 4.4176302400e-3
lag = 6.1573578916e1
flat = 4.8571513550e-3
source = "(b) ss3_code(20, PI_ZORRO, in_bump=1) vs ss3_article(20); lag = sim_lag measured-check error; flat = 1.1 x |DC gain - 1|; computed 2026-11-15"

[[variants]]
id = "NCL"
role = "neg_control"
label = "NC-L: book as printed (1.738, 3.14159) vs P=20 book with sqrt(3), pi"
kind = "inline"
function = "ss3f_nc_l"
param = 20
expected = "P20"
comment = """NC-L: the listing exactly as printed (D1 Amendment 1 evidence). Exponent constant 314159/100000 and cosine factor
1738/1000, both built from integers at run time (gotchas 9d.1: no decimal literals). The cosine keeps Zorro PI (the
book's degrees form carries exact pi; difference ~1e-6, negligible vs the 3.7e-3 effect). Defined here only."""
body = '''
var ss3f_nc_l(vars Price, int P)
{
	var piLit = 314159.0 / 100000;
	var kLit = 1738.0 / 1000;
	var a1 = exp(-piLit / P);
	var b1 = 2.0 * a1 * cos(kLit * PI / P);
	var c1 = a1 * a1;
	var coef2 = b1 + c1;
	var coef3 = -(c1 + b1 * c1);
	var coef4 = c1 * c1;
	var coef1 = 1.0 - coef2 - coef3 - coef4;
	var* Filt = series(Price[0], 4);
	if(Init) {
		Filt[0] = Price[0];
		return Filt[0];
	}
	Filt[0] = coef1 * Price[0] + coef2 * Filt[1] + coef3 * Filt[2] + coef4 * Filt[3];
	return Filt[0];
}'''
[variants.effect]
gain = 3.6844201236e-3
lag = 1.6337814580e-2
flat = 0.0
source = "(b) book-as-printed coefficients (314159/100000 in exp, 1738/1000 * PI_ZORRO in cos) vs ss3_article(20), computed 2026-11-15"

[[variants]]
id = "NCH"
role = "neg_control"
label = "NC-H: the superseded hybrid SuperSmoother3Pole.c vs P=20 book"
kind = "inline"
function = "ss3f_nc_h"
param = 20
expected = "P20"
comment = """NC-H: the real historical copying error. Body = indicators/ehlers/SuperSmoother3Pole.c as of main 5821335
(lines 13-42, comments removed), function renamed only. Before the run Claude Code verifies it against
SuperSmoother3Pole_Hybrid_Superseded.c (diff = name line only) and records that file's git blob hash in Amendment 1.
Real pole a1 (book: a1*a1); input (Price[0]+Price[1])/2 (book: Price). Uses Price[1]: series_len 3 suffices."""
body = '''
var ss3f_nc_h(vars Price, int Period)
{
	var a1 = exp(-PI / Period);
	var b1 = 2.0 * a1 * cos(sqrt(3.0) * PI / Period);
	var c1 = b1 + a1;
	var c2 = -(b1 * a1 + a1 * a1);
	var c3 = a1 * a1 * a1;
	var c0 = (1.0 - c1 - c2 - c3) / 2.0;
	var* Filt = series(Price[0], 4);
	if(Init) {
		Filt[0] = Price[0];
		return Filt[0];
	}
	Filt[0] = c0 * (Price[0] + Price[1])
	        + c1 * Filt[1]
	        + c2 * Filt[2]
	        + c3 * Filt[3];
	return Filt[0];
}'''
[variants.effect]
gain = 2.6869021840e-1
lag = 3.6700541500
flat = 0.0
source = "(b) hybrid coefficients (PI_ZORRO) vs ss3_article(20), computed 2026-11-15"

