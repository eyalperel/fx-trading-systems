# SS3_ArticleFidelity.toml -- SuperSmoother 3-pole, SOURCE FIDELITY + IMPLEMENTATION (HARNESS_DESIGN §1, both questions).
# Pre-registration: this file, committed BEFORE the corrected .c is written and BEFORE the generated script is run
# (PROJECT_STATE §2 rule 2). Amendments are dated and appended at the end of the file, never edited in place.
# Format: as specs/SS2_ArticleFidelity.toml (template), plus [corrected_code] and [imp] (new, see decision 4).
# Labels: (a) source states, (b) measured / computed here, (c) inference.
# Ids must not contain '-' (check ids are <prefix>-<variantid>-<check>).
#
# What differs from SS2F:
#   * Source is a book listing (Cybernetic Analysis 2004, Fig. 13.11), not a TASC sidebar.
#   * D1 Amendment 1 (rule 4, 9789fb5) applied: printed 1.738 -> sqrt(3), justified by the book's own Table 13.4.
#   * The current SuperSmoother3Pole.c is a hybrid that matches neither cited source (b, 2026-11-15). It is renamed
#     SuperSmoother3Pole_Hybrid_Superseded.c and a corrected SuperSmoother3Pole.c is written AFTER this file is
#     committed, to the lines pre-registered in [corrected_code]. The hybrid becomes negative control NCH.
#   * No earlier implementation run exists (SS2 had H1), so this run answers the implementation question too:
#     IMP replay check, pass-condition item 6.
#
# Decisions recorded here (planning chat 2026-11-15, user accepted each):
#   0. Source: Cybernetic Analysis ch. 13 Fig. 13.11; 1.738 -> sqrt(3) via D1 Amendment 1 (option ii).
#      .c fix option B: hybrid kept as SuperSmoother3Pole_Hybrid_Superseded.c, corrected file replaces it.
#   1. gain tol 3e-5, lag tol 1e-3 (same as SS2, window re-derived for SS3 below).
#   2. controls NCA, NCB, NCL, NCH, NC1, NC2 with [detect.required] below (10 variants).
#   3. periods/inputs = SS2; O_PEAK observation (INFO).
#   4. IMP replay check as pass-condition item 6, with NCH fire test.

[batch]
name = "SS3_ArticleFidelity"
id_prefix = "SS3F"
indicator = "SuperSmoother3Pole"          # Light-C function called by `param` variants (corrected file)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/SS3_ArticleFidelity.toml (this file)"
script_name = "GEN_SS3F_SuperSmoother3Pole"  # generated Light-C file; the generator never overwrites

[source]
book = "Ehlers, J. F., Cybernetic Analysis for Stocks and Futures, Wiley 2004 (ISBN 978-0-471-46307-8), ch. 13 'Super Smoothers'"
listing = "Figure 13.11 'EasyLanguage Code to Compute the Three-Pole Super Smoother Filter' (pp. 206-207); Figure 13.12 (EFS) uses the same constants"
formula = '''
(a) a1 = expvalue(-3.14159 / Period);
    b1 = 2*a1*Cosine(1.738*180 / Period);       Cosine takes degrees -> cos(1.738*pi/Period) radians
    c1 = a1*a1;
    coef2 = b1 + c1;  coef3 = -(c1 + b1*c1);  coef4 = c1*c1;
    coef1 = 1 - coef2 - coef3 - coef4;
    Filt3 = coef1*Price + coef2*Filt3[1] + coef3*Filt3[2] + coef4*Filt3[3];
    If CurrentBar < 4 then Filt3 = Price;
(a) Book text, p. 205 (paraphrase): Super Smoothers are Butterworth filters with the numerator polynomial deleted
    and replaced by one constant that gives unity gain at zero frequency.
(a) Table 13.4 (p. 210): coefficients C[0], B[1], B[2], B[3] for cutoff periods 2..40.
'''
reference = "analysis/harness/reference.py ss3_article(period): the formula above with the D1 replacements below"
seeding_note = """(b) The book seeds output = Price for CurrentBar < 4; the corrected .c seeds Filt = Price on the INITRUN
call only (same pattern as SuperSmoother2Pole.c). Seeding affects only the start-up transient, excluded by
warmup = 500 bars (transient < 1e-9 within 198 bars at P = 30, slowest pole radius exp(-pi/30) = 0.9006).
Seeding is therefore not tested by this spec; it is not a fidelity claim either way."""

# D1 literal-constant rule (HARNESS_DESIGN §6 + D1 Amendment 1, 9789fb5).
[[literal_replacements]]
literal = "1.738"
exact = 1.7320508075688772
name = "sqrt(3)"
rule = "D1 rule 4 (Amendment 1)"
source = """(a) Fig. 13.11 b1 line (also Fig. 13.12 EFS, Fig. 13.6). 1.738 fails rule 1. Rule 4: the book's own
Table 13.4 is reproduced by the rule-1 form 1.732 within its rounding and rejects 1.738.
(b) Max |coef - Table 13.4| at P = 4, 10, 20, 30, 40:
    1.732 / pi:        4.44e-6, 1.56e-6, 9.20e-7, 2.00e-6, 1.10e-6   (table rounding ~5e-6)
    1.738 / 3.14159:   4.21e-3, 1.43e-3, 4.33e-4, 2.05e-4, 1.18e-4   (>= 29x the rounding)
    sqrt(3) / pi:      3.73e-5, 1.34e-5, 3.94e-6, 2.22e-6, 8.33e-7   (INFO: the table's own 1.732 rounding of sqrt(3))"""

[[literal_replacements]]
literal = "3.14159"
exact = 3.141592653589793
name = "pi"
rule = "D1 rule 1"
source = "(a) Fig. 13.11 a1 line; D1 rule 1. The b1 line carries exact pi via degrees (Cosine(x*180/Period))."

# D1 rule 3: literal-vs-exact difference, INFORMATION ONLY, never PASS/FAIL.
[literal_info]
gain_max = 3.8272e-3
lag_max = 2.4513e-2
source = "(b) 2026-11-15: book as printed (1.738 / 3.14159, exact pi in the degrees cosine) vs ss3_article, P = 10,14,20,30, sine periods 5..100; lag = analytic group delay. ~128x the gain tolerance: the D1 Amendment 1 choice decides PASS/FAIL (see NCL)."

# Pre-registered coefficient and output lines of the corrected indicators/ehlers/SuperSmoother3Pole.c (decision 0/4).
# The .c is written to these lines after this file is committed; a test asserts the .c contains them verbatim
# (whitespace-normalised). reference.ss3_code(period, pi_value=PI_ZORRO) implements exactly these lines.
[corrected_code]
file = "indicators/ehlers/SuperSmoother3Pole.c"
function = "var SuperSmoother3Pole(vars Price, int Period)"
lines = '''
var a1 = exp(-PI / Period);
var b1 = 2.0 * a1 * cos(sqrt(3.0) * PI / Period);
var c1 = a1 * a1;
var coef2 = b1 + c1;
var coef3 = -(c1 + b1 * c1);
var coef4 = c1 * c1;
var coef1 = 1.0 - coef2 - coef3 - coef4;
var* Filt = series(Price[0], 4);
if(Init) {
	Filt[0] = Price[0];
	return Filt[0];
}
Filt[0] = coef1 * Price[0] + coef2 * Filt[1] + coef3 * Filt[2] + coef4 * Filt[3];
return Filt[0];'''
notes = """(b) Decimal literals here (2.0, 3.0, 1.0) are exact in binary; PI is Zorro's macro (float32 3.14159, kept per D3).
Superseded hybrid: renamed to indicators/ehlers/SuperSmoother3Pole_Hybrid_Superseded.c with its function renamed
SuperSmoother3Pole_Hybrid_Superseded and a header stating why (real pole a1 instead of a1*a1; input
(Price[0]+Price[1])/2 instead of Price). Docs to correct when the fix lands: docs/indicators/SuperSmoother_Notes.md:37
('Validated'), docs/sources/NNFX_Sources.md:1063."""

[zorro]
include = "../../indicators/ehlers/SuperSmoother3Pole.c"   # resolved from strategies/tests/
raw_file = "Data/GEN_SS3F_raw.csv"
marker_file = "Data/GEN_SS3F_exit_marker.txt"      # gotchas 9d.4: never fires; NOT a check on the run card
clock_asset = "EUR/USD"                    # bar clock only; clock_close is exported
bar_period = 1440
start_date = 20080101
end_date = 20240101
series_len = 3

[inputs]                    # identical to SS2F / H1 (decision 3)
n_bars = 3000
warmup = 500
level = [11, 10]            # 1.1 = 11/10, built at run time from integers (gotchas 9d.1)
amp = [1, 100]              # 0.01
slope = [1, 10000]          # 0.0001
sine_periods = [5, 10, 20, 40, 100]

[clock]
lo = 0.8
hi = 1.7
source = "(b) h1_check.py CLOCK_LO/CLOCK_HI: EUR/USD D1 closes lie inside; magnitude guard against a wrong asset"

[tolerances.flat]
value = 1e-9
source = "(a) H1 criteria section 5 (unchanged)"
[tolerances.gain]
value = 3e-5
source = """(b)+(c) Decision 1, 2026-11-15, per D2 + Amendment 1. Floor 9.0e-7 (see [floor]) x10 = 9.0e-6 <= 3e-5.
NCA gain effect 1.074e-3 / 3e-5 = 36x >= 10x. Geometric centre of floor..NCA = 3.1e-5. Same value as SS2F."""
[tolerances.lag]
value = 1e-3
source = "(a) H1 default, kept. (b) Floor 7.7e-6 x10 = 7.7e-5 <= 1e-3. Unlike SS2, lag also catches NCA (11.6x): a 3-pole pole error moves group delay more."
[tolerances.x]
value = 1e-12
source = "(a) STEP2_HANDOFF Stage 3 G4 (= h1_check.TOL_X, exported input vs recomputed x[n])"
[tolerances.imp]
value = 1e-9
source = """(c) Decision 4, judgement. On output values (level ~1.1), bars n >= warmup. Double round-off of a stable
3-pole recursion over 3000 bars ~1e-13 and %.15f print resolution 1e-15 (below); a real implementation bug
(series slot, re-seeding, float32) >= 1e-4 (NCH fire test: 4.1e-3). ~1e4 margin each side."""

# D2 floor per quantity: largest known accepted difference, Zorro output vs THIS spec's (book) table.
[floor]
gain = 9.0e-7
lag = 7.7e-6
flat = 2.2e-16
source = """(b) 2026-11-15: Zorro PI gap only = ss3_code(PI_ZORRO) vs ss3_article, max over P = 10,14,20,30 and sine
periods 5..100 (gain per P: 8.99e-7, 7.69e-7, 8.67e-7, 6.40e-7; lag: 2.48e-6, 3.54e-6, 5.10e-6, 7.68e-6).
No table-rounding term (expected values are computed, not tabulated). The Zorro-side implementation residual is
NOT yet measured for SS3 (no earlier run); it is measured by IMP in this run, and pass item 7 guards the floor."""

# Expected tables: from reference.ss3_article (exact sqrt(3), exact pi). Never from the .c file.
