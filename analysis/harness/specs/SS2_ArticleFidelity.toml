[[variants]]
id = "NCA"
role = "neg_control"
label = "NC-A: pole factor c1 +1 in 3rd digit vs P=20 article"
kind = "inline"
function = "ss2f_nc_a"
param = 20
expected = "P20"
comment = """NC-A: realistic copying error (D2 rule 4). Identical to SuperSmoother2Pole.c except c1 gets +1 in
its 3rd significant digit BEFORE b1, c3, c0 are derived (0.8008 -> 0.8018 at P = 20), so DC gain stays 1.
The step 1/1000 equals reference.bump3(c1) at P = 20 (b: c1 = 0.800800, magnitude 1e-1 -> step 1e-3).
Computed from integers at run time, no decimal literal (gotchas 9d.1). Defined here only."""
body = '''
var ss2f_nc_a(vars Price, int P)
{
	var c1 = exp(-sqrt(2.0) * PI / P);
	c1 = c1 + 1.0 / 1000;
	var b1 = 2.0 * c1 * cos(sqrt(2.0) * PI / P);
	var c2 = b1;
	var c3 = -c1 * c1;
	var c0 = (1.0 - b1 + c1 * c1) / 2.0;
	var* Filt = series(Price[0], 3);
	if(Init) {
		Filt[0] = Price[0];
		return Filt[0];
	}
	Filt[0] = c0 * (Price[0] + Price[1]) + c2 * Filt[1] + c3 * Filt[2];
	return Filt[0];
}'''
[variants.effect]       # error vs the P=20 article table (D2 per-control 10x margin, INFO)
gain = 9.712484861833515e-4
lag = 2.758274060994381e-4
flat = 0.0
source = "(b) reference.ss2_code(20, c1_bump=1) vs ss2_article(20), computed 2026-11-09"

[[variants]]
id = "NCB"
role = "neg_control"
label = "NC-B: input weight c0 +1 in 3rd digit vs P=20 article"
kind = "inline"
function = "ss2f_nc_b"
param = 20
expected = "P20"
comment = """NC-B: realistic copying error (D2 rule 4). Identical to SuperSmoother2Pole.c except c0 gets +1 in
its 3rd significant digit AFTER all coefficients are computed (0.039518 -> 0.039618 at P = 20); both input
taps use c0, so DC gain != 1 and the FLAT check must fire (only control that exercises the flat guard).
The step 1/10000 equals reference.bump3(c0) at P = 20 (b: magnitude 1e-2 -> step 1e-4). Defined here only."""
body = '''
var ss2f_nc_b(vars Price, int P)
{
	var c1 = exp(-sqrt(2.0) * PI / P);
	var b1 = 2.0 * c1 * cos(sqrt(2.0) * PI / P);
	var c2 = b1;
	var c3 = -c1 * c1;
	var c0 = (1.0 - b1 + c1 * c1) / 2.0;
	c0 = c0 + 1.0 / 10000;
	var* Filt = series(Price[0], 3);
	if(Init) {
		Filt[0] = Price[0];
		return Filt[0];
	}
	Filt[0] = c0 * (Price[0] + Price[1]) + c2 * Filt[1] + c3 * Filt[2];
	return Filt[0];
}'''
[variants.effect]
gain = 2.5280452274326626e-3
lag = 3.6026351040163718e-6
flat = 2.7835344324704807e-3
source = "(b) reference.ss2_code(20, in_bump=1) vs ss2_article(20); flat = 1.1 x |DC gain - 1|; computed 2026-11-09"

[[variants]]
id = "NC1"
role = "neg_control"
label = "NC1: P=21 vs P=20 article"
kind = "param"
param = 21
expected = "P20"
[variants.effect]
gain = 0.035124677981256625
lag = 0.22331155447401674
flat = 0.0
source = "(b) reference.ss2_code(21) vs ss2_article(20), computed 2026-11-09 (H1 NC1, unchanged definition)"

[[variants]]
id = "NC2"
role = "neg_control"
label = "NC2: cos arg in degrees vs P=20 article"
kind = "inline"
function = "ss2f_ss_deg"
param = 20
expected = "P20"
comment = """NC2: gross units bug (gotchas §2), H1's NC2 unchanged except the function name. Identical to
SuperSmoother2Pole.c except the cos argument is in degrees (sqrt(2)*180/P). Defined here only."""
body = '''
var ss2f_ss_deg(vars Price, int P)
{
	var c1 = exp(-sqrt(2.0) * PI / P);
	var b1 = 2.0 * c1 * cos(sqrt(2.0) * 180.0 / P);
	var c2 = b1;
	var c3 = -c1 * c1;
	var c0 = (1.0 - b1 + c1 * c1) / 2.0;
	var* Filt = series(Price[0], 3);
	if(Init) {
		Filt[0] = Price[0];
		return Filt[0];
	}
	Filt[0] = c0 * (Price[0] + Price[1]) + c2 * Filt[1] + c3 * Filt[2];
	return Filt[0];
}'''
[variants.effect]
gain = 0.17319823217566932
lag = 1.387132267511019
flat = 0.0
source = "(b) reference model, degrees-cosine coefficients (PI_ZORRO in exp) vs ss2_article(20), computed 2026-11-09"

# ----------------------------------------------------------------------------- pass condition
[pass_condition]
text = """SS2 source fidelity PASSES only if ALL of the following hold; any other outcome is FAIL, recorded and
kept (PROJECT_STATE §2 rule 9), and its cause found before anything is changed:
1. All 28 real checks PASS: 4 periods (P10, P14, P20, P30) x 7 checks (flat, 5 sine gains, ramp lag),
   against the article tables above at the tolerances above.
2. Each of the 4 negative controls FAILS, i.e. at least one of its 7 checks FAILs. Required detecting check:
   NCA gain; NCB gain and flat; NC1 gain and lag; NC2 gain and lag. A control that passes = harness broken.
3. No input guard fires (x[n] vs recomputed, tol 1e-12; clock range), no row is ERROR, no NaN / infinite value.
4. No line starting with 'Error' in the Zorro window (gotchas 9d.3).
5. The results file reports the variant count: 4 periods + 4 negative controls = 8 variants.
Interpretation if 1 fails: per HARNESS_DESIGN §1 a FAIL can be a Zorro problem or a copying difference;
the H1 implementation result (run 2 PASS) and observation OX separate the two."""

# ----------------------------------------------------------------------------- observations (INFO only)
[observations]
OX = """Raw-output equality with H1 run 2 (decision 3). Same .c, same inputs, same clock: the four real-variant
output columns of Data/GEN_SS2F_raw.csv must equal those of
analysis/harness/results/H1_SuperSmoother2Pole_20261105_run2.csv (P10, P14, P20, P30) value for value.
Reported as INFO; a mismatch does not change PASS/FAIL but must be explained before the result is accepted."""
O_LIT = "Report [literal_info] (article literals vs exact constants) in the results header. INFO, never PASS/FAIL (D1 rule 3)."
O_MARGIN = "Report the generator's D2 INFO lines (floor x10 vs tolerance; per-control margin) in the results header."

