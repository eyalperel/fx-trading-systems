# SS2_ArticleFidelity.toml -- SuperSmoother 2-pole, SOURCE FIDELITY (HARNESS_DESIGN §1, second question).
# Pre-registration: this file, committed BEFORE the generated script is run (PROJECT_STATE §2 rule 2).
# Amendments are dated and appended at the end of the file, never edited in place.
# Format: STEP2_HANDOFF.md "Stage 3" (same as specs/H1_SuperSmoother2Pole.toml). Read with tomllib.
# Labels: (a) source states, (b) measured / computed here, (c) inference.
# Ids must not contain '-' (check ids are <prefix>-<variantid>-<check>).
#
# What differs from H1 (H1 answered the implementation question only):
#   * Expected values come from the ARTICLE formula (reference.ss2_article, D1 replacements), never
#     from SuperSmoother2Pole.c. A copying error from article to .c would now FAIL.
#   * Gain tolerance 3e-5 (was 1e-4): set per D2 + Amendment 1, decision 2026-11-07 (see [tolerances.gain]).
#   * Negative controls: NC-A, NC-B (realistic 3rd-digit copying errors, D2 rule 4) + H1's NC1, NC2.
#   * Periods and inputs unchanged from H1 (decision 2026-11-07).
#
# Decisions recorded here (planning chat 2026-11-07, user accepted each):
#   1. gain tol 3e-5, lag tol 1e-3.  2. controls NC-A, NC-B, NC1, NC2 (8 variants).
#   3. periods/inputs = H1, plus observation OX (real raw columns equal to H1 run 2).

[batch]
name = "SS2_ArticleFidelity"
id_prefix = "SS2F"
indicator = "SuperSmoother2Pole"          # Light-C function called by `param` variants
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/SS2_ArticleFidelity.toml (this file)"
script_name = "GEN_SS2F_SuperSmoother2Pole"  # generated Light-C file; the generator never overwrites

[source]
article = "Ehlers, J. F., 'The Ultimate Smoother', Technical Analysis of Stocks & Commodities V.42:04 (2024), pp. 8-15"
sidebar = "SuperSmoother Function, In EasyLanguage"
formula = '''
(a) a1 = expvalue(-1.414*3.14159 / Period);
    b1 = 2*a1*Cosine(1.414*180 / Period);      Cosine takes degrees -> cos(1.414*pi/Period) radians
    c2 = b1;  c3 = -a1*a1;  c1 = 1 - c2 - c3;
    If CurrentBar >= 4 Then $SuperSmoother = c1*(Price + Price[1]) / 2 + c2*$SuperSmoother[1] + c3*$SuperSmoother[2];
    If Currentbar < 4 Then $SuperSmoother = Price;
(a) Article text: translated from an analog filter with a maximally flat Butterworth low-pass response.
'''
reference = "analysis/harness/reference.py ss2_article(period): the formula above with the D1 replacements below"
seeding_note = """(b) The article seeds output = Price for CurrentBar < 4; the .c seeds Filt = Price on the INITRUN
call only. Seeding affects only the start-up transient, which is excluded by warmup = 500 bars
(transient decays to < 1e-9 within ~150 bars at P = 30, pole radius 0.86). Seeding is therefore
not tested by this spec; it is not a fidelity claim either way."""

# D1 literal-constant rule (HARNESS_DESIGN §6). Each literal equals a named constant to every printed digit.
[[literal_replacements]]
literal = "1.414"
exact = 1.4142135623730951
name = "sqrt(2)"
source = "(a) TASC V.42:04 SuperSmoother sidebar, both a1 and b1 lines; D1 rule 1 (Butterworth 2-pole uses sqrt(2))"

[[literal_replacements]]
literal = "3.14159"
exact = 3.141592653589793
name = "pi"
source = "(a) TASC V.42:04 SuperSmoother sidebar, a1 line; D1 rule 1. The b1 line carries exact pi via degrees."

# D1 rule 3: literal-vs-exact difference, INFORMATION ONLY, never PASS/FAIL.
[literal_info]
gain_max = 1.0720e-4
lag_max = 1.0161e-3
source = "(b) reference model 2026-11-09: article with literals 1.414 / 3.14159 vs article with sqrt(2) / pi, P = 10,14,20,30, sine periods 5..100. Matches D1 table (1.03e-4..1.08e-4 gain)."

[zorro]
include = "../../indicators/ehlers/SuperSmoother2Pole.c"   # resolved from strategies/tests/
raw_file = "Data/GEN_SS2F_raw.csv"
marker_file = "Data/GEN_SS2F_exit_marker.txt"
clock_asset = "EUR/USD"                    # bar clock only; clock_close is exported
bar_period = 1440
start_date = 20080101
end_date = 20240101
series_len = 3

[inputs]                    # identical to H1 (decision 3)
n_bars = 3000
warmup = 500
level = [11, 10]            # 1.1 = 11/10, built at run time from integers (gotchas 9d.1)
amp = [1, 100]              # 0.01
slope = [1, 10000]          # 0.0001
sine_periods = [5, 10, 20, 40, 100]

[clock]
lo = 0.8
hi = 1.7
source = "(b) h1_check.py CLOCK_LO/CLOCK_HI: EUR/USD D1 closes lie inside; magnitude guard against a wrong asset"

[tolerances.flat]
value = 1e-9
source = "(a) H1 criteria section 5 (unchanged)"
[tolerances.gain]
value = 3e-5
source = """(b)+(c) Set 2026-11-07 per D2 + Amendment 1. Floor 1.45e-6 (see [floor]) x10 = 1.45e-5 <= 3e-5.
NC-A gain effect 9.71e-4 / 3e-5 = 32x >= 10x (at 1e-4 it was 9.7x, under the minimum). 3e-5 is near the
geometric centre of floor..NC-A (~3.8e-5), leaning to detection. The 10x margins are judgement (c, D2)."""
[tolerances.lag]
value = 1e-3
source = "(a) H1 criteria section 5 default, kept 2026-11-07. Floor 6.0e-6 x10 = 6e-5 <= 1e-3. No lag tolerance can catch NC-A at 10x (would need <= 2.8e-5 < floor x10); NC-A is caught by gain (D2 Amendment 1)."
[tolerances.x]
value = 1e-12
source = "(a) STEP2_HANDOFF Stage 3 G4 (= h1_check.TOL_X, exported input vs recomputed x[n])"

# D2 floor per quantity: largest known accepted difference, Zorro output vs THIS spec's (article) table.
[floor]
gain = 1.45e-6
lag = 6.0e-6
flat = 2.2e-16
source = """(b) Bound = observed Zorro vs H1 6-dp table (tool acceptance run 417da02: gain <= 9.8e-7, lag <= 5.5e-6)
+ |H1 table - article table| computed 2026-11-09 (gain <= 4.66e-7, lag <= 4.32e-7). Components: Zorro PI gap
(reference: article vs ss2_code(PI_ZORRO) gain 5.72e-7, lag 5.43e-6) and table rounding. Flat: test_03 DC 2.2e-16."""

# Expected tables: from reference.ss2_article (exact sqrt(2), exact pi). Never from the .c file.
[expected.P10]
flat = 0.0
gains = [0.2241997821, 0.6950591600, 0.9661158676, 0.9970236439, 0.9997853600]
lag = 1.8253214316
source = "(b) analysis/harness/reference.py ss2_article(10), gain_at / ramp_lag, computed 2026-11-09"
[expected.P14]
flat = 0.0
gains = [0.1169645491, 0.4467305971, 0.8942648375, 0.9915574523, 0.9996434302]
lag = 2.7041752714
source = "(b) analysis/harness/reference.py ss2_article(14), gain_at / ramp_lag, computed 2026-11-09"
[expected.P20]
flat = 0.0
gains = [0.0576649840, 0.2384056789, 0.7041735869, 0.9691429181, 0.9990365336]
lag = 4.0386663639
source = "(b) analysis/harness/reference.py ss2_article(20), gain_at / ramp_lag, computed 2026-11-09"
[expected.P30]
flat = 0.0
gains = [0.0256690485, 0.1085511328, 0.4044537895, 0.8706775409, 0.9958105498]
lag = 6.2770730804
source = "(b) analysis/harness/reference.py ss2_article(30), gain_at / ramp_lag, computed 2026-11-09"

