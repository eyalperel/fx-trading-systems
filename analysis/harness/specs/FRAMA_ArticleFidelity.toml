[pass_condition]
text = """FRAMA source fidelity and implementation PASS only if ALL of the following hold; any other outcome is FAIL, recorded and kept
(CLAUDE.md section 4.8), and its cause found before anything is changed:
1. All 98 real checks PASS: 2 variants (FR16, FR32) x 49 checks = trace 37 (every CHECKED (input, column) pair, from row 1 = n >= 0: out on the
   13 inputs (point flat, ramp, s5 .. s100; band rampB, s5B .. s100B) + dim and alpha on the 12 inputs other than point flat) + bound 2 (alpha in
   [exp(-4.6), 1], Dimen <= 2; relative allowance) + hull 1 (out within the running [min x, max x]; absolute 1e-15) + known answers 3 (point ramp
   out = x every row; band ramp lag vs (1 - alpha)/alpha; point flat out = 1.1 every row) + equivariance 6 (s40B, copies sc and of, x out / dim /
   alpha, from row 1). Bounds and hull read every row of every input incl. the copies. The brief expected 49 / 98: no difference. INFO rows
   (info-trace dim / alpha on point flat) are written with result INFO and are not counted.
2. Each of the 6 negative controls (NCE, NCN, NC32, NCT, NCS, NCS2) FAILS on every kind listed in [detect.required]. A control that passes =
   harness broken.
3. No input guard fires (x[n] incl. the band inputs and the copies, and the exported High / Low of the band inputs and band copies (xh_ / xl_),
   vs recomputed, tol 1e-12; clock range), no row is ERROR in ANY variant, no NaN / infinite value.
4. No line starting with 'Error' in the Zorro window (gotchas 9d.3). The EXITRUN marker / EXIT line is NOT a check (gotchas 9d.4: it never fires).
5. The results file reports the variant count: 2 real + 6 negative controls = 8 variants.
6. IMP: every [imp].must_pass replay <= 1e-9 on every CHECKED pair of every input the variant is called on (8 variants), and both
   [imp].must_fail replays exceed it (FR16 vs the NCE model; NCS vs the FR16 model; guard seen to fire). The INFO pairs' IMP residuals (point flat
   dim / alpha) are reported, never PASS / FAIL.
7. Floor guard: for every real variant, max |Zorro - model| <= tolerance / 10 for trace (1e-11), equivariance (1e-11), ramp_exact (1e-13), lag
   (1e-7) and flat (1e-13) (D2 rule 3 floor side). If exceeded, the window is invalid: the result is NOT accepted until explained, even if items
   1-6 hold.
Pre-run (not run-time) conditions, done before the [Test] click and recorded in Amendment 1 (stage 2):
   (i) the corrected FRAMA.c contains [corrected_code].lines and wrapper_lines verbatim (whitespace-normalised, comments stripped);
   (ii) the current FRAMA.c blob (3352fbe04ed691e479564bc63d46ae181334f9bb, last commit 2a5eca5) is recorded and the corrected file differs from it
        only by FR-1 .. FR-8; FRAMA_Superseded.c is the current body with ONLY the input change (priceHigh() / priceLow() -> High[0] / Low[0],
        frama_price -> Price[0]), the function name / signature and frama_ -> fro_;
   (iii) reference.py reproduces this file's conditioning values, floors, effects, [findings] and IMP fire-test numbers to <= 1e-9 relative (an
        absolute 1e-15 for values below 1e-6). Every number is stored at full precision. Each inline control body is checked at run time, not by
        reading: IMP must_pass replays every variant with its own model (pass item 6);
   (iv) generator --lint-only passes on this file (D2 windows ok, every required margin >= 10x; after stage 2 also the two includes resolve and the
        no-static check passes);
   (v) no-static lint: indicators/ehlers/FRAMA.c contains no `static` token (comments excluded); the check is seen to fire on the superseded body
        (2 hits: frama_init, frama_prev; fro_ after stage 2). Recorded here and in the results header (INFO L_NO_STATIC line);
   (vi) the callers of FRAMA (strategies/tests/Test_FRAMA_Laguerre_DSMA.c:87, Test_FRAMA_vs_MAMA.c:39, Test_UltimateChannelBands.c:83; grep, stage
        1 report) pass series((priceHigh() + priceLow())/2), series(priceHigh()), series(priceLow()) and N = 32 (FR-1, FR-2; stage 2); no other
        caller exists;
   (vii) the conditioning classification recomputed by the tooling (checker.conditioning_table: same seed, skip_draws, draw order and bound) equals
        the INFO lists of [expected.FR16.conditioning] and [expected.FR32.conditioning] (checker.conditioning_mismatches = []); a mismatch is a STOP."""


