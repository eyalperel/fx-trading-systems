# FRAMA_ArticleFidelity.toml -- Fractal Adaptive Moving Average (Ehlers, TASC V.23:10 2005, sidebar), SOURCE FIDELITY + IMPLEMENTATION
# (HARNESS_DESIGN section 1, both questions), the SECOND spec of the ADAPTIVE-SMOOTHER family (HARNESS_DESIGN D7; MAMA_ArticleFidelity first).
# Pre-registration: this file, committed BEFORE the corrected FRAMA.c / FRAMA_Superseded.c are written and BEFORE the generated script is run
# (CLAUDE.md section 4.2). Amendments are dated and appended at the end of the file, never edited in place.
# DRAFT of MAF stage 1 (planning chat 2026-11-20; review docs/harness/MAMA_FRAMA_SOURCE_REVIEW.md (b7bdd69) incl. its appendix C-1..C-3 and
# S1..S5, D7, accepted by the user; brief docs/harness/MAF_STAGE1_PROMPT.md). Tooling: the D7 path of generator.py / checker.py
# ([checks].adaptive = true, bars inputs) and the reference models frama_article / frama_superseded (reference.py).
# Labels: (a) source states, (b) measured / computed here, (c) inference. Ids must not contain '-'. Rows are numbered n = 0, 1, ... (0-based):
# "row 1" of the brief / D7 = n 0.
#
# What D7 changes against the oscillator specs (D6), as mapped to FRAMA:
#   * Bars inputs (S5): FRAMACore(Price, High, Low, N, &dim, &alpha) reads High / Low for the dimension and Price for the filter (FR-2). Point
#     bars pass x as Price, High and Low (H = L = x); band bars rampB, s5B .. s100B pass the same x with High = x + h, Low = x - h, h = 2/1000.
#   * The output is a price level: copies sc = 10 x - 9.9 and of = x + 1.1 of s40B (x, High and Low mapped together) are checked for
#     equivariance: out = k out + c, dim and alpha unchanged, from row 1 (C-2: FRAMA maps exactly from n = 0).
#   * Trace of out, dim and alpha from row 1 (n >= 0) against frama_article, start-up included (Filt = Price while CurrentBar < N + 1).
#     Conditioning (D7 rule 3): every pair is checked except dim and alpha on point flat (rounding noise decides whether N3 > 0: C-1), INFO.
#   * Known answers: point ramp out = x on every row (alpha = 1: D < 1 for non-overlapping halves); band ramp lag = (1 - alpha)/alpha with
#     D = log2(4 r1 / r3) (S5); point flat out = 1.1 on every row (Dimen never computed, N3 = 0). Bounds: alpha in [exp(-4.6), 1] and Dimen <= 2
#     with the D6 relative allowance (C-3: rounding puts Dimen 1.8e-15 above 2 on band sines), out within the running [min x, max x] (hull).
#   * Two variants: N = 16 (source default) and N = 32 (the slot configuration, FR-1: callers pass N = 32).
#   * NCS / NCS2 are the REAL superseded file (FRAMA_Superseded.c, stage 2) called as two instances (both T = 8, i.e. N = 16) on every base and
#     band input; they share frama_prev / frama_init (FR-3), i.e. the IIR state. (The brief names one control NCS "called as TWO instances";
#     the second instance is NCS2 here. NCT is the brief's per-instance old start-up control, a different thing.)

[batch]
name = "FRAMA_ArticleFidelity"
id_prefix = "FRA"
indicator = "FRAMACore"                  # Light-C function called by the `param` variants (corrected FRAMA.c, stage 2)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/FRAMA_ArticleFidelity.toml (this file)"
script_name = "GEN_FRA_FRAMA"           # generated Light-C file; the generator never overwrites

[source]
article = "Ehlers, J. F., 'Fractal Adaptive Moving Averages', Technical Analysis of Stocks & Commodities V.23:10 (2005), pp. 81-82; 'FRAMA EasyLanguage code' sidebar, PDF p. 3 (project knowledge `Fractal Adaptive Moving Averages.pdf`). (b) Cybernetic Analysis (2004) does not contain FRAMA."
formula = """
(a) Inputs: Price((H+L)/2), N(16) {N must be an even number}; vars start at 0:
    N3 = (Highest(High, N) - Lowest(Low, N)) / N;
    HH = High; LL = Low; For count = 0 to N/2 - 1: HH = max(HH, High[count]); LL = min(LL, Low[count]);  N1 = (HH - LL) / (N/2);
    HH = High[N/2]; LL = Low[N/2]; For count = N/2 to N - 1: (same);                                     N2 = (HH - LL) / (N/2);
    If N1 > 0 and N2 > 0 and N3 > 0 then Dimen = (Log(N1 + N2) - Log(N3)) / Log(2);
    alpha = ExpValue(-4.6*(Dimen - 1));  If alpha < .01 then alpha = .01;  If alpha > 1 then alpha = 1;
    Filt = alpha*Price + (1 - alpha)*Filt[1];  If CurrentBar < N + 1 then Filt = Price;
(a) N is the FULL window (two equal halves); the dimension uses High and Low, the filter Price. Dimen keeps its previous value (initial 0)
    when N1, N2 or N3 is 0; Filt still updates.
(b) Exported here: out = Filt, dim = Dimen, alpha. D <= 2 always (N1 + N2 <= 4 N3), so alpha >= exp(-4.6) and the .01 floor never binds
    (the article's '0.01 when D = 2' is rounded); the 1.0 ceiling binds whenever D < 1 (point bars).
"""
reference = "analysis/harness/reference.py frama_article(N, k, lo, literals, startup) (simulate_frama: per-instance state, windows padded with the first High / Low (series(), 9d.6), the corrected code's operation order), frama_superseded(Ts, index) (simulate_frama_shared: the old FRAMA.c's shared frama_prev / frama_init over every superseded call in the generator's ACTUAL call order, float32 4.6 / .01, half window T)"
d1 = "(b) D1 rule 2: every literal of the sidebar (4.6, .01, 1, 2) is taken at its decimal value, built from integers at run time; none equals a named constant to every printed digit, so there is no rule-1 / rule-4 replacement and no 'as printed' INFO variant. No trig, no PI."
review_only = "(b) Checked by CODE REVIEW only (S4), not by a run: the source guard's log(0) branch (N1 + N2 = 0 with N3 > 0) is unreachable on these inputs (band bars never have a flat half; point sines / ramp neither); the corrected code cannot reach it at all (Dimen is computed only when N1, N2, N3 > 0). Stage 2's pre-run item (i) asserts the guard lines verbatim."
other_forms = "(c) The source's FRAMA uses (H+L)/2 as Price and the bar's High / Low; with real bars (H > L) D >= 1 always (overlapping ranges). Which N trades better (16 vs 32) is a backtest question (review FR-1)."

# Pre-registered corrected indicators/ehlers/FRAMA.c (FR-1..FR-7; the brief's code block, verbatim). Written in stage 2 AFTER this file is
# committed; a test then asserts it contains these lines verbatim (whitespace-normalised, comments stripped). reference.frama_article
# implements exactly these lines (same operations in the same order; IMP must pass).
[corrected_code]
file = "indicators/ehlers/FRAMA.c"
function = "var FRAMACore(vars Price, vars High, vars Low, int N, var* pDim, var* pAlpha)"
lines = """
    vars fr_n = series(0, 2);      // per-instance CurrentBar (9d.9)
    vars fr_F = series(0, 2);
    vars fr_D = series(0, 2);
    vars fr_A = series(0, 2);
    fr_n[0] = fr_n[1] + 1;
    fr_F[0] = fr_F[1];  fr_D[0] = fr_D[1];  fr_A[0] = fr_A[1];   // EasyLanguage hold (FR-5: Dimen held)
    var fr_k  = 46;  fr_k  = fr_k/10;
    var fr_lo = 1;   fr_lo = fr_lo/100;
    var fr_u  = 1;
    var fr_l2 = 2;   fr_l2 = log(fr_l2);
    int fr_h = N/2;
    int fr_i;
    var fr_HH = High[0];
    var fr_LL = Low[0];
    for(fr_i = 1; fr_i < N; fr_i++) {
        if(High[fr_i] > fr_HH) fr_HH = High[fr_i];
        if(Low[fr_i]  < fr_LL) fr_LL = Low[fr_i];
    }
    var fr_N3 = fr_HH - fr_LL;  fr_N3 = fr_N3/N;
    fr_HH = High[0];  fr_LL = Low[0];
    for(fr_i = 0; fr_i < fr_h; fr_i++) {
        if(High[fr_i] > fr_HH) fr_HH = High[fr_i];
        if(Low[fr_i]  < fr_LL) fr_LL = Low[fr_i];
    }
    var fr_N1 = fr_HH - fr_LL;  fr_N1 = fr_N1/fr_h;
    fr_HH = High[fr_h];  fr_LL = Low[fr_h];
    for(fr_i = fr_h; fr_i < N; fr_i++) {
        if(High[fr_i] > fr_HH) fr_HH = High[fr_i];
        if(Low[fr_i]  < fr_LL) fr_LL = Low[fr_i];
    }
    var fr_N2 = fr_HH - fr_LL;  fr_N2 = fr_N2/fr_h;
    if(fr_N1 > 0 && fr_N2 > 0 && fr_N3 > 0) {
        fr_D[0] = log(fr_N1 + fr_N2) - log(fr_N3);
        fr_D[0] = fr_D[0]/fr_l2;
    }
    var fr_e = fr_D[0] - fr_u;
    fr_e = fr_k*fr_e;
    fr_A[0] = exp(-fr_e);
    if(fr_A[0] < fr_lo) fr_A[0] = fr_lo;
    if(fr_A[0] > fr_u)  fr_A[0] = fr_u;
    fr_F[0] = fr_A[0]*Price[0] + (fr_u - fr_A[0])*fr_F[1];
    if(fr_n[0] < N + 1) fr_F[0] = Price[0];
    *pDim   = fr_D[0];
    *pAlpha = fr_A[0];
    return fr_F[0];"""
wrapper_function = "var FRAMA(vars Price, vars High, vars Low, int N)"
wrapper_lines = """
    var frw_1;
    var frw_2;
    return FRAMACore(Price, High, Low, N, &frw_1, &frw_2);"""
notes = """(b) Changed vs the current .c (blob 3352fbe04ed691e479564bc63d46ae181334f9bb, last commit 2a5eca5; recorded again at pre-run (ii), stage 2):
FR-1 the source convention N = full window (even; callers pass N = 32, keeping the slot configuration); FR-2 Price, High and Low are parameters
(callers pass series((priceHigh() + priceLow())/2), series(priceHigh()), series(priceLow())); FR-3 per-instance state (Filt, Dimen, alpha and a
call counter in series(0, 2), gotchas 9d.9) in place of the shared statics frama_prev / frama_init; FR-4 the source start-up (Filt = Price
while CurrentBar < N + 1) in place of the price seed on the first call; FR-5 the source guard (Dimen held when any of N1, N2, N3 is 0; Filt
always updated) in place of `if(N3 <= 0) return prev` without an N1 / N2 condition; FR-6 4.6 and .01 built from integers; FR-7 dim and alpha
exported through FRAMACore(Price, High, Low, N, &dim, &alpha), FRAMA(Price, High, Low, N) a thin wrapper; FR-8 header (written with the .c).
(b) Every series() call is unconditional and first (gotchas 3.1); no decimal literal (asserted by test_generator_maf); every expression starts
with a variable (gotchas 9d.8). The model follows the same operations in the same order (finding xcheck: identical to the planning chat's
frama_src to the last bit on all 26 inputs x 2 windows).
(c) If any line cannot compile in Light-C (declarations after statements, `&&`, unary minus on a variable `-fr_e`, int division `N/2`), stage 2
stops and reports. (b) Each construct has compiled in a harness run already: `&&` (LaguerreRSI_Superseded.c:25, LRS run 1),
declarations after statements (FisherCore, FSH run 1), unary minus on a variable (Reflex.c:60 `exp(-rx_k*PI/rx_half)`, RFX run 1), int
division of an int parameter (Reflex_Superseded.c:8 `Length / 2`, RFX run 1). (c) `-fr_e` alone as a call argument is not seen yet.
(c) FRAMACore reads Price[0] and High / Low [0..N-1]: the caller's series must hold >= N values ([zorro].series_len = 34 >= 33; stage 2 says so
in the header).
Superseded file (stage 2): the CURRENT FRAMA.c body as indicators/ehlers/FRAMA_Superseded.c, `FRAMA_Superseded(vars Price, vars High, vars Low,
int T)`; the ONLY behavioural edit is the input: priceHigh() / priceLow() -> High[0] / Low[0] (its own series of them are kept) and frama_price
-> Price[0]; prefix frama_ -> fro_. It is the shared-state control NCS / NCS2."""

[zorro]
include = ["../../indicators/ehlers/FRAMA_Superseded.c", "../../indicators/ehlers/FRAMA.c"]   # resolved from strategies/tests/; FRAMA_Superseded.c is written in stage 2 (lint reports it missing until then); the current FRAMA.c exists but has no FRAMACore and still has its statics
raw_file = "Data/GEN_FRA_raw.csv"
marker_file = "Data/GEN_FRA_exit_marker.txt"       # gotchas 9d.4: never fires; NOT a check on the run card
clock_asset = "EUR/USD"
bar_period = 1440
start_date = 20080101
end_date = 20240101
series_len = 34           # (c) brief: High / Low [0..N-1] with N up to 32 (FR32) and 18 (NCN): >= 33, made 34

[inputs]
n_bars = 3000
warmup = 0                # D7 rule 2: no W cut; every check reads rows n >= 0 (trace from row 1)
level = [11, 10]          # 1.1, built at run time from integers (gotchas 9d.1)
amp = [1, 100]            # 0.01
slope = [1, 10000]        # 0.0001
sine_periods = [5, 10, 20, 40, 100]
band_half = [2, 1000]     # S5: h = 0.002, built at run time
band_inputs = ["ramp", "s5", "s10", "s20", "s40", "s100"]  # band copies rampB, s5B .. s100B (High = x + h, Low = x - h)

[inputs.equivariance]     # D7 rule 5: affine copies of s40B only (brief): sc = 10 x - 9.9, of = x + 1.1; High / Low mapped the same way
inputs = ["s40B"]
transforms = [{ id = "sc", scale = [10, 1], offset = [-99, 10] }, { id = "of", scale = [1, 1], offset = [11, 10] }]

[clock]
lo = 0.8
hi = 1.7
source = "(b) h1_check.py CLOCK_LO/CLOCK_HI: EUR/USD D1 closes lie inside; magnitude guard against a wrong asset"

[checks]                  # HARNESS_DESIGN D7 (rules 1-8) as mapped here
adaptive = true
bars = true                                          # calls pass (Price, High, Low)
columns = ["out", "dim", "alpha"]
level_columns = ["out"]                              # equivariance: copy out = k out + c; dim / alpha: copy = base
equivariance_from_n = 0                              # C-2: FRAMA maps from row 1
hull = ["out"]                                       # out within the running [min x, max x] every row (convex combination)
ramp_exact = { out = "ramp" }                        # point ramp: out = x on every row (alpha = 1)
ramp_lag = { out = "rampB" }                         # band ramp: lag vs the expected table's ramp_lag (S5)
flat = ["out"]                                       # point flat: out = 1.1 on every row
source = """(a)/(b) D7 mapped to FRAMA: rule 1 out, dim and alpha exported (FR-7); rule 2 trace of every column from row 1 (n >= 0) against
frama_article, start-up included; rule 3 per (input, column) classification ([conditioning]; INFO pairs written as info-trace rows); rule 4
bounds from the expected tables (alpha in [exp(-4.6), 1], Dimen <= 2) and the hull, every row of every input incl. the copies; rule 5
equivariance on s40B, copies sc and of, from row 1; rule 6 known answers: point ramp out = x (ramp_exact), band ramp lag (lag), point flat
out = level (flat); rule 7 NCS / NCS2; rule 8 no linear checks (the band ramp lag is a known answer of the source formula, (1 - a)/a for
the constant alpha the band ramp gives, not a v1 linear check)."""

[conditioning]            # D7 rule 3, the pre-run classifier (checker.conditioning_table), deterministic
seed = 20261120
draws = 5
skip_draws = 70
order = ["flat", "ramp", "s5", "s10", "s20", "s40", "s100", "rampB", "s5B", "s10B", "s20B", "s40B", "s100B"]
bound = { out = 1e-11, dim = 1e-11, alpha = 1e-11 }
source = """(b) S2: bound = trace tolerance / 10. One numpy default_rng(20261120); skip_draws = 70: the planning chat's script drew the MAMA
classification first from the same generator (2 variants x 7 inputs x 5 draws of 3000 integers), so 70 draws are consumed before FRAMA's to
reproduce its table 1 to the last digit; then per real expected table (FR16, then FR32), per input in `order` (point, then band: the
planning chat's order), and then per table the copies (sc40B, of40B): 5 perturbations x(1 + 2^-52 u), u = rng.integers(-1, 2, 3000), and the
max over ALL rows of |column(perturbed) - column(x)| of the MODEL (reference.frama_article). Band inputs: High / Low = y +- h built from the
perturbed y (as the planning chat); a copy of a band input with h x 10 (sc) / h (of). A pair above its bound is INFO. A recomputed
classification that differs from the lists below is a pre-run STOP (pass condition, pre-run (vii))."""

[tolerances.x]
value = 1e-12
source = "(a) STEP2_HANDOFF Stage 3 G4 (= h1_check.TOL_X). Covers the band inputs' exported High / Low (xh_ / xl_ columns) and the copies."
[tolerances.trace]
value = 1e-10
source = "(c) S2 (user, 2026-11-20): FRAMA trace 1e-10 (out, dim, alpha). Every checked (input, column) pair, every row n >= 0. Window: [floor] x10 <= tolerance (D2 rule 3); NC32 (the smallest control) >= 10x."
[tolerances.bound]
value = 1e-12
source = "(c) D6 default: RELATIVE allowance |bound| x 1e-12 on alpha in [exp(-4.6), 1] (both sides) and Dimen <= 2 (C-3: Dimen 2.0000000000000018 on band sines; alpha 0.010051835744633504, 8.2e-15 relative below exp(-4.6))."
[tolerances.hull]
value = 1e-15
source = "(c) Brief: ABSOLUTE 1e-15 on out within the running [min x, max x] of its own input (every row, every input incl. the copies). (b) The model gives 0 ([findings] hull_excess_model_*). (c) Zorro's out is printed with 15 decimals (<= 5e-16) and Zorro's x may differ from numpy's by an ulp of sin (2.2e-16 at 1.1): about 7e-16 of the 1e-15 is accounted for."
[tolerances.equivariance]
value = 1e-10
source = "(c) Brief: as the trace (1e-10), from row 1. Zorro-internal, no model. (b) Model floor [floor].equivariance."
[tolerances.ramp_exact]
value = 1e-12
source = "(c) Brief: point ramp out = x on every row (the model gives exactly 0, finding point_ramp_out_minus_x_*)."
[tolerances.lag]
value = 1e-06
source = "(c) Brief: band ramp lag (mean (x - out)/slope over the last 100 rows) vs (1 - alpha)/alpha of the analytic D = log2(4 r1/r3); (b) the model's own residual is the floor ([floor].lag, 1.3e-11: convergence of alpha^n plus rounding)."
[tolerances.flat]
value = 1e-12
source = "(c) Brief: point flat out = 1.1 on every row (the model gives exactly 0 difference: Dimen never computed, start-up then alpha = 1)."
[tolerances.imp]
value = 1e-09
source = "(c) As every earlier spec (1e-9). On the CHECKED (input, column) pairs only; INFO pairs (point flat dim / alpha) are reported (rule 3). (b) Expected residual: [floor] imp estimate (the %.15f rounding of the exported x, High, Low through the model)."

[lint]
no_static = ["indicators/ehlers/FRAMA.c"]
source = "(b) As LRSI / FSH: the corrected FRAMA.c must contain no `static` token (comments and strings excluded): the structural check for FR-3. generator.lint_no_static; seen to fire on the current body (2 hits, frama_init and frama_prev: test_generator_maf). Until stage 2 the current file has the statics: lint reports it, as it reports the missing FRAMA_Superseded.c include."

# D2 floor per quantity (see source).
[floor]
trace = 1.93345339738471e-12
equivariance = 6.38378239159465e-14
lag = 1.3002932064409833e-11
ramp_exact = 0.0
flat = 0.0
imp_estimate = 1.93345339738471e-12
source = """(b) 2026-11-20, tests/maf_support.numbers(). trace = the largest of the conditioning values on the checked pairs and the IMP estimate (the model on x, High, Low printed with %.15f vs exact: brief item 4, FR16 s100 alpha 1.933e-12); x10 = 1.9e-11 <= 1e-10 (window holds). equivariance = the model's own residual on s40B from row 1 (brief item 7). lag = |model band ramp lag - (1 - a)/a| (1.3e-11: alpha^n convergence and rounding). ramp_exact, flat: the model gives exactly 0. No trig, no PI. (c) Zorro vs the model is expected at rounding level; pass item 7 guards the run value."""


