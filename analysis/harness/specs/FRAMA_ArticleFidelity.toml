source = "(b) Each listed kind has a detection ratio (max abs_diff / row tolerance on the own-model raw file) >= 10. Ratios: NCE trace 7.99e+06x, bound 5.16e+09x, lag 2.72e+05x; NCN trace 1.58e+10x, lag 3.25e+06x; NC32 trace 76.3x; NCT trace 1e+10x, bound 1e+12x; NCS trace 2.97e+09x, hull 2.87e+14x, lag 3.41e+07x, flat 2.3e+11x; NCS2 trace 2.97e+09x, hull 2.87e+14x, lag 3.41e+07x, flat 2.3e+11x. Non-zero kinds below 10x, not required: NCN bound 0.0019x; NC32 bound 0.000888x, lag 2.58x; NCT lag 1.3e-05x. NCT bound (>= 10x) is INFO only, not required (planning-chat review 2026-11-20): it comes from the body's alpha held at the initial 0 where N3 <= 0 (n = 0 of every input, every point flat row); the old file has no alpha output, so the held 0 is our construction, not old-file behaviour. NCT is required on trace."
rule = "A kind is detected for a control if at least one of that control's checks of that kind (trace-* | bound-* | hull | equiv-* | exact-* | ramp-lag-* | flat-*) has result FAIL. Every listed kind must be detected; otherwise the control counts as NOT failing as required and the run is FAIL."
[detect.required]
NCE = ["trace", "bound", "lag"]
NCN = ["trace", "lag"]
NC32 = ["trace"]
NCT = ["trace"]
NCS = ["trace", "hull", "lag", "flat"]
NCS2 = ["trace", "hull", "lag", "flat"]
[detect.info_only]   # kinds >= 10x reported as INFO, deliberately not required (see [detect].source)
NCT = ["bound"]


# ----------------------------------------------------------------------------- IMP
[imp]
what = """Implementation check (HARNESS_DESIGN section 1, first question). Replay the model named per variant on the x, High and Low columns
EXPORTED by Zorro (x_, and xh_ / xl_ for the band inputs and band copies; reference.IMP_MODELS); residual per (input, column) = max |Zorro -
replay| over every row n >= 0, on every input the variant is called on (point flat, s5 .. s100, ramp; band rampB, s5B .. s100B; FR16 / FR32
also the copies sc40B, of40B). The INFO pairs of the expected table (point flat dim / alpha, rule 3) are reported separately (trailer line
IMP_INFO) and never decide PASS/FAIL; on the checked pairs residual / 1e-9 decides. NCS / NCS2 are replayed with frama_superseded: the old file
over ALL superseded calls in the generator's ACTUAL call order (checker.adaptive_shared_slots: NCS on the 13 inputs, then NCS2)."""
tolerance = "[tolerances.imp] 1e-9"
must_pass = { FR16 = "frama_article(16)", FR32 = "frama_article(32)", NCE = "frama_article(16,k=461/100)", NCN = "frama_article(18)", NC32 = "frama_article(16,literals=float32)", NCT = "frama_article(16,startup=old)", NCS = "frama_superseded(8,8)[0]", NCS2 = "frama_superseded(8,8)[1]" }
must_fail = { FR16 = "frama_article(16,k=461/100)", NCS = "frama_article(16)" }
diagnosis = """FIDELITY PASS + IMP PASS: verified on both questions. FIDELITY FAIL + IMP PASS: copying difference (.c lines vs the source). IMP FAIL on
any real variant: Zorro / implementation problem; the fidelity result is not interpretable. FR16 must_fail = the NCE model is absent from the run
output; NCS must_fail = the superseded calls do not behave as the source."""

