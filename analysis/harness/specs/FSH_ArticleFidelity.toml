[run_notes]
rerun = "(b)/(c) Restart Zorro before any rerun of the generated script: the superseded file's statics ft_Value1 / ft_Fish (fto_ after stage 2) persist across [Test] presses of a loaded script and the generated script returns at INITRUN before any indicator call, so the file's own INITRUN resets never run; a second press would start NCS / NCT from the first run's last state (as RFX A2.4 / LRS A1.3)."

