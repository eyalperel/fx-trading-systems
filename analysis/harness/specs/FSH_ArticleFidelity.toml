# FSH_ArticleFidelity.toml -- Fisher Transform (Ehlers, TASC V.20:11 2002, Fig. 5), SOURCE FIDELITY + IMPLEMENTATION (HARNESS_DESIGN section 1, both
# questions), the FOURTH spec of the OSCILLATOR family (HARNESS_DESIGN D6; RFX, MST, LRSI before it).
# Pre-registration: this file, committed BEFORE the corrected FisherTransform.c / FisherTransform_Superseded.c are written and BEFORE the generated script
# is run (CLAUDE.md section 4.2). Amendments are dated and appended at the end of the file, never edited in place.
# DRAFT of FSH stage 1 (planning chat 2026-11-19; source A and decisions F-1..F-9 of docs/harness/FISHER_SOURCE_REVIEW.md (bdc83da) and D6 accepted by the
# user; brief docs/harness/FISHER_STAGE1_PROMPT.md), built on the RFX / MST / LRSI oscillator tooling plus (this branch): five columns per call
# (raw / v1 / rng / trig by out-parameter, out returned), NO linear stage ([checks].linear_stage = false, F-7), trace replay on several outputs with
# per-output gates on the MODEL (range; range + clamp distance), one bound per output, ramp_exact per output (a number or the model), the new kinds
# `trigger` (trig[n] == out[n-1] exactly) and `flat_zero`, and the Fisher reference models fisher_article / fisher_superseded.
# Format: as specs/LRSI_ArticleFidelity.toml. Labels: (a) source states, (b) measured / computed here, (c) inference.
# Ids must not contain '-' (check ids are <prefix>-<variantid>-<check>).
#
# What differs from LRSI:
#   * No linear stage (F-7): the normalisation divides by the window range, so there are no v1 gain / phase / lag checks; every check reads the exported
#     stages raw (the normalised price, [-1, 1]), v1 (the smoothed and clamped Value1) and out (Fish). rng (MaxH - MinL) is exported for IMP and
#     information only; trig (Fish[1]) for the trigger check.
#   * Trace replay on raw, v1 and out, rows >= W, each on the rows the MODEL's gates let in: raw the range gate (range/amplitude >= 0.01, D6 default);
#     v1 and out also the clamp-distance gate (min |pre-clamp v1 -/+ .99| >= 1e-6, judgement (c)): a rounding flip of the clamp moves Fish by
#     atanh(.999) - atanh(.99) = 1.1535487548879537. Expected gated rows on a correct variant: 0 (finding gate_*).
#   * Trace tolerance 1e-9, not the D6 default 3e-5: no PI gap, floor <= ~1e-11 ([floor]); 3e-5 would leave NC32 (the current file's float32 literals,
#     F-3, effect 1.288e-05) undetectable, so F-3 would be unverified.
#   * Three exact bounds: raw in [-1, 1], v1 in [-.999, .999] (two-sided, absolute allowance), |out| <= ln(1999) (one-sided, relative allowance).
#     (b) In float64, Fish reaches ln(1999) EXACTLY on the ramps (finding out_max_abs_all_*): the allowance is not needed there, but the bound is
#     attained, not only approached (the review's "never attained exactly" holds for the real number, not for its float64 rounding).
#   * Known answers: ramps raw = +-1 and v1 = +-.999 exactly, out = the model (rows >= W); flat raw = v1 = out = 0 (our guard, F-4; flat_zero).
#   * Start-up is not defined by the source (F-5): INFO only (D6 rule 6), the info-startup row.
#   * No NCL "as printed" variant (D1): every literal of Fig. 5 is taken at its decimal value (D1 rule 2) and none equals a named constant, so there is no
#     rule-1 / rule-4 replacement whose printed form could differ. NOTE: the control id `NCL` in THIS spec is the window Len + 1 control (brief naming),
#     not the "literals as printed" INFO variant of the SS3 / USE / RFX / MST specs.
#   * NCS / NCT are the REAL superseded file (FisherTransform_Superseded.c, written in stage 2) called as TWO instances (both Len 10) on every base input.
#     The file statics ft_Value1 / ft_Fish are the IIR state itself, shared by all 16 calls of every bar: the effect is large on every input and every
#     row (unlike LRS, where the shared state was a one-shot seed), so no skip_inputs is needed.

[batch]
name = "FSH_ArticleFidelity"
id_prefix = "FSH"
indicator = "FisherCore"                 # Light-C function called by the `param` variants (corrected FisherTransform.c, stage 2)
asset_label = "synthetic (EURUSD D1 bar clock)"
prereg = "analysis/harness/specs/FSH_ArticleFidelity.toml (this file)"
script_name = "GEN_FSH_FisherTransform"  # generated Light-C file; the generator never overwrites

[source]
article = "Ehlers, J. F., 'Using The Fisher Transform', Technical Analysis of Stocks & Commodities V.20:11 (2002), pp. 40-42; Fig. 5 'EasyLanguage code', p. 41 (source A, the reference). INFO variant NCB: Ehlers, Cybernetic Analysis for Stocks and Futures (Wiley 2004), ch. 1, Fig. 1.7, p. 7 (source B)"
formula = """
(a) Inputs: Price((H+L)/2), Len(10);   Vars: MaxH(0), MinL(0), Fish(0);
    MaxH = Highest(Price, Len);  MinL = Lowest(Price, Len);
    Value1 = .33*2*((Price - MinL)/(MaxH - MinL) - .5) + .67*Value1[1];
    If Value1 > .99 then Value1 = .999;
    If Value1 < -.99 then Value1 = -.999;
    Fish = .5*Log((1 + Value1)/(1 - Value1)) + .5*Fish[1];
    Plot1(Fish, "Fisher"); Plot2(Fish[1], "Trigger");
(a) Value1 and Fish start at 0 (Value1 is an EasyLanguage built-in, Fish(0)); no start-up rule (F-5). The source does not guard MaxH = MinL (division by zero).
(b) Exported here: raw = 2*((Price - MinL)/(MaxH - MinL) - .5) (0 when MaxH - MinL is not > 0: OUR guard, F-4), v1 = Value1 after the clamp, rng = MaxH - MinL,
    trig = Fish[1], out = Fish. Bounds: raw in [-1, 1]; |v1| <= .999 and no v1 in (.99, .999); |out| < ln(1999) = 2*atanh(.999) (real numbers).
(b) Source B (Fig. 1.7): .5 / .5 EMA, clamp .9999 / .9999, log gain .25 (the INFO variant NCB).
"""
reference = "analysis/harness/reference.py fisher_article(L, a, b, thr, cl, k, literals) (simulate_fisher; per-instance state, window padded with x[0]), fisher_superseded(Ls, index) (simulate_fisher_shared: the old file's shared statics in the generator's actual call order, float32 literals)"
other_forms = "(a) Not tested here: the source's use (Fish / Trigger crossover, p. 41) is a strategy matter. (a) Source B's EFS form (Fig. 1.8) starts its window from the bar's own High / Low (F-6): recorded only. Start-up conventions (F-5): INFO."
no_ncl = "(b) No NCL 'as printed' variant (brief): every literal of Fig. 5 (.33, .67, .99, .999, .5) is taken at its decimal value (D1 rule 2) and none equals a named constant, so no rule-1 / rule-4 replacement exists. The control id NCL in this spec is the window Len + 1 control."

# Pre-registered lines of the corrected indicators/ehlers/FisherTransform.c (F-1, F-2, F-3, F-4 kept, F-7). The .c is written to these lines AFTER this file
# is committed (stage 2); a test then asserts it contains them verbatim (whitespace-normalised, comments stripped). reference.fisher_article(L) implements
# exactly these lines (same operations in the same order: IMP must pass at 1e-9).
[corrected_code]
file = "indicators/ehlers/FisherTransform.c"
function = "var FisherCore(vars Price, int Len, var* pRaw, var* pV1, var* pRng, var* pTrig)"
lines = """
vars fi_V = series(0, 2);
vars fi_F = series(0, 2);
var fi_a = 33;   fi_a = fi_a/100;
var fi_b = 67;   fi_b = fi_b/100;
var fi_t = 99;   fi_t = fi_t/100;
var fi_c = 999;  fi_c = fi_c/1000;
var fi_h = 1;    fi_h = fi_h/2;
var fi_hi = MaxVal(Price, Len);
var fi_lo = MinVal(Price, Len);
var fi_rng = fi_hi - fi_lo;
var fi_raw = 0;
if(fi_rng > 0) {
    fi_raw = Price[0] - fi_lo;
    fi_raw = fi_raw/fi_rng;
    fi_raw = fi_raw - fi_h;
    fi_raw = fi_raw*2;
}
fi_V[0] = fi_a*fi_raw + fi_b*fi_V[1];
var fi_nt = 0;   fi_nt = fi_nt - fi_t;
var fi_nc = 0;   fi_nc = fi_nc - fi_c;
if(fi_V[0] > fi_t)  fi_V[0] = fi_c;
if(fi_V[0] < fi_nt) fi_V[0] = fi_nc;
var fi_u = 1;
var fi_num = fi_u + fi_V[0];
var fi_den = fi_u - fi_V[0];
fi_F[0] = fi_h*log(fi_num/fi_den) + fi_h*fi_F[1];
*pRaw  = fi_raw;
*pV1   = fi_V[0];
*pRng  = fi_rng;
*pTrig = fi_F[1];
return fi_F[0];"""
wrapper_function = "var FisherTransform(vars Price, int Len)"
wrapper_lines = """
var fi_w1;
var fi_w2;
var fi_w3;
var fi_w4;
return FisherCore(Price, Len, &fi_w1, &fi_w2, &fi_w3, &fi_w4);"""
notes = """(b) Changed vs the current .c (blob 259954ed90f4674733f41c46b6694c5f1320cfd0 at bdc83da, recorded again at pre-run (ii), stage 2): F-1 per-instance state, Value1 and Fish in series(0, 2) (zero start = the source's Value1(0) / Fish(0)), the trigger is the out-parameter pTrig = Fish[1] (the global ft_Trigger and both statics removed); F-2 Price is a parameter (callers pass series((priceHigh() + priceLow())/2)); F-3 every constant built from integers at run time (.33 = 33/100, .67 = 67/100, .99 = 99/100, .999 = 999/1000, .5 = 1/2); F-4 the zero-range guard kept (raw = 0, ours, labelled in the header); F-7 the stages exported through FisherCore(Price, Len, &raw, &v1, &rng, &trig), FisherTransform(Price, Len) a thin wrapper; F-8 header with source and page, formula, deviations fixed, the review path and labelled claims (written with the .c).
(b) Every expression starts with a variable (gotchas 9d.8; `fi_raw*2` is variable-first) and there is no decimal literal at all (asserted by test_generator_fsh). The model computes raw as 2*((x - lo)/rng - .5); the code's step order (x - lo, /rng, - 1/2, *2) is the same arithmetic in the same order.
(c) Both series() calls are unconditional and first (gotchas 3.1); the zero start is each series(0, 2)'s initial history on the instance's first call (gotchas 9d.6). The `*pRaw = ...` out-parameters compile in Light-C (same pattern as ReflexCore / MESAStochasticCore / LaguerreRSICore: RFX / MST / LRS run 1 PASS); `int Len` as a parameter compiles (CLAUDE.md section 6, H1 run 2). If any line cannot compile, stage 2 stops and reports.
(c) MaxVal / MinVal(Price, Len) read Price[0..Len-1]: the caller's series must hold at least Len values (here [zorro].series_len = 21 >= 20, the largest Len). Stage 2 should say so in the header (default series() length = LookBack, c).
Superseded file (stage 2): the CURRENT FisherTransform.c body as indicators/ehlers/FisherTransform_Superseded.c, function `FisherTransform_Superseded(vars Price, int Period)`; the ONLY behavioural edit is the input (line 42's series((priceHigh() + priceLow()) * 0.5) replaced by the Price parameter); statics, literals, guard, clamp and the trigger global unchanged; ft_ -> fto_ (flat namespace, gotchas 1.3). It is the shared-state control NCS / NCT."""


[zorro]
include = ["../../indicators/ehlers/FisherTransform_Superseded.c", "../../indicators/ehlers/FisherTransform.c"]   # resolved from strategies/tests/; both written in stage 2 (lint reports FisherTransform_Superseded.c missing until then; the current FisherTransform.c exists but has no FisherCore and still has its two statics)
raw_file = "Data/GEN_FSH_raw.csv"
marker_file = "Data/GEN_FSH_exit_marker.txt"       # gotchas 9d.4: never fires; NOT a check on the run card
clock_asset = "EUR/USD"
bar_period = 1440
start_date = 20080101
end_date = 20240101
series_len = 21           # (c) MaxVal / MinVal(Price, Len) read Price[0..Len-1] of the INPUT series: it must hold >= 20 values (FR20); 21 covers NCL (11) and FR20. The older specs use 3 (their indicators keep their own histories).

[inputs]                    # as LRSI, without the alternating input (no linear stage reads it)
n_bars = 3000
warmup = 700              # (b) W = 700 (D6 family default): start-up memory .67^n < 1e-12 from n = 69, .5^n from n = 40, plus the Len window; the EFS-style start-up differs until row <= 80 ([findings] startup_efs_last_row_*): 700 = 8.6x
level = [11, 10]            # 1.1, built at run time from integers (gotchas 9d.1)
amp = [1, 100]              # 0.01
slope = [1, 10000]          # 0.0001
sine_periods = [5, 10, 20, 40, 100]
ramp_down = true            # extra input id `rampdn`: level - slope*n, right after ramp (known answers raw = -1, v1 = -.999)

[inputs.invariance]         # D6 rule 4: transformed copies of every sine, fed to every variant with invariance = true
transforms = [{ id = "sc", level = [11, 10], amp = [1, 10] }, { id = "of", level = [22, 10], amp = [1, 100] }]   # scale x10 (amp 0.1, level 1.1) and offset (level 2.2, amp 0.01)

[clock]
lo = 0.8
hi = 1.7
source = "(b) h1_check.py CLOCK_LO/CLOCK_HI: EUR/USD D1 closes lie inside; magnitude guard against a wrong asset"

[checks]                    # HARNESS_DESIGN D6 + this spec's notes
linear_stage = false        # F-7: no linear front end from price (the normalisation divides by the range): no v1 checks, no linear output
trace_gate = 0.01           # g: range/amplitude of the MODEL (D6 default), applies to raw, v1 and out
clamp_gate = 1e-06          # g2: min |pre-clamp v1 -/+ .99| of the MODEL, applies to v1 and out (judgement (c))
trace_outputs = { raw = ["range"], v1 = ["range", "clamp"], out = ["range", "clamp"] }
bounds = { raw = [-1.0, 1.0], v1 = [-0.999, 0.999], out = 7.6004023345004 }   # out: ln(1999) = 7.6004023345004 (repr of math.log(1999)), one-sided |out| <= ln(1999) with the relative allowance
ramp_exact_outputs = { raw = { ramp = 1.0, rampdn = -1.0 }, v1 = { ramp = 0.999, rampdn = -0.999 }, out = { ramp = "model", rampdn = "model" } }
trigger = true              # trig[n] == out[n-1] exactly, n >= 1, every base input (Zorro-internal)
flat_zero = ["raw", "v1", "out"]
source = """(b) Gates (D6 rule 2, both on the MODEL, never the run): range/amplitude min 0.048943483704833035 (FR10, T = 100), 4.9x the gate g = 0.01; clamp distance min 0.0007121303005288571 (FR20, T = 100), 712x g2 = 1e-6 ([findings] gate_*): no gated row on a correct variant; gated rows are counted in the input text; every row of a sine gated = ERROR. g2 (c): judgement; rounding at ~1e-15 cannot flip a clamp more than 1e-6 away, a copying error of the clamp (NCC) or the weights (NCW) is not hidden by it. bounds (b): raw is the position of x inside its own window, exactly in [-1, 1] (0 on the guard); v1 is clamped to +-.999 (= 999/1000 built at run time; the pre-clamp maximum .33 + .67 x .999 = 0.99933); |out| <= 2 atanh(.999) = ln(1999) (geometric sum of the .5 feedback). ramp_exact (b): on the rising / falling ramp x is the window max / min from row 1, so raw = +-1 exactly (rows >= 1) and v1 = +-.999 exactly from row 12; out converges to +-ln(1999) geometrically and is EXACTLY ln(1999) in float64 on rows >= W (finding ramp_out_minus_ln1999_*: 0.0); it is compared with the model (brief) and the input text reports max |out|. trigger (b): the corrected code returns trig = Fish[1] by construction; a one-row shift or a stale global fails it. flat_zero (b): on flat the guard fires on every row (rng = 0 exactly) and raw = v1 = out = 0 (F-4: an implementation known answer, not a source check)."""


[tolerances.x]
value = 1e-12
source = "(a) STEP2_HANDOFF Stage 3 G4 (= h1_check.TOL_X, exported input vs recomputed x[n]). Covers rampdn and the invariance copies."
[tolerances.trace]
value = 1e-09
source = "(c) Brief (planning chat 2026-11-19), NOT the D6 default 3e-5: no PI gap and the floor is rounding ([floor].trace, x10 within 1e-9); 3e-5 would leave NC32 (float32 literals, F-3, effect 1.288e-05) undetectable. Applies to raw, v1 and out, rows >= W, gated (see [checks])."
[tolerances.bound]
value = 1e-12
source = "(c) D6 default. ABSOLUTE allowance on the two-sided bounds of raw ([-1, 1]) and v1 ([-.999, .999]); RELATIVE allowance (ln(1999) x 1e-12) on the one-sided |out| <= ln(1999). Every row of every input of that output."
[tolerances.invariance]
value = 1e-09
source = "(c) D6 rule 4 default: max |out(sine) - out(transformed sine)| over the gated rows >= W (the out gates), five sines, transforms sc (amp x10) and of (level 2.2). (b) float64 floor 5.3e-12 ([findings] invariance_*), x10 = 5.3e-11. Zorro-internal comparison, no model."
[tolerances.ramp_exact]
value = 1e-12
source = "(c) LRSI kind, per output here: raw = +-1 and v1 = +-.999 (absolute), out vs the model, rows >= W; (b) the model gives raw / v1 exactly and out = ln(1999) exactly (findings ramp_*): 1e-12 is a few-ulp allowance."
[tolerances.trigger]
value = 0.0
source = "(b) Exact by construction: the corrected code exports trig = Fish[1] of the same series, so trig[n] must equal out[n-1] bit for bit (n >= 1). Zorro-internal, no model; 0 tolerance (brief)."
[tolerances.flat_zero]
value = 1e-12
source = "(c) Brief: raw, v1 and out on flat must be 0 (the model gives exactly 0 on all 3000 rows, finding flat_*); 1e-12 absolute, every row n >= 0."
[tolerances.imp]
value = 1e-09
source = "(c) As HPF / SS3F / RFF / USE / RFX / MST / LRS. Applies to every exported output: raw / v1 / out on the sines and copies on the rows the replay's own gates let in, everything else absolutely ([imp].what). (b) Expected residual: [floor].imp_exported_x_* (export rounding of x divided by the range); fire tests [imp.fire_test]."

[lint]
no_static = ["indicators/ehlers/FisherTransform.c"]
source = "(b) As LRSI Amendment 1 C: the corrected FisherTransform.c must contain no `static` token (comments and strings excluded): the structural check for F-1. generator.lint_no_static; seen to fire on the superseded body (2 hits, ft_Value1 and ft_Fish: test_generator_fsh). (c) It does NOT see the non-static global `var ft_Trigger` of the old file; F-1's trigger global is covered by the trigger check and by [corrected_code]. Until stage 2 the current file has both statics: lint reports it, as it reports the missing FisherTransform_Superseded.c include."


# D2 floor per quantity (see source).

[floor]
trace = 1.06421538248469e-11
invariance = 5.31930055558405e-12
ramp_exact = 0.0
flat_zero = 0.0
trigger = 0.0
bound = 0.0
imp_exported_x_FR10 = 5.234035427292838e-12
imp_exported_x_FR20 = 1.4743761767022079e-12
x_1ulp_FR10 = 1.06421538248469e-11
x_1ulp_FR20 = 2.8617108682738035e-12
source = """(b) 2026-11-19, tests/fsh_support.floor_estimates and numbers(). The model IS the corrected code (no trig, no PI, no decimal literal), so the
checker on the own-model raw file gives 0 for trace / ramp_exact / flat_zero / trigger / bound; the floor of this spec is therefore rounding. Two
estimates, max over raw / v1 / out, rows >= W: imp_exported_x = the model on x printed with %.15f (what IMP replays) vs on the exact x (brief item 8:
the export rounding is divided by the range, down to 4.9e-4, and amplified by atanh' near .99); x_1ulp = the model on x moved by -1 / 0 / +1 ulp per
row (numpy default_rng(12345); flat excluded, Zorro's flat is one double) vs the exact x, (c) an estimate of Zorro vs the model if Zorro's sin()
differs from numpy's by an ulp. trace = the largest of the four (FR10 x_1ulp); floor x10 <= 1e-9 (the window holds, brief STOP rule not met).
invariance = the model's own scale / offset difference (finding 6). (c) Expected Zorro vs model at run time: rounding level (LRS 5e-16 on
well-conditioned rows); pass item 7 guards the run value."""

# Expected values: the trace / ramp_exact model per variant (no linear stage, so no tables). Never from the .c file.
