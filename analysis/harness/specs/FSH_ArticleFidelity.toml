[[variants]]
id = "NCB"
role = "info"
label = "NCB: source B (Cybernetic Analysis Fig. 1.7): EMA 1/2, clamp 9999/10000, log gain 1/4, Len 10 vs FR10"
kind = "inline"
function = "fsh_ncb"
params = [10]
expected = "FR10"
outputs = ["raw", "v1", "rng", "trig", "out"]
comment = "INFO variant (not a control, not in [detect]): [corrected_code] with source B's constants (a = b = 1/2, thr = cl = 9999/10000, log gain 1/4; Fish feedback 1/2 as both sources). Reported, never PASS/FAIL. (b) Its v1 reaches .9999 > .999, so its bound-v1 row is above the FR10 bound by 9e-4 (INFO)."
body = '''
var fsh_ncb(vars Price, int Len, var* pRaw, var* pV1, var* pRng, var* pTrig)
{
	vars ncb_V = series(0, 2);
	vars ncb_F = series(0, 2);
	var ncb_a = 1;    ncb_a = ncb_a/2;
	var ncb_b = 1;    ncb_b = ncb_b/2;
	var ncb_t = 9999; ncb_t = ncb_t/10000;
	var ncb_c = 9999; ncb_c = ncb_c/10000;
	var ncb_h = 1;    ncb_h = ncb_h/2;
	var ncb_k = 1;    ncb_k = ncb_k/4;
	var ncb_hi = MaxVal(Price, Len);
	var ncb_lo = MinVal(Price, Len);
	var ncb_rng = ncb_hi - ncb_lo;
	var ncb_raw = 0;
	if(ncb_rng > 0) {
		ncb_raw = Price[0] - ncb_lo;
		ncb_raw = ncb_raw/ncb_rng;
		ncb_raw = ncb_raw - ncb_h;
		ncb_raw = ncb_raw*2;
	}
	ncb_V[0] = ncb_a*ncb_raw + ncb_b*ncb_V[1];
	var ncb_nt = 0;   ncb_nt = ncb_nt - ncb_t;
	var ncb_nc = 0;   ncb_nc = ncb_nc - ncb_c;
	if(ncb_V[0] > ncb_t)  ncb_V[0] = ncb_c;
	if(ncb_V[0] < ncb_nt) ncb_V[0] = ncb_nc;
	var ncb_u = 1;
	var ncb_num = ncb_u + ncb_V[0];
	var ncb_den = ncb_u - ncb_V[0];
	ncb_F[0] = ncb_k*log(ncb_num/ncb_den) + ncb_h*ncb_F[1];
	*pRaw  = ncb_raw;
	*pV1   = ncb_V[0];
	*pRng  = ncb_rng;
	*pTrig = ncb_F[1];
	return ncb_F[0];
}'''
[variants.effect]
trace = 2.7090517957574587
bound = 0.0009000000000000119
ramp_exact = 2.648683558857302
trigger = 0.0
