source = "(b) simulated 3000 bars with the variant's own [imp].must_pass model (NCS / NCT: reference.simulate_fisher_shared over the 16 superseded calls in the generator's actual call order), measured with checker.evaluate on the own-model raw file vs the FR10 model (fisher_article(10)), max over that kind's checks (every output); computed 2026-11-19 (tests/fsh_support.numbers)"

[[variants]]
id = "NCW"
role = "neg_control"
label = "NCW: Value1 weight 331/1000 in place of 33/100 vs FR10"
kind = "inline"
function = "fsh_ncw"
params = [10]
expected = "FR10"
