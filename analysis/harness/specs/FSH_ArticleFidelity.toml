source = "(b) 2026-11-19, tests/fsh_support.numbers() (reference.simulate_fisher / simulate_fisher_shared, checker): the brief's findings 1-8 reproduced; differences are in docs/harness/FSH_STAGE1_REPORT.md. *_all_*: every row of every input incl. the copies. gate_range / gate_clamp: min range/amplitude and min |pre-clamp v1 -/+ .99| of the model, rows >= W. out_min / out_max / clamped_share: rows >= W. <ramp>_*_first_row_*: the first row from which the value is exact (raw, v1) or within 1e-12 of +-ln(1999) (out). invariance_*: model, five sines, rows >= W, ungated. memory_*: n with .67^n / .5^n < 1e-12. startup_efs_*: source A (zero start, window padded with x[0]) vs an EFS-style start (first L-1 bars not computed), max over rows < W and the last row > 1e-12 (INFO, F-5). effect_<c>_<output>_T<T>: control model vs the FR10 model, max |diff| over rows >= W; effect_<c>_<ramp>_*_last: the control model on the ramps, last row. ncs_* / nct_*: the shared-statics replay in the generator's actual call order vs the FR10 model, per input: max |diff| rows >= W / rows < W, rows with |diff| > 1e-12 and the first such row. shared_L10_L20_*: the planning chat's two-instance (L10, L20) check on one sine, rows >= 200."

# ----------------------------------------------------------------------------- pass condition
[pass_condition]
text = """Fisher Transform source fidelity and implementation PASS only if ALL of the following hold; any other outcome is FAIL, recorded and kept (CLAUDE.md
section 4.8), and its cause found before anything is changed:
1. All 56 real checks PASS: 2 variants (FR10, FR20) x 28 checks = raw: 5 trace (one per sine) + 1 bound + 2 ramp_exact (ramp, rampdn) (8) + v1: 5 trace +
   1 bound + 2 ramp_exact (8) + out: 5 trace + 2 invariance (sc, of) + 1 bound + 2 ramp_exact + 1 trigger (11) + 1 flat_zero (raw, v1, out on flat) (1),
   against the model / known answers above at the tolerances above. No linear checks (F-7). INFO rows (flat / ramp / start-up of out, info-*) are written
   with result INFO and are not counted.
2. Each of the 7 negative controls (NCW, NCC, NCK, NCL, NC32, NCS, NCT) FAILS on every kind listed in [detect.required]. A control that passes = harness broken.
3. No input guard fires (x[n] incl. rampdn and the copies vs recomputed, tol 1e-12; clock range), no row is ERROR in ANY variant (a gate that removes every
   row of a sine is an ERROR), no NaN / infinite value. The NCB rows (role info) are written as INFO, never PASS / FAIL, and are not counted in item 1.
   The gated-row counts of every trace row are reported (expected 0 on FR10 / FR20).
4. No line starting with 'Error' in the Zorro window (gotchas 9d.3). The EXITRUN marker / EXIT line is NOT a check (gotchas 9d.4: it never fires).
5. The results file reports the variant count: 2 real + 7 negative controls + 1 info (NCB) = 10 variants.
6. IMP: every [imp].must_pass replay <= 1e-9 (10 variants), and both [imp].must_fail replays > 1e-9 (FR10 vs the NCW model; NCS vs the FR10 model; guard
   seen to fire).
7. Floor guard: for every real variant, max |Zorro - model| <= tolerance / 10 for trace (1e-10), invariance (1e-10), ramp_exact (1e-13), flat_zero (1e-13)
   and trigger (0) (D2 rule 3 floor side). If exceeded, the window is invalid: the result is NOT accepted until explained, even if items 1-6 hold.
Pre-run (not run-time) conditions, done before the [Test] click and recorded in Amendment 1 (stage 2):
   (i) the corrected FisherTransform.c contains [corrected_code].lines and wrapper_lines verbatim (whitespace-normalised, comments stripped);
   (ii) the current FisherTransform.c blob (259954ed90f4674733f41c46b6694c5f1320cfd0 at bdc83da) is recorded and the corrected file differs from it only by
        F-1, F-2, F-3, F-7, F-8 (F-4 kept); FisherTransform_Superseded.c is the current body with ONLY the input change (Price parameter) and ft_ -> fto_;
   (iii) reference.py reproduces this file's floors, effects, [findings] and IMP fire-test numbers to <= 1e-9 (relative 1e-9 for values > 1). Every number
        is stored at full precision. Each inline control body is checked at run time, not by reading: IMP must_pass replays every variant with its own model
        (pass item 6);
   (iv) generator --lint-only passes on this file (D2 windows ok, every required margin >= 10x; after stage 2 also the two includes resolve and the no-static
        check passes);
   (v) no-static lint: indicators/ehlers/FisherTransform.c contains no `static` token (comments excluded); the check is seen to fire on the superseded body
        (2 hits: ft_Value1, ft_Fish). Recorded here and in the results header (INFO L_NO_STATIC line).
   (vi) the callers of FisherTransform (F-2; strategies/tests/Test_Fisher_IFT_COG.c:51-52, strategies/tests/Test_S1_C2_Audit.c:32) are updated to the new
        signature (stage 2); no other caller exists (grep, stage 1 report)."""


# ----------------------------------------------------------------------------- observations (INFO only)
[observations]
O_MARGIN = "Report the generator's D2 INFO lines (floor x10 vs tolerance; per-control margin) in the results header."
O_GATES = "(b) Gate margins of the model, rows >= W (finding gate_*): range/amplitude FR10 1.902 / 1.902 / 1.000 / 0.293 / 0.0489, FR20 1.902 / 1.902 / 2.000 / 1.000 / 0.191; clamp distance FR10 0.661 / 0.431 / 0.0890 / 0.00164 / 0.00120, FR20 0.661 / 0.431 / 0.205 / 0.00172 / 0.000712 (T = 5 / 10 / 20 / 40 / 100). Report the gated-row count of every trace row (expected 0)."
O_SATURATION = "(b) Fisher saturates on long cycles: at T = 100 v1 is clamped on 68% (FR10) / 62% (FR20) of rows >= W and |out| reaches 7.6004 (the bound); at T = 40, FR10, 20% ([findings] clamped_share_*, out_min / out_max_*). The header's old '+-2.5' claim is exceeded at T >= 20 (L10)."
O_WINDOW = "(b) Windowed: T <= L rows are identical for L = 10 and L = 20 (T = 5, 10; findings out_* and gate_*); only T = 20 / 40 / 100 tell window lengths apart (NCL). (c) MaxVal / MinVal semantics (the last Len values incl. [0], history padded with x[0]) are confirmed only by the trace rows of raw at T = 20 / 40 / 100."
O_RAMP = "(b) Ramps: raw = +-1 exactly from row 1 (row 0: the guard, rng = 0), v1 = +-.999 exactly from row 12, out within 1e-12 of +-ln(1999) from row 53 and EXACTLY +-ln(1999) in float64 on rows >= W, for both Len (findings ramp_* / rampdn_*). The bound |out| <= ln(1999) is therefore attained in float64 (finding out_max_abs_all_*), approached only in the reals."
O_FLAT = "(b) Flat: the guard fires on all 3000 rows (rng = 0 exactly), raw = v1 = out = 0 exactly (findings flat_*): an implementation known answer under F-4, PASS/FAIL as flat_zero."
O_STARTUP = "(b) Start-up (F-5, INFO): the source defines none; source A with the window padded by x[0] vs an EFS-style start (first L-1 bars not computed) differs by up to 0.48 / 1.26 / 2.45 / 3.53 / 4.70 (FR10, T = 5 .. 100) with the last row > 1e-12 at <= 80 ([findings] startup_efs_*); W = 700. The info-startup row reports Zorro vs the model on rows < W (INFO, never PASS/FAIL)."
O_NCS = "(b) NCS / NCT (the superseded file, two instances, 16 shared calls per bar in variant-major order): every (instance, input) differs from the FR10 model on rows >= W, by 0.98 (flat) to 9.2 (rampdn) ([findings] ncs_* / nct_*); flat out is not 0 (flat_zero fires). Not a start-up effect: the shared statics are the IIR state."
O_NCB = "(b) NCB (source B, INFO): Fish differs from FR10 by 0.0798 / 0.307 / 0.961 / 2.63 / 2.71 (T = 5 .. 100, rows >= W; findings effect_NCB_out_*); its v1 reaches .9999, its ramp Fish 4.951718775643098 (= ln(19999)/2 to rounding). Choosing B for trading is a later slot decision on backtest evidence (review section 4)."
O_NC32 = "(b) NC32 (float32 literals, F-3): out effect 1.396e-08 / 5.860e-08 / 5.316e-07 / 1.242e-05 / 1.288e-05 (T = 5 .. 100), v1 1.25e-08 .. 8.57e-08, raw 0; on the ramps v1 = float32(.999) = 0.9990000128746033 and out = 7.600415215627072 > ln(1999): ramp_exact and bound fire as well as trace."
O_IMP_RESIDUAL = "Report the IMP residual per real variant and the Zorro-vs-model residual per kind per real variant; the latter is the measured floor (expected at rounding level: no PI gap). IMP replays the exported %.15f x: expected <= ~5e-12 ([floor].imp_exported_x_*), larger than the Zorro-vs-model trace for the reason recorded in LRS Amendment 2 A2.3."
O_STATICS_RESET = "(b) The generated script's own statics (fsh_n, fsh_done, fsh_hdr, fsh_rows) are reset at INITRUN. The superseded file's statics are not (it is called only after INITRUN returns): restart Zorro before a rerun ([run_notes])."

