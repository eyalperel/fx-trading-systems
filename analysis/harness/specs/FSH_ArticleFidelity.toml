comment = "NCW: realistic copying error (D2 rule 4: third digit): [corrected_code] except fi_a = 331/1000 (built from integers). raw unchanged; v1 / out move; the ramps still pin v1 at .999."
body = '''
var fsh_ncw(vars Price, int Len, var* pRaw, var* pV1, var* pRng, var* pTrig)
{
	vars ncw_V = series(0, 2);
	vars ncw_F = series(0, 2);
